<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Code Map Workbench</title>
  <style>
    :root { color-scheme: dark; --bg:#0b1020; --panel:#121a30; --panel2:#0f1730; --text:#dce7ff; --muted:#8ca0c8; --border:#24304d; --accent:#15efaa; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Segoe UI","Microsoft YaHei",sans-serif; background:radial-gradient(circle at top,#162342,#0b1020 45%); color:var(--text); }
    .app { display:grid; grid-template-rows:auto 1fr; height:100vh; position:relative; }
    .busy { position:absolute; top:0; left:0; right:0; height:3px; background:rgba(255,255,255,.05); opacity:0; transition:opacity .12s ease; z-index:80; overflow:hidden; }
    .busy.active { opacity:1; }
    .busy::before { content:''; position:absolute; top:0; left:-30%; width:30%; height:100%; background:linear-gradient(90deg,transparent,var(--accent),transparent); animation:busy-slide 1s linear infinite; }
    @keyframes busy-slide { from { left:-30%; } to { left:100%; } }
    .toolbar { display:grid; grid-template-columns:minmax(0,1fr) minmax(220px,320px) minmax(360px,1.25fr) 140px auto auto auto auto auto; gap:8px; padding:10px 12px; border-bottom:1px solid var(--border); background:rgba(9,14,29,.9); align-items:center; }
    .toolbar input,.toolbar select { width:100%; padding:9px 12px; border-radius:10px; border:1px solid rgba(255,255,255,.1); background:rgba(17,26,52,.8); color:var(--text); font-size:13px; }
    .toolbar input::placeholder { color:#8ca0c8; opacity:.85; }
    .toolbar button { padding:9px 12px; border-radius:10px; border:1px solid rgba(255,255,255,.1); background:rgba(23,34,63,.78); color:#d8e5ff; cursor:pointer; font-size:13px; }
    .toolbar button:hover { background:rgba(23,34,63,.94); border-color:rgba(255,255,255,.16); }
    .toolbar .primary { background:rgba(21,239,170,.9); color:#04110d; border-color:transparent; font-weight:700; }
    .build-badge { display:inline-flex; align-items:center; justify-content:center; padding:7px 9px; border-radius:10px; border:1px solid rgba(255,255,255,.05); background:rgba(255,255,255,.02); color:var(--muted); font-size:11px; white-space:nowrap; }
    .layout { display:grid; grid-template-columns:320px 1fr; gap:12px; padding:12px; min-height:0; }
    .panel { min-height:0; display:flex; flex-direction:column; overflow:hidden; background:var(--panel); border:1px solid var(--border); border-radius:14px; }
    .panel h3 { margin:0; padding:12px 14px; border-bottom:1px solid var(--border); font-size:14px; }
    .tree-tools { padding:10px 12px; border-bottom:1px solid var(--border); background:rgba(12,19,36,.96); }
    .tree-tools input { width:100%; padding:8px 10px; border-radius:10px; border:1px solid var(--border); background:#111a34; color:var(--text); }
    .editor-tools { display:flex; gap:6px; align-items:center; padding:8px 10px; border-bottom:1px solid var(--border); background:rgba(12,19,36,.94); flex-wrap:wrap; position:sticky; top:0; z-index:4; box-shadow:0 5px 12px rgba(0,0,0,.18); }
    .editor-tools button { padding:6px 10px; border-radius:10px; border:1px solid rgba(255,255,255,.09); background:rgba(23,34,63,.78); color:#d8e5ff; cursor:pointer; font-size:12px; }
    .editor-tools button:hover { background:rgba(23,34,63,.95); border-color:rgba(255,255,255,.16); }
    .editor-tools button:disabled { opacity:.32; cursor:not-allowed; }
    .tool-info { margin-left:auto; font-size:11px; color:var(--muted); padding:3px 9px; border:1px solid rgba(255,255,255,.05); border-radius:999px; background:rgba(255,255,255,.02); min-width:220px; max-width:60%; overflow-x:auto; overflow-y:hidden; text-overflow:clip; white-space:nowrap; scrollbar-width:thin; }
    .body { padding:12px; overflow:auto; min-height:0; }
    #editor.body { padding-right:26px; }
    .pinned { display:none; padding:12px; border-bottom:1px solid var(--border); background:#0d1426; }
    .pinned.active { display:block; }
    .item,.subitem,.peek-item { padding:8px 10px; border-radius:8px; cursor:pointer; transition:background .12s ease, transform .12s ease, border-color .12s ease, box-shadow .12s ease; }
    .item:hover,.subitem:hover,.peek-item:hover { background:rgba(21,239,170,.08); }
    .item.active,.subitem.active { background:rgba(21,239,170,.12); }
    .subitem { margin-left:12px; }
    .code { font-family:Consolas,monospace; white-space:pre; overflow-x:auto; overflow-y:scroll; background:var(--panel2); border:1px solid var(--border); border-radius:10px; scrollbar-gutter:stable both-edges; padding-right:46px; }
    textarea.editor-area { width:100%; min-height:100%; resize:none; border:1px solid var(--border); border-radius:10px; background:var(--panel2); color:var(--text); padding:12px; font:13px/1.6 Consolas,monospace; }
    .edit-split { display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:10px; height:100%; min-height:0; }
    .edit-side { display:flex; flex-direction:column; min-height:0; }
    .edit-head { padding:8px 10px; border:1px solid var(--border); border-radius:10px; background:#10182d; color:var(--muted); font-size:12px; margin-bottom:8px; }
    .edit-diff { flex:1; min-height:0; overflow:auto; border:1px solid var(--border); border-radius:10px; background:#10182d; }
    .diff-row { display:grid; grid-template-columns:54px 1fr; gap:8px; padding:6px 8px; border-top:1px solid rgba(255,255,255,.05); cursor:pointer; font-family:Consolas,monospace; font-size:12px; }
    .diff-row:first-child { border-top:0; }
    .diff-row:hover { background:rgba(21,239,170,.1); }
    .code.active-scroll { box-shadow: inset 0 0 0 1px rgba(21,239,170,.32), 0 0 0 1px rgba(21,239,170,.18); }
    .line { position:relative; display:grid; grid-template-columns:64px minmax(0,1fr); width:100%; gap:14px; padding:0 12px; }
    .line > span:nth-child(2) { min-width:0; }
    .line.anchor { background:rgba(21,239,170,.10); }
    .line.focus-line { background:linear-gradient(90deg, rgba(21,239,170,.18), rgba(21,239,170,.06) 55%, transparent 88%); }
    .line.function-selected { background:linear-gradient(90deg, rgba(21,239,170,.12), rgba(21,239,170,.03) 55%, transparent 88%); }
    .line.function-selected .num { color:#baffee; }
    .line.symbol-selected { background:linear-gradient(90deg, rgba(255,215,0,.18), rgba(255,215,0,.05) 55%, transparent 88%); }
    .line.symbol-selected .num { color:#ffe77a; }
    .line.current-line { background:linear-gradient(90deg, rgba(124,184,255,.22), rgba(124,184,255,.07) 58%, transparent 88%); }
    .line.current-line .num { color:#a8d1ff; }
    .num { color:var(--muted); text-align:right; border-right:1px solid rgba(255,255,255,.08); padding-right:8px; user-select:none; position:relative; }
    .num.bookmarked::before { content:'•'; position:absolute; left:-8px; color:#ffd76a; }
    .actions { display:flex; gap:4px; align-items:center; padding:2px 0; position:absolute; right:12px; top:50%; transform:translateY(-50%); z-index:4; background:linear-gradient(90deg, rgba(15,23,48,0), rgba(15,23,48,.9) 24%); border-radius:10px; opacity:0; pointer-events:none; transition:opacity .12s ease; }
    .actions:empty { display:none; }
    .line:hover .actions, .line.current-line .actions { opacity:1; pointer-events:auto; }
    .actions button,.peek-item button,.card button { padding:3px 7px; border-radius:999px; border:1px solid var(--border); background:#162440; color:var(--text); cursor:pointer; font-size:11px; transition:transform .12s ease, background .12s ease, border-color .12s ease, box-shadow .12s ease; }
    .actions button:hover,.peek-item button:hover,.card button:hover { transform:translateY(-1px); border-color:rgba(21,239,170,.42); background:rgba(21,239,170,.12); box-shadow:0 0 0 1px rgba(21,239,170,.12); }
    .inline { margin-left:24px; padding-left:16px; border-left:2px solid rgba(21,239,170,.22); display:grid; gap:10px; }
    .inline.focus-branch { border-left-color: rgba(21,239,170,.7); }
    .inline.level-1 { border-left-color: rgba(21,239,170,.55); }
    .inline.level-2 { border-left-color: rgba(74,196,255,.45); }
    .inline.level-3 { border-left-color: rgba(255,190,92,.45); }
    .inline.level-4 { border-left-color: rgba(255,124,124,.45); }
    .token { cursor:pointer; border-radius:4px; padding:0 1px; }
    .token:hover { background:rgba(255,255,255,.08); }
    .token.sel { background:rgba(255,215,0,.22); color:#fff3aa; }
    .card { display:grid; gap:8px; }
    .facts { display:flex; flex-wrap:wrap; gap:6px; }
    .fact,.section,.branch-head { background:#10182d; border:1px solid var(--border); border-radius:10px; padding:8px; transition:border-color .12s ease, box-shadow .12s ease, transform .12s ease, background .12s ease; }
    .branch-head.active { border-color: rgba(21,239,170,.55); box-shadow: 0 0 0 1px rgba(21,239,170,.18), inset 0 0 0 1px rgba(21,239,170,.12); transform: translateY(-1px); background:linear-gradient(180deg, rgba(21,239,170,.10), rgba(16,24,45,.92)); }
    .fact { display:flex; align-items:center; gap:8px; min-width:220px; max-width:100%; }
    .fact .label { color:var(--muted); font-size:11px; margin:0; white-space:nowrap; }
    .fact > div:last-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .section h4 { margin:0 0 6px; font-size:13px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
    .peek-item { display:grid; grid-template-columns:1fr auto auto; gap:8px; align-items:start; }
    .tag { display:inline-flex; align-items:center; justify-content:center; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:600; line-height:1.3; border:1px solid rgba(255,255,255,.10); background:rgba(255,255,255,.05); color:#b7ffe6; margin-right:6px; white-space:nowrap; }
    .muted { color:var(--muted); }
    .status { padding:8px 14px; color:var(--muted); font-size:12px; }
    .crumbs { padding:8px 12px; border-bottom:1px solid var(--border); color:#9ec7ff; font-size:12px; background:rgba(16,24,45,.9); white-space:nowrap; overflow:auto; }
    .bookmark-bar { padding:8px 12px; border-bottom:1px solid var(--border); color:#9ec7ff; font-size:12px; background:rgba(14,21,39,.92); white-space:nowrap; overflow:auto; }
    .bm-chip { display:inline-flex; align-items:center; gap:6px; margin-right:8px; padding:2px 8px; border-radius:999px; border:1px solid rgba(158,199,255,.28); background:rgba(158,199,255,.08); cursor:pointer; color:#cfe4ff; }
    .bm-chip:hover { background:rgba(158,199,255,.15); }
    .bm-chip.danger { border-color:rgba(255,125,125,.35); color:#ffd0d0; background:rgba(255,125,125,.08); }
    .bm-chip.danger:hover { background:rgba(255,125,125,.16); }
    .peek-float { position:fixed; right:10px; top:64px; bottom:10px; width:min(980px, calc(100vw - 20px)); background:#0d1426; border:1px solid var(--border); border-radius:14px; box-shadow:0 20px 40px rgba(0,0,0,.35); display:none; z-index:50; overflow:hidden; }
    .peek-float.active { display:flex; flex-direction:column; }
    .peek-backdrop { position:fixed; inset:0; background:transparent; display:none; z-index:45; }
    .peek-backdrop.active { display:block; }
    .peek-head { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; padding:8px 10px; border-bottom:1px solid var(--border); background:rgba(14,21,41,.96); }
    .peek-head.dragging { cursor:grabbing; }
    .peek-head .title { font-size:11px; color:var(--muted); margin-bottom:2px; }
    .peek-head .name { font-size:14px; font-weight:700; line-height:1.25; }
    .peek-body { padding:8px; overflow:auto; min-height:0; display:grid; gap:8px; }
    .peek-close { padding:8px 12px; border-radius:10px; border:1px solid var(--border); background:#17223f; color:var(--text); cursor:pointer; }
    .peek-code-actions { display:flex; gap:6px; }
    .peek-body .code { max-height:68vh; }
    .peek-body .line { grid-template-columns:54px minmax(0,1fr) auto; gap:10px; padding:0 8px; }
    .peek-empty { color:var(--muted); font-size:13px; }
    .right-hint { color:var(--muted); font-size:13px; line-height:1.7; }
    .search-results { position:absolute; top:62px; left:0; width:min(820px, calc(100vw - 64px)); max-height:62vh; overflow:auto; border:1px solid var(--border); border-radius:14px; background:#10182d; box-shadow:0 18px 36px rgba(0,0,0,.42); z-index:70; display:none; }
    .search-results.active { display:block; }
    .search-row { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:12px; padding:13px 14px; border-top:1px solid rgba(255,255,255,.05); cursor:pointer; align-items:start; }
    .search-row:first-child { border-top:0; }
    .search-row:hover { background:rgba(21,239,170,.08); }
    .search-row.active { background:rgba(21,239,170,.14); }
    .search-kind { font-size:12px; color:#b7ffe6; border:1px solid rgba(21,239,170,.24); border-radius:999px; padding:3px 10px; font-weight:600; }
    .search-main { min-width:0; font-size:15px; line-height:1.4; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .search-sub { margin-top:5px; font-size:13px; line-height:1.45; color:#9fb4da; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .search-hit { background:rgba(255,221,86,.28); color:#ffe9a6; border-radius:3px; padding:0 1px; }
    .tree-empty { color:var(--muted); font-size:12px; padding:8px; }
    .cmd-backdrop { position:fixed; inset:0; background:rgba(4,8,18,.46); display:none; z-index:120; }
    .cmd-backdrop.active { display:block; }
    .cmd-palette { width:min(760px, calc(100vw - 40px)); margin:8vh auto 0; background:#0d1426; border:1px solid var(--border); border-radius:14px; box-shadow:0 20px 40px rgba(0,0,0,.45); overflow:hidden; }
    .cmd-input { width:100%; border:0; border-bottom:1px solid var(--border); background:#111a34; color:var(--text); padding:14px 16px; font-size:14px; outline:none; }
    .cmd-list { max-height:56vh; overflow:auto; }
    .cmd-row { display:grid; grid-template-columns:1fr auto; gap:8px; padding:10px 14px; border-top:1px solid rgba(255,255,255,.05); cursor:pointer; }
    .cmd-row:first-child { border-top:0; }
    .cmd-row.active,.cmd-row:hover { background:rgba(21,239,170,.12); }
    .cmd-hint { color:var(--muted); font-size:12px; }
    .ctx-menu { position:fixed; min-width:180px; background:#0f1730; border:1px solid var(--border); border-radius:10px; box-shadow:0 14px 30px rgba(0,0,0,.45); padding:6px; z-index:130; display:none; }
    .ctx-menu.active { display:block; }
    .ctx-item { width:100%; text-align:left; border:0; background:transparent; color:var(--text); padding:8px 10px; border-radius:8px; cursor:pointer; }
    .ctx-item:hover { background:rgba(21,239,170,.12); }
    .toast-area { position:fixed; right:14px; bottom:14px; z-index:140; display:grid; gap:8px; width:min(360px, calc(100vw - 28px)); }
    .toast { padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:#0f1730; color:var(--text); box-shadow:0 10px 22px rgba(0,0,0,.35); font-size:12px; }
    .toast.ok { border-color:rgba(21,239,170,.4); }
    .toast.err { border-color:rgba(255,125,125,.45); }
  </style>
</head>
<body>
<div class="app">
  <div class="busy" id="busy"></div>
  <div class="toolbar">
    <input id="root" placeholder="输入工程目录，例如 D:\GreenLaser-Organized\firmware\gd303_unified">
    <select id="recent"><option value="">最近工程</option></select>
    <div style="position:relative;"><input id="search" placeholder="搜索文件 / 函数"><div class="search-results" id="search-results"></div></div>
    <select id="scan-mode"><option value="whitelist">Whitelist</option><option value="full">Full 扫描</option></select>
    <button id="pick">选择目录</button>
    <button id="sample">示例工程</button>
    <button id="keil-flags">Keil参数</button>
    <button class="primary" id="scan">导入并建索引</button>
    <span class="build-badge">Build 2026-03-28</span>
  </div>
  <div class="layout">
    <section class="panel"><h3>目录</h3><div class="tree-tools"><input id="tree-filter" placeholder="过滤文件/函数"></div><div class="body" id="tree"></div></section>
    <section class="panel"><h3 id="title">请选择文件或函数</h3><div class="editor-tools"><button id="back">← 返回</button><button id="forward">→ 前进</button><button id="fold-all">折叠全部</button><button id="unfold-all">展开全部</button><button id="edit">编辑文件</button><button id="save">保存</button><button id="cancel-edit">取消编辑</button><button id="copy-path">复制路径</button><span class="tool-info" id="tool-info">未选中</span></div><div class="crumbs" id="crumbs">调用链: -</div><div class="bookmark-bar" id="bookmark-bar">书签: -</div><div class="pinned" id="pinned"></div><div class="body" id="editor"></div><div class="status" id="status">未导入工程</div></section>
  </div>
  <div class="peek-backdrop" id="peek-backdrop"></div>
  <div class="peek-float" id="peek-float">
    <div class="peek-head" id="peek-head">
      <div>
        <div class="title">Peek</div>
        <div class="name" id="peek-name">未选中符号</div>
        <div class="muted" id="peek-meta"></div>
      </div>
      <div class="peek-code-actions">
        <button class="peek-close" id="peek-copy">复制代码</button>
        <button class="peek-close" id="peek-pin">Pin</button>
        <button class="peek-close" id="peek-close">关闭</button>
      </div>
    </div>
    <div class="peek-body" id="peek"></div>
  </div>
  <div class="cmd-backdrop" id="cmd-backdrop">
    <div class="cmd-palette">
      <input class="cmd-input" id="cmd-input" placeholder="输入命令，例如：跳到行、折叠全部、保存">
      <div class="cmd-list" id="cmd-list"></div>
    </div>
  </div>
  <div class="ctx-menu" id="ctx-menu"></div>
  <div class="toast-area" id="toast-area"></div>
</div>
<script>
const UI_STATE_KEY='cmw_ui_state_v1';
const SESSION_STATE_KEY='cmw_session_state_v1';
const API={call:async(method,...params)=>{state.busyCount++; updateBusy(); try { const r=await fetch('/api/call',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({method,params})}); return await r.json(); } finally { state.busyCount=Math.max(0,state.busyCount-1); updateBusy(); }}};
const state={projectId:'',files:[],file:null,fileSource:null,focusFunction:null,children:{},expanded:{},selectedSymbol:'',selectedPath:'',selectedLine:0,selectedColumn:0,peek:null,pinned:null,busyCount:0,detailPath:'',detailLine:0,focusBranch:'',focusFunctionId:'',navHistory:[],navIndex:-1,restoringHistory:false,editorMode:'view',editorDraft:'',searchItems:[],searchIndex:-1,searchSeq:0,searchTerm:'',inlineMeta:{},inlineResolved:{},foldedFns:{},bookmarks:{},cmdActions:[],cmdIndex:0,autoCenter:false,scanMode:'whitelist',viewAnchorSource:'manual'};
let _peekTimer=null;
const _peekCache=new Map();
const dom={root:document.getElementById('root'),recent:document.getElementById('recent'),search:document.getElementById('search'),searchResults:document.getElementById('search-results'),scan:document.getElementById('scan'),scanMode:document.getElementById('scan-mode'),keilFlags:document.getElementById('keil-flags'),sample:document.getElementById('sample'),pick:document.getElementById('pick'),tree:document.getElementById('tree'),treeFilter:document.getElementById('tree-filter'),editor:document.getElementById('editor'),title:document.getElementById('title'),crumbs:document.getElementById('crumbs'),bookmarkBar:document.getElementById('bookmark-bar'),peek:document.getElementById('peek'),peekBackdrop:document.getElementById('peek-backdrop'),peekFloat:document.getElementById('peek-float'),peekHead:document.getElementById('peek-head'),peekName:document.getElementById('peek-name'),peekMeta:document.getElementById('peek-meta'),peekClose:document.getElementById('peek-close'),peekCopy:document.getElementById('peek-copy'),peekPin:document.getElementById('peek-pin'),pinned:document.getElementById('pinned'),busy:document.getElementById('busy'),status:document.getElementById('status'),toolInfo:document.getElementById('tool-info'),back:document.getElementById('back'),forward:document.getElementById('forward'),foldAll:document.getElementById('fold-all'),unfoldAll:document.getElementById('unfold-all'),edit:document.getElementById('edit'),save:document.getElementById('save'),cancelEdit:document.getElementById('cancel-edit'),copyPath:document.getElementById('copy-path'),cmdBackdrop:document.getElementById('cmd-backdrop'),cmdInput:document.getElementById('cmd-input'),cmdList:document.getElementById('cmd-list'),ctxMenu:document.getElementById('ctx-menu'),toastArea:document.getElementById('toast-area')};
dom.sample.onclick=()=>{dom.root.value='E:\\相位\\1\\green'; scan();}; dom.scan.onclick=scan; dom.pick.onclick=pickFolder;
dom.keilFlags.onclick=()=>loadKeilCompileContext();
dom.recent.onchange=()=>{ if(dom.recent.value){ dom.root.value=dom.recent.value; scan(); } };
if(dom.scanMode){dom.scanMode.onchange=()=>{state.scanMode=dom.scanMode.value||'whitelist'; saveUiState();};}
let searchTimer=null;
dom.search.oninput=()=>{
  clearTimeout(searchTimer);
  const q=dom.search.value.trim();
  if(!q){
    state.searchTerm='';
    state.searchItems=[];
    state.searchIndex=-1;
    hideSearchResults();
    if(state.fileSource && state.editorMode==='view') renderEditor();
    return;
  }
  searchTimer=setTimeout(()=>searchNow(),300);
};
dom.search.onkeydown=e=>handleSearchKey(e);
dom.root.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); scan(); } };
dom.treeFilter.oninput=()=>renderTree();
dom.peekBackdrop.onclick=()=>closePeek();
dom.back.onclick=()=>goBack(); dom.forward.onclick=()=>goForward(); dom.foldAll.onclick=()=>foldAllFunctions(); dom.unfoldAll.onclick=()=>unfoldAllFunctions(); dom.edit.onclick=()=>startEdit(); dom.save.onclick=()=>saveEdit(); dom.cancelEdit.onclick=()=>cancelEdit(); dom.copyPath.onclick=async()=>{if(state.fileSource?.path){await navigator.clipboard.writeText(state.fileSource.path); setStatus('已复制路径','ok');}};
dom.peekClose.onclick=(e)=>{e.stopPropagation(); closePeek();};
dom.peekCopy.onclick=async()=>{const text=(state.peek?.lines||[]).map(line=>`${line.line_number}  ${line.text}`).join('\n'); await navigator.clipboard.writeText(text); setStatus('已复制 Peek 代码','ok');};

document.addEventListener('keydown', e=>{

  if(dom.cmdBackdrop.classList.contains('active')&&e.key==='Escape'){ e.preventDefault(); closeCommandPalette(); return; }
  if((e.ctrlKey||e.metaKey)&&String(e.key).toLowerCase()==='k'){ e.preventDefault(); openCommandPalette(); return; }
  if(!typing&&e.altKey&&e.key==='ArrowUp'){ e.preventDefault(); goBack(); return; }
  if(!typing&&e.altKey&&e.key==='ArrowDown'){ e.preventDefault(); goForward(); return; }
  if(!typing&&(e.ctrlKey||e.metaKey)&&e.key==='Enter'){ e.preventDefault(); openPeekAtSelection(); return; }
  if(!typing&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!e.shiftKey&&e.key==='Enter'){ e.preventDefault(); toggleExpandAtSelection(); return; }
  if(!typing&&e.shiftKey&&e.key==='Enter'){ e.preventDefault(); toggleExpandAtSelection(); return; }
  if(!typing&&e.altKey&&e.key==='Enter'){ e.preventDefault(); openPeekAtSelection(); return; }
  if(!typing&&e.key==='F4'){ e.preventDefault(); jumpFunction(e.shiftKey?-1:1); return; }
  if(!typing&&e.key==='F12'){ e.preventDefault(); if(e.shiftKey) showSymbolReferences(); else goToSymbolDefinition(); return; }
  if(!typing&&e.ctrlKey&&e.key==='F2'){ e.preventDefault(); if(state.fileSource?.path&&state.detailLine) toggleBookmark(state.fileSource.path,state.detailLine,true); return; }
  if(!typing&&!e.ctrlKey&&e.key==='F2'){ e.preventDefault(); jumpBookmark(e.shiftKey?-1:1); return; }
  if(!typing&&(e.ctrlKey||e.metaKey)&&String(e.key).toLowerCase()==='g'){ e.preventDefault(); jumpToLineByPrompt(); return; }
  if((e.ctrlKey||e.metaKey)&&String(e.key).toLowerCase()==='f'){
    e.preventDefault();
    dom.search.focus();

async function showPerfStats(){

  if(!r?.success){setStatus(r?.error||'性能统计获取失败','err');return;}
  const rows=r.rows||[];
  if(!rows.length){setStatus('暂无性能样本','ok');return;}
  const by={}; rows.forEach(x=>{by[x.metric]=x;});
  const s=Number(by['search']?.p95_ms||0);
  const n=Number(by['navigation']?.p95_ms||0);
  const nn=Number(by['navigation.non_cache_p95_ms']?.p95_ms||0);
  const modePart=`normal: searchP95=${s.toFixed(2)}ms navP95=${n.toFixed(2)}ms; coldish: navP95=${nn.toFixed(2)}ms`;
  const gatePart=`gate(search<150=${s<150?'PASS':'FAIL'}, nav<300=${nn<300?'PASS':'FAIL'})`;
  const top=rows.sort((a,b)=>Number(b.p95_ms||0)-Number(a.p95_ms||0)).slice(0,4);

}

function handleContextMenu(e){

  const lineEl=e.target.closest?.('[data-line][data-path]');
  if(!token&&!lineEl) return;
  e.preventDefault();
  const items=[];
  if(token){
    const symbol=token.dataset.symbol;
    const path=token.dataset.path||state.fileSource?.path;
    const line=Number(token.dataset.line||state.detailLine||0);
    const col=Number(token.dataset.col||1);
    items.push({label:`Peek ${symbol}`,run:()=>openPeek(symbol,path,line)});
    items.push({label:`跳到定义 ${symbol}`,run:async()=>{state.selectedSymbol=symbol;state.selectedPath=path||'';state.selectedLine=line;state.selectedColumn=col;await goToSymbolDefinition();}});
    items.push({label:`查找引用 ${symbol}`,run:async()=>{state.selectedSymbol=symbol;state.selectedPath=path||'';state.selectedLine=line;state.selectedColumn=col;await showSymbolReferences();}});
    items.push({label:`复制符号 ${symbol}`,run:async()=>{await navigator.clipboard.writeText(symbol);setStatus('已复制符号','ok');}});
  }
  if(lineEl){
    const p=lineEl.dataset.path; const ln=Number(lineEl.dataset.line||0);

async function loadSessionState(){
  try{
    const raw=localStorage.getItem(SESSION_STATE_KEY);
    if(!raw) return false;
    const s=JSON.parse(raw);
    if(!s||!s.root) return false;
    dom.root.value=s.root;
    if(dom.treeFilter&&s.treeFilter) dom.treeFilter.value=s.treeFilter;
    if(s.searchTerm){dom.search.value=s.searchTerm;state.searchTerm=s.searchTerm;}
    if(s.selectedSymbol) state.selectedSymbol=s.selectedSymbol;
    if(s.selectedPath) state.selectedPath=s.selectedPath;
    state.selectedLine=Number(s.selectedLine||0);
    state.selectedColumn=Number(s.selectedColumn||0);
    await scan();
    if(!state.projectId) return false;
    let loaded=false;
    if(s.focusFunctionId){
      const d=await API.call('get_function',state.projectId,s.focusFunctionId);
      if(d?.success&&d.function){
        const src=await API.call('get_file_source',state.projectId,d.function.file_id);
        state.file={...(state.file||{}),id:d.function.file_id,path:d.function.path};
        state.fileSource=src;
        state.focusFunction=d.function;
        state.focusFunctionId=d.function.id;
        state.detailPath=src.path;
        state.detailLine=Number(s.detailLine||d.function.start_line||1);
        loaded=true;
      }
    }
    if(!loaded&&s.filePath){
      const file=state.files.find(x=>x.path===s.filePath);
      if(file){
        const d=await API.call('get_file',state.projectId,file.id);
        const src=await API.call('get_file_source',state.projectId,file.id);
        state.file=d.file;
        state.fileSource=src;
        state.focusFunction=findFunctionByLine(d.file?.functions||[],Number(s.detailLine||1));
        state.focusFunctionId=state.focusFunction?.id||'';
        state.detailPath=src.path;
        state.detailLine=Number(s.detailLine||1);
        loaded=true;
      }
    }
    if(!loaded) return false;
    const restoredExpanded={};
    (s.expandedKeys||[]).forEach(k=>{if(k) restoredExpanded[k]=true;});
    state.expanded=restoredExpanded;
    state.focusBranch=String(s.focusBranch||'');
    state.navHistory=Array.isArray(s.navHistory)?s.navHistory.slice(-40):[];
    state.navIndex=Math.max(-1,Math.min(state.navHistory.length-1,Number(s.navIndex??(state.navHistory.length-1))));
    renderTree();
    await renderEditor();
    if(s.searchTerm) searchNow();
    await restorePeekState(s.peek);
    await restorePinnedState(s.pinned);
    updateToolButtons();
    return true;
  }catch{
    return false;
  }
}

async function resolveFunctionIdByDefinition(name,path,line){
  const file=state.files.find(x=>x.path===path);
  if(!file) return '';
  const d=await API.call('get_file',state.projectId,file.id);
  const rows=(d?.file?.functions||[]);
  const ln=Number(line||1);
  const exact=rows.find(fn=>fn.name===name && ln>=Number(fn.start_line||0) && ln<=Number(fn.end_line||0));
  if(exact) return exact.id;
  const near=rows.find(fn=>ln>=Number(fn.start_line||0) && ln<=Number(fn.end_line||0));
  return near?.id||'';

function tokenizedLite(text){return highlightText(text,state.searchTerm);}
function tokenized(text,path,line){
  const raw=String(text||'');
  const term=state.searchTerm;
  const re=/\b[A-Za-z_]\w*\b/g;
  let out=''; let last=0; let m;
  while((m=re.exec(raw))!==null){
    out += highlightText(raw.slice(last,m.index),term);
    const token=m[0];
    const col = (m.index||0) + 1;
    out += `<span class="token ${state.selectedSymbol===token?'sel':''}" data-symbol="${token}" data-path="${path}" data-line="${line}" data-col="${col}">${highlightText(token,term)}</span>`;
    last = m.index + token.length;
  }
  out += highlightText(raw.slice(last),term);
  return out;
}
async function ensureChildren(fnId){if(state.children[fnId])return state.children[fnId];const r=await API.call('get_calls',state.projectId,fnId,'out');state.children[fnId]=r.calls||[];return state.children[fnId];}
async function renderEditor(){
  if(!state.fileSource?.lines){dom.editor.innerHTML='请选择左侧文件或函数';updateToolButtons();updateToolInfo();updateCrumbs();renderBookmarkBar();return;}
  dom.title.textContent=state.fileSource.path||'源码';
  if(state.editorMode==='edit'){
    const diff=changedLines(state.fileSource.source||'',state.editorDraft||'');
    const preview=(state.editorDraft||'').split('\n');
    dom.editor.innerHTML=`<div class="edit-split"><textarea class="editor-area" id="editor-area"></textarea><div class="edit-side"><div class="edit-head">改动 ${diff.length} 行</div><div class="edit-diff" id="edit-diff">${diff.length?diff.map(line=>`<div class="diff-row" data-diff-line="${line}"><span class="num">${line}</span><span>${escapeHtml(preview[line-1]||'')}</span></div>`).join(''):'<div class="diff-row"><span class="num">-</span><span class="muted">暂无改动</span></div>'}</div></div></div>`;
    const ta=document.getElementById('editor-area');
    const diffBox=document.getElementById('edit-diff');
    const renderDiffList=()=>{
      if(!diffBox) return;
      const changed=changedLines(state.fileSource.source||'',state.editorDraft||'');
      const previewLines=(state.editorDraft||'').split('\n');
      const head=dom.editor.querySelector('.edit-head');
      if(head) head.textContent=`改动 ${changed.length} 行`;
      diffBox.innerHTML=changed.length?changed.map(line=>`<div class="diff-row" data-diff-line="${line}"><span class="num">${line}</span><span>${escapeHtml(previewLines[line-1]||'')}</span></div>`).join(''):'<div class="diff-row"><span class="num">-</span><span class="muted">暂无改动</span></div>';
      diffBox.querySelectorAll('[data-diff-line]').forEach(row=>row.onclick=()=>jumpEditorLine(Number(row.dataset.diffLine||1)));
    };
    ta.value=state.editorDraft||state.fileSource.source||'';
    ta.oninput=()=>{state.editorDraft=ta.value;renderDiffList();saveSessionState();};
    renderDiffList();
    updateToolButtons();updateToolInfo();updateCrumbs();renderBookmarkBar();
    saveSessionState();
    return;
  }
  const rootFn=state.focusFunction;
  state.inlineMeta={};
  const lineCallMap={};
  if(rootFn){
    const children=await ensureChildren(rootFn.id);
    children.forEach((c,i)=>{const k=`${rootFn.id}>${i}`;state.inlineMeta[k]={name:c.name,parent:''};lineCallMap[c.line] ||= [];lineCallMap[c.line].push({...c,inlineKey:k});});
  }
  const fnByStart={};
  for(const fn of (state.file?.functions||[])) fnByStart[fn.start_line]=fn;
  let skipUntil=0;
  const totalLines=state.fileSource.lines.length;
  const useLite=totalLines>200;
  const detailLine=state.detailLine||0;
  const liteBuffer=60;
  let html='<div class="code" id="main-code">';
  for(const line of state.fileSource.lines){
    if(line.line_number<=skipUntil) continue;
    const fnAtLine=fnByStart[line.line_number];
    const folded=fnAtLine&&state.foldedFns[fnAtLine.id];
    const inRoot=rootFn&&line.line_number>=rootFn.start_line&&line.line_number<=rootFn.end_line;
    const anchor=((rootFn&&line.line_number===rootFn.start_line) || (state.detailPath===state.fileSource.path&&state.detailLine===line.line_number))?' anchor':'';
    const curLine=(state.detailPath===state.fileSource.path&&state.detailLine===line.line_number)?' current-line':'';
    const fnSel=(rootFn&&line.line_number>=rootFn.start_line&&line.line_number<=rootFn.end_line)?' function-selected':'';
    const symSel=lineSymbolClass(line.text);
    const bm=isBookmarked(state.fileSource.path,line.line_number);
    const nearFocus=inRoot||Math.abs(line.line_number-detailLine)<liteBuffer;
    const content=(useLite&&!nearFocus)?tokenizedLite(line.text):tokenized(line.text,state.fileSource.path,line.line_number);
    html+=`<div class="line${anchor}${curLine}${fnSel}${symSel}" data-line="${line.line_number}" data-path="${state.fileSource.path}"><span class="num${bm?' bookmarked':''}">${line.line_number}</span><span>${content}${folded?` <span class="muted">/* 已折叠 ${Math.max(0,fnAtLine.end_line-fnAtLine.start_line)} 行 */</span>`:''}</span><span class="actions">`;
    if(fnAtLine) html+=`<button data-toggle-fold="${fnAtLine.id}">${folded?'展开':'折叠'}</button>`;
    if(inRoot&&lineCallMap[line.line_number]){for(const c of lineCallMap[line.line_number]){const col=Math.max(1,String(line.text||'').indexOf(c.name||'')+1||1); html+=`<button data-expand="${c.inlineKey}" data-expand-fn="${c.function_id||''}" data-expand-name="${c.name||''}" data-expand-path="${state.fileSource.path}" data-expand-line="${c.line||0}" data-expand-col="${col}">${state.expanded[c.inlineKey]?'收起':'展开'} ${c.name}</button>`;}}
    html+='</span></div>';
    if(folded){skipUntil=fnAtLine.end_line;continue;}
    if(inRoot&&lineCallMap[line.line_number]){for(const c of lineCallMap[line.line_number]) if(state.expanded[c.inlineKey]) html+=await renderInlineBlock(c,1);}
  }
  html+='</div>';
  dom.editor.innerHTML=html;
  bindEditorActions();
  bindCodeFocus();
  updateTokenSelection();
  scrollToDetail();
  updateToolButtons();
  updateToolInfo();
  updateCrumbs();
  renderBookmarkBar();
  saveSessionState();
}
async function renderInlineBlock(child, depth=1){const resolvedFnId=state.inlineResolved[child.inlineKey]||child.function_id;const src=await API.call('get_function_source',state.projectId,resolvedFnId);const children=await ensureChildren(resolvedFnId);const byLine={};children.forEach((it,i)=>{const k=`${child.inlineKey}>${i}`;state.inlineMeta[k]={name:it.name,parent:child.inlineKey};byLine[it.line] ||= [];byLine[it.line].push({...it,inlineKey:k});});const levelClass=`level-${Math.min(depth,4)}`;const branchClass=(state.focusBranch===child.inlineKey)?' focus-branch':'';const headActive=(state.focusFunctionId===resolvedFnId||state.focusBranch===child.inlineKey)?' active':'';const headMeta=`${src.path||child.path} : def ${src.start_line||child.def_line||'-'} · call ${child.line}`;let html=`<div class="inline ${levelClass}${branchClass}"><div class="branch-head${headActive}"><div><strong>${child.name}</strong></div><div class="muted">${headMeta}</div><div class="actions"><button data-root="${resolvedFnId}">设为根节点</button><button data-branch-focus="${child.inlineKey}">只保留当前分支</button><button data-branch-collapse="${child.inlineKey}">收起同级</button></div></div><div class="code">`;for(const line of src.lines||[]){const anchor=(state.detailPath===src.path&&state.detailLine===line.line_number)?' anchor':'';const fnSel=' function-selected';const focusLine=(state.focusFunctionId===resolvedFnId&&line.line_number===src.start_line)?' focus-line':'';const symSel=lineSymbolClass(line.text);html+=`<div class="line${anchor}${fnSel}${focusLine}${symSel}" data-line="${line.line_number}" data-path="${src.path}"><span class="num">${line.line_number}</span><span>${tokenized(line.text,src.path,line.line_number)}</span><span class="actions">`;if(byLine[line.line_number]){for(const nested of byLine[line.line_number]){const col=Math.max(1,String(line.text||'').indexOf(nested.name||'')+1||1); html+=`<button data-expand="${nested.inlineKey}" data-expand-fn="${nested.function_id||''}" data-expand-name="${nested.name||''}" data-expand-path="${src.path}" data-expand-line="${nested.line||0}" data-expand-col="${col}">${state.expanded[nested.inlineKey]?'收起':'展开'} ${nested.name}</button>`;}}html+='</span></div>';if(byLine[line.line_number]){for(const nested of byLine[line.line_number]) if(state.expanded[nested.inlineKey]) html+=await renderInlineBlock(nested,depth+1);}}html+='</div></div>';return html;}
function bindEditorActions(){
  dom.editor.querySelectorAll('.line[data-path][data-line]').forEach(row=>row.onclick=e=>{
    if(e.target.closest('button') || e.target.closest('[data-symbol]')) return;

    const row=btn.closest('[data-path][data-line]');
    const snap=captureViewport(row?{path:row.dataset.path,line:Number(row.dataset.line)}:null);
    const key=btn.dataset.expand;
    const willOpen=!state.expanded[key];
    state.expanded[key]=willOpen;
    state.focusBranch=btn.dataset.expand;
    const fallbackFn=btn.dataset.expandFn||'';
    const expandName=btn.dataset.expandName||'';
    const expandPath=btn.dataset.expandPath||row?.dataset?.path||state.fileSource?.path||'';
    const expandLine=Number(btn.dataset.expandLine||row?.dataset?.line||0);
    const expandCol=Number(btn.dataset.expandCol||1);
    const before=(willOpen)?currentNavPoint():null;
    if(before) recordNav(before);
    if(willOpen){
      let expandFn=fallbackFn;
      const sem=await resolveExpandTarget(expandName,expandPath,expandLine,expandCol);
      if(sem?.fnId){
        expandFn=sem.fnId;
        state.inlineResolved[key]=sem.fnId;
      }else if(fallbackFn){
        state.inlineResolved[key]=fallbackFn;
      }
      if(expandFn){
      const d=await API.call('get_function',state.projectId,expandFn);
      if(d?.success&&d.function){
        state.focusFunctionId=d.function.id;
        state.detailPath=d.function.path;
        state.detailLine=Number(d.function.start_line||state.detailLine||1);
      }
      }
    }
    await renderEditor();
    if(before){const after=currentNavPoint(); if(after) recordNav(after);}
    if(willOpen){
      alignBranchHead(key);
      setStatusBar(`已展开 ${expandName||'分支'} @ ${expandPath||state.detailPath}:${expandLine||state.detailLine}`);

  dom.editor.querySelectorAll('[data-root]').forEach(btn=>btn.onclick=async()=>{

    state.children={};

    const row=btn.closest('[data-path][data-line]');

  dom.editor.querySelectorAll('[data-branch-collapse]').forEach(btn=>btn.onclick=async()=>{
    const row=btn.closest('[data-path][data-line]');
    const snap=captureViewport(row?{path:row.dataset.path,line:Number(row.dataset.line)}:null);

    const path = el.dataset.path || state.fileSource?.path || '';
    const line = Number(el.dataset.line || state.detailLine || 0);
    const col = Number(el.dataset.col || 1);
    state.selectedSymbol=el.dataset.symbol;
    state.selectedPath=path;
    state.selectedLine=line;
    state.selectedColumn=col;
    updateTokenSelection();
    await openPeek(el.dataset.symbol,path,line);
  });
}
async function openPeek(symbol,path,line){
  clearTimeout(_peekTimer);
  _peekTimer=setTimeout(async()=>{
    const cacheKey=`${symbol}|${path}|${line||0}`;
    const cached=_peekCache.get(cacheKey);
    if(cached){state.peek=cached;renderPeek();return;}
    const file=state.files.find(x=>x.path===path);
    const r=await API.call('peek_symbol',state.projectId,symbol,file?.id||null,line||null);
    state.peek=r.success?r:null;
    if(r.success){_peekCache.set(cacheKey,r);if(_peekCache.size>64){const first=_peekCache.keys().next().value;_peekCache.delete(first);}}
    renderPeek();
  },120);
}
function renderPeek(){
  if(!state.peek){
    dom.peek.innerHTML='<div class="peek-empty">点击变量/宏/类型查看源头</div>';
    dom.peekFloat.classList.remove('active');
    return;
  }
  const data=state.peek;
  dom.peekFloat.classList.add('active');
  dom.peekBackdrop.classList.add('active');
  dom.peekName.textContent=data.symbol||'符号';
  dom.peekMeta.textContent=`${data.path||''} : ${data.line||''}${data.kind?` · ${data.kind}`:''}`;
  let html='<div class="card"><div class="facts">';
  for(const fact of data.facts||[]){
    html+=`<div class="fact"><div class="label">${fact.label}</div><div>${fact.value}</div></div>`;
  }
  html+='</div>';
  for(const section of data.sections||[]){
    html+=`<div class="section"><h4><span>${section.title}</span>${section.path?`<button data-jump-path="${section.path}" data-jump-line="${section.line}">定位源头</button>`:''}</h4>`;
    if(section.kind==='code'){
      html+='<div class="code">';
      for(const line of section.lines||[]){
        html+=`<div class="line"><span class="num">${line.line_number}</span><span>${tokenized(line.text,section.path,line.line_number)}</span><span></span></div>`;
      }
      html+='</div>';
    }else{
      for(const item of section.items||[]){
        html+=`<div class="peek-item"><div>${item.tag?`<span class="tag">${item.tag}</span>`:''}${item.name||''}</div><div>${item.detail||''}</div><div class="actions">${item.function_id?`<button data-open-fn="${item.function_id}">看函数</button>`:''}${item.path?`<button data-jump-path="${item.path}" data-jump-line="${item.line}">定位</button>`:''}</div></div>`;
      }
    }
    html+='</div>';
  }
  html+='<div class="code">';
  for(const line of data.lines||[]){
    html+=`<div class="line"><span class="num">${line.line_number}</span><span>${tokenized(line.text,data.path,line.line_number)}</span><span></span></div>`;
  }
  html+='</div></div>';
  dom.peek.innerHTML=html;
  bindPeekActions();
  bindCodeFocus();
}
function bindPeekActions(){
  dom.peek.querySelectorAll('[data-jump-path]').forEach(btn=>btn.onclick=async()=>{
    const jumpPath=btn.dataset.jumpPath||'';
    const jumpLine=Number(btn.dataset.jumpLine||1);
    if(!jumpPath) return;
    await navigateToPathLine(jumpPath,jumpLine,{recordNav:true,showLocated:true,anchorSource:'peek'});
  });
  dom.peek.querySelectorAll('[data-open-fn]').forEach(btn=>btn.onclick=async()=>{
    const d=await API.call('get_function',state.projectId,btn.dataset.openFn);

    state.focusFunction=d.function;
    state.fileSource=s;
    state.expanded={};
    state.children={};
    state.detailPath=s.path;
    state.detailLine=d.function.start_line;

}
function renderPinned(){

    dom.pinned.classList.remove('active');
    dom.pinned.innerHTML='';
    return;
  }
  const data=state.pinned;
  let html=`<div class="card"><div class="actions"><button data-pinned-clear="1">取消顶置</button><button data-pinned-copy="1">复制代码</button><span class="muted">${data.symbol||''} · ${data.path||''}:${data.line||''}</span></div>`;

function isScrollableY(node){
  if(!node || !(node instanceof HTMLElement)) return false;
  const style=window.getComputedStyle(node);
  const overflowY=style.overflowY||style.overflow||'visible';
  return /(auto|scroll|overlay)/.test(overflowY) && node.scrollHeight > node.clientHeight + 4;
}
function centerWithinContainer(container,target){
  if(!container || !target || !(container instanceof HTMLElement) || !(target instanceof HTMLElement)) return false;
  const containerRect=container.getBoundingClientRect();
  const targetRect=target.getBoundingClientRect();
  const delta=(targetRect.top-containerRect.top) - ((container.clientHeight-targetRect.height)/2);
  const nextTop=Math.max(0,(container.scrollTop||0)+delta);
  container.scrollTop=nextTop;
  return true;
}
function centerTargetInView(target){
  if(!target || !(target instanceof HTMLElement)) return false;
  let moved=false;
  let node=target.parentElement;
  while(node){
    if(node===document.body || node===document.documentElement) break;
    if(isScrollableY(node)){
      centerWithinContainer(node,target);
      moved=true;
    }
    node=node.parentElement;
  }
  if(dom.editor && dom.editor!==target && dom.editor instanceof HTMLElement){
    centerWithinContainer(dom.editor,target);
    moved=true;
  }
  if(!moved){
    target.scrollIntoView({block:'center',inline:'nearest'});
    return true;
  }
  return moved;
}
function scrollToDetail(){
  if(!state.autoCenter) return;
  state.autoCenter=false;
  if(!state.detailPath||!state.detailLine)return;
  const selector=`#main-code [data-path="${CSS.escape(state.detailPath)}"][data-line="${state.detailLine}"]`;
  const perform=()=>{
    const exact=dom.editor.querySelector('#main-code .line.current-line');
    const target=exact || dom.editor.querySelector(selector);
    if(target) centerTargetInView(target);
  };
  requestAnimationFrame(()=>requestAnimationFrame(perform));
}
