<!-- 研发调试页面 - 启动入口 -->
<div class="debug-launcher">
    <div class="launcher-card">
        <div class="launcher-icon">🔧</div>
        <h1>研发调试工具</h1>
        <p>专业的嵌入式设备调试助手</p>
        
        <!-- 能力说明 -->
        <div class="capability-grid">
            <div class="cap-item">
                <span class="cap-icon">📡</span>
                <div class="cap-info">
                    <b>多协议支持</b>
                    <span>串口 / WiFi / BLE</span>
                </div>
            </div>
            <div class="cap-item">
                <span class="cap-icon">⚡</span>
                <div class="cap-info">
                    <b>命令管理</b>
                    <span>模板 / 快捷发送</span>
                </div>
            </div>
            <div class="cap-item">
                <span class="cap-icon">📈</span>
                <div class="cap-info">
                    <b>波形显示</b>
                    <span>实时数据可视化</span>
                </div>
            </div>
            <div class="cap-item">
                <span class="cap-icon">🔄</span>
                <div class="cap-info">
                    <b>固件升级</b>
                    <span>OTA / 串口烧录</span>
                </div>
            </div>
        </div>
        
        <!-- 依赖检查 -->
        <div class="dep-check" id="debug-dep-check">
            <div class="dep-row">
                <span class="dep-label">后端服务</span>
                <span class="dep-status" id="dep-backend">检查中...</span>
            </div>
            <div class="dep-row">
                <span class="dep-label">串口可用</span>
                <span class="dep-status" id="dep-serial">检查中...</span>
            </div>
        </div>
        
        <!-- 启动按钮 -->
        <div class="btn-group">
            <button class="btn-launch" onclick="DebugPage.openPyQt()" id="btn-pyqt">
                🖥️ 独立窗口版
                <span class="btn-desc">功能完整，推荐使用</span>
            </button>
            <button class="btn-launch btn-web" onclick="DebugPage.openWeb()">
                🌐 Web版
                <span class="btn-desc">轻量快速</span>
            </button>
        </div>
    </div>
</div>

<style>
.debug-launcher { display:flex; justify-content:center; align-items:center; min-height:70vh; }
.launcher-card { 
    background:var(--card-bg); border:1px solid var(--border-color); 
    border-radius:12px; padding:40px 50px; text-align:center;
    max-width: 500px;
}
.launcher-icon { font-size:56px; margin-bottom:16px; }
.launcher-card h1 { font-size:24px; color:var(--text-color); margin-bottom:8px; }
.launcher-card > p { color:var(--text-muted); margin-bottom:24px; font-size:14px; }

/* 能力网格 */
.capability-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    margin-bottom: 20px; text-align: left;
}
.cap-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; background: var(--input-bg);
    border-radius: 8px; border: 1px solid var(--border-color);
}
.cap-icon { font-size: 20px; }
.cap-info b { display: block; font-size: 13px; font-weight: 600; }
.cap-info span { font-size: 11px; color: var(--text-muted); }

/* 依赖检查 */
.dep-check {
    padding: 12px 16px; background: var(--input-bg);
    border-radius: 8px; margin-bottom: 20px;
}
.dep-row {
    display: flex; justify-content: space-between;
    padding: 6px 0; font-size: 12px;
}
.dep-row:not(:last-child) { border-bottom: 1px solid var(--border-color); }
.dep-label { color: var(--text-muted); }
.dep-status { font-weight: 500; }
.dep-status.ok { color: var(--accent); }
.dep-status.error { color: #ef4444; }

/* 启动按钮 */
.debug-launcher .btn-group { display:flex; gap:12px; justify-content:center; }
.btn-launch { 
    background:var(--accent); color:var(--text-on-accent); border:none; 
    padding:14px 24px; font-size:14px; border-radius:8px; 
    cursor:pointer; transition:all 0.2s; font-weight:500;
    display: flex; flex-direction: column; align-items: center;
}
.btn-launch:hover { transform:translateY(-2px); box-shadow:0 4px 12px var(--accent-glow); }
.btn-launch .btn-desc { font-size: 10px; opacity: 0.8; margin-top: 4px; }
.btn-web { background:var(--color-success, #22c55e); }
</style>
