}

.uit-steps-list {

/* 测试项分组容器 */

}

.uit-case-group-header {
    padding: 8px 12px;
    background: var(--input-bg);

/* 分组内的步骤列表 - 横向滚动 */

    gap: 8px;
    padding: 8px;

    flex: 1;
}

/* 分组内的步骤卡片 - 更紧凑 */
.uit-step-card {
    flex-shrink: 0; width: 160px; background: var(--card-bg);

    cursor: pointer; transition: transform 0.2s;
}

.uit-step-card.current { border-color: var(--accent); box-shadow: 0 0 8px rgba(0,255,136,0.3); }

.uit-step-lcd {
    height: 80px; display: flex; justify-content: center; align-items: center;
    background: #0c1821; padding: 4px;
}

/* 步骤评判状态 */

.uit-step-data {

}

}
.uit-step-data .tx { color: #00d4ff; }
.uit-step-data .rx { color: #a78bfa; }

/* 人工评判面板 */

}

}

.uit-step-judge-panel .judge-btn.fail:hover { background: rgba(255,107,107,0.2); }

/* 评判统计 */

/* 按钮样式 */
.uit-btn {

<!-- 注意: lcd_simulator_page.js, gd303_mini_suite.js, ui_test_lib.js 已在 index.html 中全局加载 -->
<script>
/**
 * UI自动化测试模块 - 从 gd303_mini_suite.js 加载测试用例
 * 
 * 数据源: window.GD303MiniTestSuite (统一测试套件)
 * 动作库: window.UITestLib (动作和期望定义)
 * LCD模拟器: LcdSimulatorPage (像素级渲染)
 */
const UITestPage = {
    template: null,      // 测试模板
    groups: [],          // 分组列表 (从suite转换)
    selectedGroup: null, // 当前选中分组
    results: {},         // 测试结果 { itemKey: { passed, actual, error } }
    running: false,      // 是否正在运行
    aborted: false,      // 是否中止
    statusDetailVisible: false, // 状态详情是否展开
    lcdSimulator: null,  // LCD模拟器实例引用
    
    // 延时配置 (毫秒) - 可根据固件响应速度调整
    delays: {
        afterDebugMode: 30,    // 进入调试模式后
        afterKeyClear: 50,     // K3清除后
        beforeVerify: 80,      // 验证前等待状态稳定
        afterKeyCmd: 100,      // 按键命令后等待固件处理
        afterLcdRead: 50,      // 读取LCD状态后
    },
    
    // 测试报告数据
    testReport: {
        startTime: null,
        endTime: null,
        device: 'GD303 Mini',
        firmwareVersion: '',
        steps: [],  // 每一步的详细记录
        testCases: [],
    },
    
    // 内存管理配置
    memoryConfig: {
        maxSteps: 100,           // 最大保留步骤数
        imageQuality: 0.6,       // 截图质量 (0-1)
        imageMaxWidth: 300,      // 截图最大宽度
        enablePersistence: true, // 启用持久化
    },
    
    async init() {
        console.log('UITestPage init');
        this.updateSerialStatus();
        
        // 加载保存的延时设置
        this.loadDelaySettings();
        
        // 恢复上次的测试数据（如果有）
        this.loadPersistedData();
        
        // 初始化设备配置管理器
        await this.initDeviceManager();
        
        // 加载按键映射
        await this.loadKeymap();
        
        // 延迟初始化LCD模拟器，确保Canvas已渲染且外部脚本已加载
        setTimeout(() => {
            this.initLcdSimulator();
        }, 200);
        
        // 监听串口状态
        if (window.DeviceHub) {
            DeviceHub.onStatusChange(() => this.updateSerialStatus());
        }
        
        // 加载测试用例
        await this.loadTestSuite();
    },
    
    // 当前按键映射缓存
    currentKeymap: null,
    
    // 加载按键映射
    async loadKeymap() {
        const keymapType = document.getElementById('uit-keymap-type')?.value || 'auto';
        let deviceId = keymapType;
        
        // 自动检测：根据当前设备选择
        if (keymapType === 'auto') {
            deviceId = DeviceConfigManager?.getCurrentDevice() || 'default';
        }
        
        try {
            // 调用后端 API 获取按键映射
            const result = await API.call('event_inject_get_keymap', deviceId);
            
            if (result.success && result.mappings) {
                this.currentKeymap = result.mappings;
                this.renderKeymapButtons(result.mappings);
                this.log('info', `加载按键映射: ${deviceId}, ${result.mappings.length} 个按键`);
            } else {
                // 使用默认映射
                this.renderDefaultButtons();
                this.log('info', '使用默认按键映射');
            }
        } catch (e) {
            console.warn('[UITest] 加载按键映射失败:', e);
            this.renderDefaultButtons();
        }
    },
    
    // 渲染按键映射按钮
    renderKeymapButtons(mappings) {
        const container = document.getElementById('uit-keymap-buttons');
        if (!container) return;
        
        // 按按键分组
        const keyGroups = {};
        for (const m of mappings) {
            if (!keyGroups[m.key]) {
                keyGroups[m.key] = [];
            }
            keyGroups[m.key].push(m);
        }
        
        // 生成 HTML
        let html = '';
        for (const [key, buttons] of Object.entries(keyGroups)) {
            html += `<div class="uit-key-group">
                <span class="uit-key-label">${key}:</span>`;
            
            for (const btn of buttons) {
                const isDanger = btn.action === 'POWER_OFF';
                const btnClass = isDanger ? 'uit-btn sm danger' : 'uit-btn sm';
                html += `<button class="${btnClass}" 
                    onclick="UITestPage.sendEventInject(${btn.action_id}, ${btn.trigger_id})"
                    title="${btn.trigger}">${btn.icon}${btn.label.replace(/^[^(]+\(/, '').replace(/\)$/, '')}</button>`;
            }
            
            html += `</div>`;
        }
        
        container.innerHTML = html;
    },
    
    // 渲染默认按钮（备用）
    renderDefaultButtons() {
        const container = document.getElementById('uit-keymap-buttons');
        if (!container) return;
        
        container.innerHTML = `
            <div class="uit-key-group">
                <span class="uit-key-label">K1中间:</span>
                <button class="uit-btn sm" onclick="UITestPage.sendCmd('key_measure')">📏测量</button>
                <button class="uit-btn sm" onclick="UITestPage.sendCmd('key_measure_long')">🔁连续</button>
            </div>
            <div class="uit-key-group">
                <span class="uit-key-label">K2左边:</span>
                <button class="uit-btn sm" onclick="UITestPage.sendCmd('key_mode')">🔄模式</button>
                <button class="uit-btn sm" onclick="UITestPage.sendCmd('key_base')">📐基准</button>
            </div>
            <div class="uit-key-group">
                <span class="uit-key-label">K3右边:</span>
                <button class="uit-btn sm" onclick="UITestPage.sendCmd('key_clear')">🗑️清除</button>
                <button class="uit-btn sm" onclick="UITestPage.sendCmd('key_backlight')">💡背光</button>
                <button class="uit-btn sm danger" onclick="UITestPage.sendCmd('key_power_off')">⏻关机</button>
            </div>
        `;
    },
    
    // 发送事件注入命令 (新的 0xD0 命令)
    async sendEventInject(actionId, triggerId) {
        if (!this.checkSerial()) return;
        
        try {
            const result = await API.call('event_inject_send', 0, actionId, triggerId, 0);
            
            if (result.success) {
                this.log('tx', `📤 TX: D0 事件注入 (action=${actionId}, trigger=${triggerId})`);
                if (result.response) {
                    this.log('rx', `📥 RX: ${result.response.replace(/\r\n/g, ' ')}`);
                }
                // 读取LCD状态更新显示
                await this.sleep(100);
                await this.readLcdStatus();
            } else {
                this.log('fail', `事件注入失败: ${result.error}`);
            }
        } catch (e) {
            this.log('fail', `事件注入异常: ${e.message}`);
        }
    },
    
    // 加载持久化的测试数据
    loadPersistedData() {
        try {
            const saved = localStorage.getItem('ui_test_report');
            if (saved) {
                const data = JSON.parse(saved);
                // 只恢复最近的数据（1小时内）
                if (data.endTime && (Date.now() - new Date(data.endTime).getTime()) < 3600000) {
                    this.testReport = data;
                    console.log('[UITest] 恢复上次测试数据:', data.steps?.length || 0, '步');
                    this.renderStepsGrouped();
                }
            }
        } catch (e) {
            console.warn('[UITest] 加载持久化数据失败:', e);
        }
    },
    
    // 持久化测试数据
    persistData() {
        if (!this.memoryConfig.enablePersistence) return;
        try {
            // 只保存最近的步骤，避免localStorage溢出
            // 注意：排除 lcdImage 以节省空间，图片只保留在内存中
            const stepsToSave = this.testReport.steps.slice(-this.memoryConfig.maxSteps).map(step => {
                const { lcdImage, ...stepWithoutImage } = step;
                return stepWithoutImage;
            });
            const dataToSave = {
                ...this.testReport,
                steps: stepsToSave
            };
            localStorage.setItem('ui_test_report', JSON.stringify(dataToSave));
        } catch (e) {
            console.warn('[UITest] 持久化数据失败:', e);
            // 如果存储满了，清理旧数据
            if (e.name === 'QuotaExceededError') {
                this.cleanupOldSteps();
            }
        }
    },
    
    // 清理旧步骤释放内存
    cleanupOldSteps() {
        const maxSteps = this.memoryConfig.maxSteps;
        if (this.testReport.steps.length > maxSteps) {
            const removed = this.testReport.steps.length - maxSteps;
            this.testReport.steps = this.testReport.steps.slice(-maxSteps);
            console.log(`[UITest] 清理了 ${removed} 个旧步骤，释放内存`);
            this.renderStepsGrouped();
        }
    },
    
    // 压缩截图
    compressImage(dataUrl) {
        return new Promise((resolve) => {
            if (!dataUrl || !dataUrl.startsWith('data:image')) {
                resolve(dataUrl);
                return;
            }
            
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const maxWidth = this.memoryConfig.imageMaxWidth;
                const scale = Math.min(1, maxWidth / img.width);
                canvas.width = img.width * scale;
                canvas.height = img.height * scale;
                
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                
                const compressed = canvas.toDataURL('image/jpeg', this.memoryConfig.imageQuality);
                resolve(compressed);
            };
            img.onerror = () => resolve(dataUrl);
            img.src = dataUrl;
        });
    },
    
    // 页面停用时调用 - 停止正在运行的测试
    async deactivate() {
        console.log('UITestPage deactivate');
        if (this.running) {
            this.aborted = true;
            this.log('info', '页面切换，测试已中止');
        }
    },
    
    // 初始化设备配置管理器
    async initDeviceManager() {
        if (typeof DeviceConfigManager !== 'undefined') {
            await DeviceConfigManager.init();
            
            // 创建设备选择器
            createDeviceSelector('uit-device-selector', {
                onChange: (deviceId) => this.onDeviceChanged(deviceId),
                showAdd: false,  // 测试页面不需要新建设备
                showManage: true
            });
            
            // 订阅设备变化事件
            DeviceConfigManager.subscribe('device-changed', (e) => this.onDeviceChanged(e.newDevice));
            DeviceConfigManager.subscribe('tests-updated', (e) => {
                // 测试脚本编辑器更新了测试用例，重新加载
                if (e.deviceId === DeviceConfigManager.getCurrentDevice()) {
                    this.log('info', '检测到测试用例更新，重新加载...');
                    this.loadTestSuite();
                }
            });
            
            console.log('[UITestPage] DeviceConfigManager 集成完成');
        } else {
            console.warn('[UITestPage] DeviceConfigManager 不可用');
        }
    },
    
    async onDeviceChanged(deviceId) {
        this.log('info', `切换设备: ${deviceId}`);
        this.groups = [];
        this.selectedGroup = null;
        this.results = {};
        await this.loadTestSuite();
        // 重新加载按键映射
        await this.loadKeymap();
        // 重新加载LCD配置
        if (this.lcdSimulator) {
            await this.lcdSimulator.loadConfig();
        }
    },
    
    // 加载测试套件
    async loadTestSuite() {
        const deviceId = DeviceConfigManager?.getCurrentDevice();
        
        // 优先使用 DeviceConfigManager 加载
        if (typeof DeviceConfigManager !== 'undefined' && deviceId) {
            try {
                const testSuiteContent = await DeviceConfigManager.loadTestSuite();
                if (testSuiteContent) {
                    // 如果是字符串（JS文件内容），需要解析
                    if (typeof testSuiteContent === 'string') {
                        // 尝试从JS内容中提取测试套件对象
                        const suite = this.parseJsSuite(testSuiteContent);
                        if (suite && suite.categories) {
                            this.loadFromSuiteData(suite);
                            return;
                        }
                    } else if (testSuiteContent.categories) {
                        // 已经是JSON对象
                        this.loadFromSuiteData(testSuiteContent);
                        return;
                    }
                }
            } catch (err) {
                console.warn('[UITestPage] DeviceConfigManager加载失败:', err);
            }
        }
        
        // 降级：从全局变量加载
        this.loadFromSuite();
    },
    
    // 解析JS格式的测试套件
    parseJsSuite(jsContent) {
        try {
            // 尝试提取 window.XXXTestSuite = {...} 格式
            const match = jsContent.match(/window\.(\w+TestSuite)\s*=\s*(\{[\s\S]*\});?\s*$/);
            if (match) {
                // 使用 Function 构造器安全地解析
                const fn = new Function(`return ${match[2]}`);
                return fn();
            }
            
            // 尝试提取 const XXX = {...} 格式
            const constMatch = jsContent.match(/(?:const|let|var)\s+\w+\s*=\s*(\{[\s\S]*\});?\s*$/);
            if (constMatch) {
                const fn = new Function(`return ${constMatch[1]}`);
                return fn();
            }
            
            return null;
        } catch (err) {
            console.error('[UITestPage] 解析JS测试套件失败:', err);
            return null;
        }
    },
    
    // 从测试套件数据加载
    loadFromSuiteData(suite) {
        this.log('info', `加载测试套件: ${suite.name} v${suite.version}`);
        
        this.groups = [];
        
        for (const category of suite.categories) {
            for (const testCase of category.cases) {
                const group = {
                    name: `${category.id}. ${category.name} - ${testCase.id} ${testCase.name}`,
                    items: []
                };
                
                for (const subcase of (testCase.subcases || [])) {
                    const item = {
                        key: subcase.id,
                        name: subcase.name,
                        desc: subcase.desc || '',
                        autoScript: this.convertStepsToScript(subcase.steps, subcase.initial)
                    };
                    group.items.push(item);
                }
                
                if (group.items.length > 0) {
                    this.groups.push(group);
                }
            }
        }
        
        this.log('info', `已加载 ${this.groups.length} 个分组`);
        this.renderGroups();
        
        if (this.groups.length > 0) {
            this.selectGroup(0);
        }
    },
    
    // 初始化LCD模拟器 - 使用像素级LCD模拟器
    async initLcdSimulator() {
        const canvas = document.getElementById('lcd-canvas');
        if (!canvas) {
            console.warn('LCD Canvas not found, retrying in 300ms...');
            setTimeout(() => this.initLcdSimulator(), 300);
            return;
        }
        
        // 使用像素级LCD模拟器 (LcdSimulatorPage)
        if (typeof LcdSimulatorPage === 'undefined') {
            console.warn('LcdSimulatorPage not loaded yet, retrying in 300ms...');
            setTimeout(() => this.initLcdSimulator(), 300);
            return;
        }
        
        // 将canvas ID改为LcdSimulatorPage期望的ID
        canvas.id = 'sim-lcd-canvas';
        
        // 初始化像素级LCD模拟器
        LcdSimulatorPage.canvas = canvas;
        LcdSimulatorPage.ctx = canvas.getContext('2d', { alpha: true });
        
        // 设置较大的默认缩放比例，确保LCD清晰可见
        // 容器宽度约400px，LCD全显图通常800px左右，设置0.45-0.5的缩放
        LcdSimulatorPage.state.zoom = 0.5;
        
        // 【修复】加载保存的样式设置，确保UI测试页面使用用户设置的样式
        if (LcdSimulatorPage.loadStyleSettings) {
            LcdSimulatorPage.loadStyleSettings();
        }
        
        // 加载配置
        await LcdSimulatorPage.loadConfig();
        
        // 测试执行时关闭标签显示（标签是给编辑器用的）
        LcdSimulatorPage.state.showLabels = false;
        
        console.log('LCD Pixel Simulator initialized successfully');
        this.lcdSimulator = LcdSimulatorPage;
        
        // 初始渲染
        LcdSimulatorPage.render();
    },
    
    destroy() {
        console.log('UITestPage destroy');
        this.aborted = true;
    },
    
    // 切换状态详情显示
    toggleStatusDetail() {
        this.statusDetailVisible = !this.statusDetailVisible;
        const detail = document.getElementById('uit-device-status-detail');
        const btn = document.getElementById('btn-toggle-status');
        if (detail) {
            detail.style.display = this.statusDetailVisible ? 'block' : 'none';
        }
        if (btn) {
            btn.textContent = this.statusDetailVisible ? '收起' : '展开';
        }
    },
    
    // LCD缩放控制
    // delta > 0 放大, delta < 0 缩小, delta = 0 重置
    zoomLcd(delta) {
        if (typeof LcdSimulatorPage === 'undefined') return;
        
        if (delta === 0) {
            // 重置为默认缩放
            LcdSimulatorPage.state.zoom = 0.5;
        } else {
            // 调整缩放，限制范围 0.2 ~ 2.0
            let newZoom = LcdSimulatorPage.state.zoom + delta;
            newZoom = Math.max(0.2, Math.min(2.0, newZoom));
            LcdSimulatorPage.state.zoom = newZoom;
        }
        
        // 重新调整画布大小并渲染
        LcdSimulatorPage.resizeCanvas();
        LcdSimulatorPage.render();
        
        this.log('info', `LCD缩放: ${(LcdSimulatorPage.state.zoom * 100).toFixed(0)}%`);
    },

    // 从 gd303_mini_suite.js 加载测试用例
    loadFromSuite() {
        const suite = window.GD303MiniTestSuite;
        if (!suite) {
            this.log('fail', '测试套件未加载: GD303MiniTestSuite');
            return;
        }
        
        this.log('info', `加载测试套件: ${suite.name} v${suite.version}`);
        
        // 将 suite.categories 转换为 groups 格式
        // suite格式: categories[{id, name, cases[{id, name, subcases[{id, name, steps}]}]}]
        // groups格式: [{name, items[{key, name, desc, autoScript}]}]
        this.groups = [];
        
        for (const category of suite.categories) {
            for (const testCase of category.cases) {
                // 每个 case 作为一个分组
                const group = {
                    name: `${category.id}. ${category.name} - ${testCase.id} ${testCase.name}`,
                    items: []
                };
                
                // 每个 subcase 作为一个测试项
                for (const subcase of (testCase.subcases || [])) {
                    const item = {
                        key: subcase.id,
                        name: subcase.name,
                        desc: subcase.desc || '',
                        // 将 steps 转换为 autoScript 格式
                        autoScript: this.convertStepsToScript(subcase.steps, subcase.initial)
                    };
                    group.items.push(item);
                }
                
                if (group.items.length > 0) {
                    this.groups.push(group);
                }
            }
        }
        
        this.log('info', `已加载 ${this.groups.length} 个分组`);
        this.renderGroups();
        
        // 默认选中第一个分组
        if (this.groups.length > 0) {
            this.selectGroup(0);
        }
    },
    
    // 将 suite 的 steps 格式转换为 autoScript 格式
    // steps格式: [{action: "K1短按", expect: {laser: "ON"}}]
    // autoScript格式: {setup: [], steps: [{cmd, param}], expect: {}}
    convertStepsToScript(steps, initial) {
        if (!steps || steps.length === 0) return null;
        
        const script = {
            setup: [],
            steps: [],
            expect: {}
        };
        
        // 解析每个步骤
        for (const step of steps) {
            const parsed = this.parseAction(step.action);
            if (parsed) {
                script.steps.push({
                    cmd: parsed.cmd,
                    param: parsed.param,
                    expect: step.expect  // 保留每步的期望值
                });
            }
        }
        
        // 最后一步的期望值作为整体期望
        if (steps.length > 0 && steps[steps.length - 1].expect) {
            script.expect = steps[steps.length - 1].expect;
        }
        
        return script;
    },
    
    // 解析动作字符串，返回 {cmd, param}
    // 使用 UITestLib 的解析函数
    parseAction(actionStr) {
        if (window.UITestLib) {
            return UITestLib.parseAction(actionStr);
        }
        
        // 备用解析逻辑
        const actionMap = {
            'K1短按': { cmd: 'key_measure' },
            'K1长按': { cmd: 'key_measure_long' },
            'K2短按': { cmd: 'key_mode' },
            'K2长按': { cmd: 'key_base' },
            'K3短按': { cmd: 'key_clear' },
            'K3长按': { cmd: 'key_backlight' },
            'K3超长按': { cmd: 'key_power_off' },
            '获取状态': { cmd: 'get_status' },
            '重置': { cmd: 'reset' },
        };
        
        // 检查是否有参数
        const match = actionStr.match(/^(.+?)\((.+)\)$/);
        if (match) {
            const name = match[1];
            const paramsStr = match[2];
            
            if (name === '模拟测距成功') {
                const [dist, signal] = paramsStr.split(',').map(s => parseInt(s.trim()));
                return { cmd: 'sim_ok', param: { distance: dist, signal: signal || 3 } };
            }
            if (name === '模拟测距失败') {
                return { cmd: 'sim_err', param: parseInt(paramsStr) };
            }
            if (name === '设置单位') {
                return { cmd: 'set_unit', param: parseInt(paramsStr) };
            }
            if (name === '等待') {
                return { cmd: 'wait', param: parseInt(paramsStr) };
            }
        }
        
        return actionMap[actionStr] || null;
    },
    
    // 更新串口状态
    updateSerialStatus() {
        const el = document.getElementById('uit-serial-status');
        if (!el) return;
        const connected = window.DeviceHub && DeviceHub.isSerialConnected();
        el.textContent = connected ? '🟢 已连接' : '⚪ 未连接';
        el.className = 'uit-status' + (connected ? ' connected' : '');
    },

    // 渲染分组列表
    renderGroups() {
        const container = document.getElementById('uit-group-list');
        if (!container || !this.groups.length) {
            container.innerHTML = '<div class="uit-empty">暂无测试分组</div>';
            return;
        }
        
        container.innerHTML = this.groups.map((g, idx) => {
            const items = g.items || [];
            const autoCount = items.filter(i => i.autoScript).length;
            const passCount = items.filter(i => this.results[i.key]?.passed === true).length;
            const failCount = items.filter(i => this.results[i.key]?.passed === false).length;
            
            return `
                <div class="uit-group-item ${this.selectedGroup === idx ? 'selected' : ''}"
                     onclick="UITestPage.selectGroup(${idx})">
                    <span class="name">${g.name}</span>
                    <span class="stats">
                        ${autoCount > 0 ? `🤖${autoCount}` : ''}
                        ${passCount > 0 ? `<span class="pass">✓${passCount}</span>` : ''}
                        ${failCount > 0 ? `<span class="fail">✗${failCount}</span>` : ''}
                    </span>
                </div>
            `;
        }).join('');
        
        this.updateProgress();
    },
    
    // 选择分组
    selectGroup(idx) {
        this.selectedGroup = idx;
        this.renderGroups();
        this.renderItems();
    },

    // 渲染测试项列表
    renderItems() {
        const container = document.getElementById('uit-item-list');
        const title = document.getElementById('uit-items-title');
        const stats = document.getElementById('uit-items-stats');
        
        if (this.selectedGroup === null || !this.groups[this.selectedGroup]) {
            container.innerHTML = '<div class="uit-empty">选择一个分组查看测试项</div>';
            return;
        }
        
        const group = this.groups[this.selectedGroup];
        const items = group.items || [];
        
        if (title) title.textContent = `📋 ${group.name}`;
        
        const autoCount = items.filter(i => i.autoScript).length;
        if (stats) stats.textContent = `共${items.length}项, 可自动${autoCount}项`;
        
        container.innerHTML = items.map(item => {
            const r = this.results[item.key];
            const status = r?.passed === true ? 'passed' : r?.passed === false ? 'failed' : '';
            const hasAuto = !!item.autoScript;
            
            return `
                <div class="uit-item ${status}" data-key="${item.key}">
                    <input type="checkbox" class="check" data-key="${item.key}" 
                           ${hasAuto ? 'checked' : ''} ${!hasAuto ? 'disabled' : ''}>
                    <div class="info">
                        <div class="name">
                            ${item.name}
                            ${hasAuto ? '<span class="auto-badge">🤖自动</span>' : ''}
                        </div>
                        <div class="desc">${item.desc || ''}</div>
                        ${r?.error ? `<div class="result error">❌ ${r.error}</div>` : ''}
                        ${r?.actual ? `<div class="result">实际: ${JSON.stringify(r.actual)}</div>` : ''}
                    </div>
                    <div class="actions">
                        ${hasAuto ? `<button class="uit-btn sm" onclick="UITestPage.runItem('${item.key}')">▶</button>` : ''}
                        <button class="uit-btn sm success" onclick="UITestPage.markPass('${item.key}')">✓</button>
                        <button class="uit-btn sm danger" onclick="UITestPage.markFail('${item.key}')">✗</button>
                    </div>
                </div>
            `;
        }).join('');
    },

    // 更新进度
    updateProgress() {
        const el = document.getElementById('uit-progress');
        if (!el) return;
        
        let total = 0, pass = 0, fail = 0;
        this.groups.forEach(g => {
            (g.items || []).forEach(item => {
                if (item.autoScript) {
                    total++;
                    const r = this.results[item.key];
                    if (r?.passed === true) pass++;
                    else if (r?.passed === false) fail++;
                }
            });
        });
        
        if (total === 0) {
            el.textContent = '';
        } else {
            el.innerHTML = `进度: <span class="pass">${pass}</span>/<span class="fail">${fail}</span>/${total}`;
        }
    },
    
    // 全选/取消全选
    toggleAll() {
        const checked = document.getElementById('uit-check-all')?.checked;
        document.querySelectorAll('.uit-item .check:not(:disabled)').forEach(cb => {
            cb.checked = checked;
        });
    },
    
    // 手动标记通过
    markPass(key) {

        this.renderGroups();
        this.renderItems();
        this.log('pass', `[${key}] 手动标记通过`);
    },
    
    // 手动标记失败
    markFail(key) {

    // ==================== 测试执行 ====================
    
    // 运行选中的测试项
    async runSelected() {
        if (!this.checkSerial()) return;
        
        // 获取选中的测试项
        const checkedKeys = [];
        document.querySelectorAll('.uit-item .check:checked').forEach(cb => {
            checkedKeys.push(cb.dataset.key);
        });
        
        if (checkedKeys.length === 0) {
            Utils.toast('请选择要运行的测试项', 'warning');
            return;
        }
        
        await this.runItems(checkedKeys);
    },
    
    // 运行全部自动化测试
    async runAll() {
        if (!this.checkSerial()) return;
        
        const allKeys = [];
        this.groups.forEach(g => {
            (g.items || []).forEach(item => {
                if (item.autoScript) allKeys.push(item.key);
            });
        });
        
        if (allKeys.length === 0) {
            Utils.toast('没有可自动执行的测试项', 'warning');
            return;
        }
        
        await this.runItems(allKeys);
    },
    
    // 运行单个测试项
    async runItem(key) {
        if (!this.checkSerial()) return;
        await this.runItems([key]);
    },
    
    checkSerial() {
        if (!window.DeviceHub || !DeviceHub.isSerialConnected()) {
            Utils.toast('请先连接串口', 'warning');
            return false;
        }
        return true;
    },

    // 运行测试项列表
    async runItems(keys) {
        this.running = true;
        this.aborted = false;
        this.setRunning(true);
        
        // 初始化测试报告
        const deviceId = DeviceConfigManager?.getCurrentDevice() || 'unknown';
        const deviceInfo = DeviceConfigManager?.getCurrentDeviceInfo() || {};
        this.testReport = {
            startTime: new Date().toISOString(),
            endTime: null,
            device: deviceInfo.name || deviceId,
            deviceId: deviceId,
            firmwareVersion: deviceInfo.firmwareVersion || '',
            steps: [],
            testCases: [],
        };
        
        // 清空步骤预览
        this.clearSteps();
        
        this.log('info', `开始运行 ${keys.length} 个测试项...`);
        
        for (const key of keys) {
            if (this.aborted) {
                this.log('info', '测试已中止');
                break;
            }
            
            // 找到测试项
            let item = null;
            for (const g of this.groups) {
                item = (g.items || []).find(i => i.key === key);
                if (item) break;
            }
            
            if (!item || !item.autoScript) {
                this.log('info', `[${key}] 跳过(无自动脚本)`);
                continue;
            }
            
            // 高亮当前项
            this.highlightItem(key, 'running');
            
            // 记录测试用例开始
            const caseRecord = {
                key: key,
                name: item.name,
                desc: item.desc,
                startTime: new Date().toISOString(),
                endTime: null,
                passed: null,
                error: null,
            };
            
            try {
                // 每个测试用例开始前进入调试模式 (CA 01)
                this.log('info', `  🔧 进入调试模式...`);
                await API.call('ui_test_send_cmd', 'debug_mode', 1);
                await this.sleep(this.delays.afterDebugMode);
                
                await this.executeScript(item);
                caseRecord.passed = this.results[key]?.passed;
                caseRecord.error = this.results[key]?.error;
            } catch (e) {
                this.results[key] = { passed: false, error: e.message };
                caseRecord.passed = false;
                caseRecord.error = e.message;
                this.log('fail', `[${key}] 执行异常: ${e.message}`);
            }
            
            caseRecord.endTime = new Date().toISOString();
            this.testReport.testCases.push(caseRecord);
            
            // 更新显示
            this.highlightItem(key, this.results[key]?.passed ? 'passed' : 'failed');
            this.renderGroups();
        }
        
        // 完成测试报告
        this.testReport.endTime = new Date().toISOString();
        
        // 持久化最终数据
        this.persistData();
        
        this.running = false;
        this.setRunning(false);
        this.log('info', '测试执行完成');
        this.renderItems();
        
        // 提示生成报告
        const passed = this.testReport.testCases.filter(c => c.passed).length;
        const failed = this.testReport.testCases.filter(c => !c.passed).length;
        this.log('info', `结果: ${passed} 通过, ${failed} 失败`);
        this.log('info', `内存: ${this.testReport.steps.length} 步记录`);
        
        if (this.testReport.testCases.length > 0) {
            this.log('info', '点击"导出报告"按钮生成HTML测试报告');
        }
    },

    // 执行单个测试脚本
    // 跳过验证开关 - 设为true时只执行动作，不验证期望值，人眼判断
    skipVerification: true,
    
    async executeScript(item) {
        const script = item.autoScript;
        const key = item.key;
        
        this.log('step', `[${key}] ${item.name}`);
        
        // 1. 执行 setup
        if (script.setup && script.setup.length > 0) {
            this.log('info', `  setup: ${script.setup.length} 步`);
            for (const action of script.setup) {
                if (this.aborted) return;
                await this.executeAction(action, key);
            }
        }
        
        // 2. 执行 steps (每步都有期望值验证)
        if (script.steps && script.steps.length > 0) {
            this.log('info', `  steps: ${script.steps.length} 步`);
            let allPassed = true;
            let lastError = null;
            
            for (let i = 0; i < script.steps.length; i++) {
                if (this.aborted) return;
                const step = script.steps[i];
                
                // 判断是否需要截图：
                // - 有期望值的步骤需要截图
                // - 模拟测距成功/失败需要截图
                // - 有desc描述的步骤需要截图
                // - 准备步骤（进入调试模式、设置单位、清除等）不需要截图
                const needScreenshot = this.shouldScreenshot(step);
                
                // 处理复合动作（如"重置"）
                if (step.cmd === 'reset') {
                    this.log('info', `    [${i+1}] 重置 (4次K3清除)`);
                    for (let j = 0; j < 4; j++) {
                        await this.executeActionSimple({ cmd: 'key_clear' }, key, true); // 全部跳过截图
                        await this.sleep(this.delays.afterKeyClear);
                    }
                } else {
                    this.log('info', `    [${i+1}] ${step.cmd} ${step.param ? JSON.stringify(step.param) : ''}`);
                    await this.executeActionSimple(step, key, !needScreenshot);
                }
                
                // 每步验证期望值 (如果跳过验证则直接通过)
                if (this.skipVerification) {
                    // 跳过验证，人眼判断
                    this.log('info', `      ⏭️ 跳过验证(人眼判断)`);
                } else if (step.expect && Object.keys(step.expect).length > 0) {
                    await this.sleep(this.delays.beforeVerify); // 等待设备状态稳定
                    const result = await this.verifyExpect(step.expect);
                    
                    if (result.passed) {
                        this.log('pass', `      ✓ 步骤${i+1}验证通过`);
                    } else {
                        this.log('fail', `      ✗ 步骤${i+1}验证失败: ${result.error}`);
                        allPassed = false;
                        lastError = result.error;
                        // 继续执行后续步骤，但记录失败
                    }
                }
            }
            
            // 记录整体结果 (跳过验证时默认通过)
            if (this.skipVerification) {
                this.results[key] = { passed: true, error: null };
                this.log('info', `  ✅ 执行完成(跳过验证)`);
            } else {
                this.results[key] = {
                    passed: allPassed,
                    error: lastError
                };
                
                if (allPassed) {
                    this.log('pass', `  ✓ 测试通过`);
                } else {
                    this.log('fail', `  ✗ 测试失败: ${lastError}`);
                }
            }
            return;
        }
        
        // 3. 如果没有steps，验证整体 expect
        if (this.skipVerification) {
            // 跳过验证，人眼判断
            this.results[key] = { passed: true };
            this.log('info', `  ✅ 执行完成(跳过验证)`);
        } else if (script.expect && Object.keys(script.expect).length > 0) {
            await this.sleep(this.delays.beforeVerify); // 等待设备状态稳定
            const result = await this.verifyExpect(script.expect);
            this.results[key] = result;
            
            if (result.passed) {
                this.log('pass', `  ✓ 验证通过`);
            } else {
                this.log('fail', `  ✗ 验证失败: ${result.error}`);
            }
        } else {
            // 无期望值，默认通过
            this.results[key] = { passed: true };
            this.log('pass', `  ✓ 执行完成(无验证)`);
        }
    },

    // 执行单个动作 - 配置化LCD渲染流程:
    // 1. 发送命令 → 等待固件响应
    // 2. 发送0xBC读取LCD缓冲区(54字节)
    // 3. LCD仿真器根据配置+缓冲区自动渲染
    // 4. 截图
    async executeAction(action, testKey = '') {
        return await this.executeActionSimple(action, testKey, false);
    },
    
    // 判断步骤是否需要截图
    shouldScreenshot(step) {
        // 不需要截图的命令（准备步骤）
        const skipCommands = [
            'debug_enter', 'debug_exit',  // 调试模式
            'set_unit',                    // 设置单位
            'wait',                        // 等待
        ];
        
        // 检查命令是否在跳过列表中
        if (skipCommands.includes(step.cmd)) {
            return false;
        }
        
        // 有期望值的步骤需要截图
        if (step.expect && Object.keys(step.expect).length > 0) {
            return true;
        }
        
        // 有描述的步骤需要截图（通常是关键步骤）
        if (step.desc) {
            return true;
        }
        
        // 模拟测距命令需要截图
        if (step.cmd === 'sim_ok' || step.cmd === 'sim_err') {
            return true;
        }
        
        // 默认不截图（清除、模式切换等准备步骤）
        return false;
    },
    
    // 简化版执行动作 - 可选择是否跳过截图
    async executeActionSimple(action, testKey = '', skipScreenshot = false) {
        const cmd = action.cmd;
        const param = action.param;
        
        // 等待命令 - 直接sleep
        if (cmd === 'wait') {
            await this.sleep(param || 100);
            return;
        }
        
        // 详细日志：显示命令和参数
        const paramStr = param ? JSON.stringify(param) : '';
        if (!skipScreenshot) {
            this.log('info', `    ⏳ 动作开始: ${cmd} ${paramStr}`);
        }
        
        // 记录步骤开始
        const stepRecord = {
            time: new Date().toISOString(),
            testKey: testKey,
            cmd: cmd,
            param: param,
            txHex: '',
            rxText: '',
            lcdBuffer: null,
            lcdStatus: null,
            lcdImage: null,
            success: false,
        };
        
        // 发送命令并等待完整响应
        try {
            // 步骤1: 发送命令，等待固件响应
            if (!skipScreenshot) {
                this.log('info', `    📡 发送命令...`);
            }
            const result = await API.call('ui_test_send_cmd', cmd, param);
            
            if (result.success) {
                stepRecord.txHex = result.hex || '';
                stepRecord.rxText = result.response_text || result.response_hex || '';
                stepRecord.success = true;
                
                // 显示TX
                if (result.hex && !skipScreenshot) {
                    this.log('tx', `    📤 TX: ${result.hex}`);
                }
                // 显示RX
                if (result.response_text && !skipScreenshot) {
                    this.log('rx', `    📥 RX: ${result.response_text.replace(/\r\n/g, ' ')}`);
                }
                
                // 等待固件处理完成 (UI更新需要时间)
                // 按键命令需要更长时间处理状态机和LCD刷新
                await this.sleep(this.delays.afterKeyCmd);
                
                // 步骤2: 读取LCD（如果不跳过截图）
                if (!skipScreenshot) {
                    this.log('info', `    📺 读取LCD缓冲区...`);
                    const lcdResult = await this.readLcdBufferAndRender();
                    
                    if (lcdResult) {
                        stepRecord.lcdBuffer = lcdResult.buffer;
                        stepRecord.lcdStatus = lcdResult.status;
                        stepRecord.lcdImage = lcdResult.image;
                        
                        this.log('info', `    ✅ LCD渲染完成: line4=${lcdResult.status?.line4 || '-'}`);
                        
                        // 更新设备状态显示
                        this.updateDeviceStatus(lcdResult.status);
                    } else {
                        this.log('info', `    ⚠️ LCD读取失败，尝试从响应解析...`);
                        // 备用方案: 从响应中解析UI状态
                        const uiStatus = this.parseUiStatusFromResponse(result.response_text);
                        if (uiStatus) {
                            stepRecord.lcdStatus = uiStatus;
                            const image = await this.updateLcdAndCapture(uiStatus);
                            stepRecord.lcdImage = image;
                            this.updateDeviceStatus(uiStatus);
                        }
                    }
                }
            } else {
                stepRecord.success = false;
                stepRecord.error = result.error;
                if (!skipScreenshot) {
                    this.log('fail', `    命令失败: ${result.error}`);
                }
            }
        } catch (e) {
            stepRecord.success = false;
            stepRecord.error = e.message;
            if (!skipScreenshot) {
                this.log('fail', `    命令异常: ${e.message}`);
            }
        }
        
        if (!skipScreenshot) {
            this.log('info', `    ✅ 动作完成: ${cmd}`);
            
            // 压缩截图以节省内存
            if (stepRecord.lcdImage) {
                stepRecord.lcdImage = await this.compressImage(stepRecord.lcdImage);
            }
            
            // 保存步骤记录
            this.testReport.steps.push(stepRecord);
            
            // 定期清理旧步骤
            if (this.testReport.steps.length > this.memoryConfig.maxSteps * 1.5) {
                this.cleanupOldSteps();
            }
            
            // 持久化数据（每10步保存一次）
            if (this.testReport.steps.length % 10 === 0) {
                this.persistData();
            }
            
            // 更新步骤预览
            this.addStepCard(stepRecord);
        }
    },
    
    // 读取LCD缓冲区并渲染 - 配置化流程

    // 从固件响应中解析UI状态
    // 响应格式: xxx.s;error: 0;state: IDLE;mode: SINGLE;base: BACK;runstep: 0;laser: OFF;xxx.e
    // 或扩展格式: bd.s;error: 0;dist: 0.050;signal: 3;state: RESULT;mode: SINGLE;runstep: 2;line4: 0.118;bd.e
    parseUiStatusFromResponse(responseText) {
        if (!responseText) {
            console.log('[parseUI] 响应为空');
            return null;
        }
        
        try {
            // 查找 xxx.s 和 xxx.e 之间的内容
            const match = responseText.match(/(\w+)\.s;(.+?)\1\.e/);
            if (!match) {
                console.log('[parseUI] 未匹配到 xxx.s...xxx.e 格式');
                return null;
            }
            
            const cmdTag = match[1];
            const content = match[2];
            console.log(`[parseUI] 匹配到 ${cmdTag}.s, 内容: ${content}`);
            
            const status = {};
            
            // 解析键值对
            const parts = content.split(';');
            for (const part of parts) {
                const colonIdx = part.indexOf(':');
                if (colonIdx < 0) continue;
                
                const key = part.substring(0, colonIdx).trim().toLowerCase();
                const value = part.substring(colonIdx + 1).trim();
                
                // 转换值类型
                if (key === 'state') {
                    const stateMap = {'idle': 0, 'laser_on': 1, 'result': 2, 'error': 3, 'menu': 4};
                    const mapped = stateMap[value.toLowerCase()];
                    status.state = mapped !== undefined ? mapped : (parseInt(value) || 0);
                } else if (key === 'mode') {
                    const modeMap = {'single': 0, 'area': 1, 'volume': 2, 'pyth1': 3, 'pyth2': 4, 'pyth3': 5, 'continuous': 6};
                    const mapped = modeMap[value.toLowerCase()];
                    status.mode = mapped !== undefined ? mapped : (parseInt(value) || 0);
                } else if (key === 'base') {
                    const baseMap = {'front': 0, 'back': 1};
                    const mapped = baseMap[value.toLowerCase()];
                    status.base = mapped !== undefined ? mapped : (parseInt(value) || 0);
                } else if (key === 'laser') {
                    status.laser = value.toLowerCase() === 'on' || value === '1';
                } else if (key === 'runstep') {
                    status.runstep = parseInt(value) || 0;
                } else if (key === 'line1' || key === 'line2' || key === 'line3' || key === 'line4') {
                    status[key] = parseFloat(value) || 0;
                } else if (key === 'unit') {
                    const unitMap = {'m': 0, 'ft': 1, 'in': 2};
                    const mapped = unitMap[value.toLowerCase()];
                    status.unit = mapped !== undefined ? mapped : (parseInt(value) || 0);
                } else if (key === 'dist' || key === 'distance') {
                    status.dist = parseFloat(value) || 0;
                } else if (key === 'signal') {
                    status.signal = parseInt(value) || 0;
                } else if (key === 'error') {
                    status.error = parseInt(value) || 0;
                }
            }
            
            console.log('[parseUI] 解析结果:', status);
            
            // 如果有state或line4数据，说明是有效的UI状态
            if (status.state !== undefined || status.line4 !== undefined) {
                // 补充默认值
                if (status.battery === undefined) status.battery = 3;
                if (status.beep === undefined) status.beep = true;
                if (status.line1 === undefined) status.line1 = 0;
                if (status.line2 === undefined) status.line2 = 0;
                if (status.line3 === undefined) status.line3 = 0;
                if (status.line4 === undefined) status.line4 = 0;
                return status;
            }
            
            console.log('[parseUI] 无有效UI状态');
            return null;
        } catch (e) {
            console.error('[parseUI] 解析UI状态失败:', e);
            return null;
        }
    },

    // 验证期望值
    async verifyExpect(expect) {
        // 获取设备状态
        const statusResult = await API.call('ui_test_get_device_status');
        
        // 显示接收响应
        if (statusResult.response_text) {
            this.log('rx', `    📥 RX: ${statusResult.response_text.replace(/\r\n/g, ' ').substring(0, 200)}`);
        } else if (statusResult.response_hex) {
            this.log('rx', `    📥 RX: ${statusResult.response_hex}`);
        }
        
        if (!statusResult.success || !statusResult.status) {
            this.log('fail', `    📥 状态获取失败: ${statusResult.error || '无响应'}`);
            return { passed: false, error: '无法获取设备状态', actual: {} };
        }
        
        const status = statusResult.status;
        // 显示解析结果
        this.logParsedStatus(status);
        // 更新设备状态显示
        this.updateDeviceStatus(status);
        
        const actual = {};
        const errors = [];
        const tolerance = expect.tolerance || 0;
        
        for (const [key, expected] of Object.entries(expect)) {
            if (key === 'tolerance') continue;
            
            const actualValue = status[key];
            actual[key] = actualValue;
            
            if (actualValue === undefined || actualValue === null) {
                errors.push(`${key}: 未获取到值`);
                continue;
            }
            
            // 数值比较（带容差）
            if (typeof expected === 'number' && typeof actualValue === 'number') {
                if (Math.abs(actualValue - expected) > tolerance) {
                    errors.push(`${key}: 期望${expected}±${tolerance}, 实际${actualValue}`);
                }
            } else if (actualValue !== expected) {
                errors.push(`${key}: 期望${expected}, 实际${actualValue}`);
            }
        }
        
        return {
            passed: errors.length === 0,
            actual,
            error: errors.join('; ')
        };
    },
    
    // 显示解析后的状态
    logParsedStatus(status) {
        const stateNames = ['IDLE', 'LASER_ON', 'RESULT', 'ERROR', 'MENU'];
        const modeNames = ['单次', '面积', '体积', '勾股1', '勾股2', '勾股3', '连续'];
        const baseNames = ['前基准', '后基准'];
        const unitNames = ['m', 'ft', 'in'];
        
        const parts = [];
        parts.push(`state=${stateNames[status.state] || status.state}`);
        parts.push(`mode=${modeNames[status.mode] || status.mode}`);
        parts.push(`base=${baseNames[status.base] || status.base}`);
        parts.push(`unit=${unitNames[status.unit] || status.unit}`);
        parts.push(`laser=${status.laser ? 'ON' : 'OFF'}`);
        parts.push(`runstep=${status.runstep}`);
        if (status.line4 !== undefined) parts.push(`line4=${status.line4?.toFixed(3)}`);
        if (status.line3 !== undefined) parts.push(`line3=${status.line3?.toFixed(3)}`);
        
        this.log('info', `    📊 解析: ${parts.join(', ')}`);
    },

        const grouped = {};
        steps.forEach((step, idx) => {
            const key = step.testKey || 'unknown';
            if (!grouped[key]) {
                grouped[key] = { steps: [], name: this.getTestCaseName(key) };
            }
            grouped[key].steps.push({ ...step, globalIndex: idx });
        });
        
        // 渲染分组
        list.innerHTML = Object.entries(grouped).map(([key, group]) => {
            const approvedCount = group.steps.filter(s => s.judgeResult === 'pass').length;
            const rejectedCount = group.steps.filter(s => s.judgeResult === 'fail').length;
            const totalCount = group.steps.length;
            const groupStatus = rejectedCount > 0 ? 'rejected' : (approvedCount === totalCount ? 'approved' : '');
            
            const stepsHtml = group.steps.map((step, idx) => {
                const cmdName = this.getCmdDisplayName(step.cmd);
                const judgeStatus = step.judgeResult || 'pending';
                return `
                    <div class="uit-step-card ${step.success ? 'success' : 'fail'}" 
                         data-step-index="${step.globalIndex}" onclick="UITestPage.showStepDetail(${step.globalIndex})">
                        <div class="uit-step-header">
                            <span class="cmd">${idx + 1}. ${cmdName}</span>
                        </div>
                        <div class="uit-step-lcd">
                            ${step.lcdImage ? `<img src="${step.lcdImage}" alt="LCD">` : '<span style="color:#666;font-size:10px;">无截图</span>'}
                        </div>
                        <div class="uit-step-judge" data-judge="${judgeStatus}">
                            ${judgeStatus === 'pass' ? '✅' : judgeStatus === 'fail' ? '❌' : '⏳'}
                        </div>
                    </div>`;
            }).join('');
            
            return `
                <div class="uit-case-group ${groupStatus}" data-case-key="${key}">
                    <div class="uit-case-group-header">
                        <span class="case-name" title="${group.name}">${group.name}</span>
                        <span class="case-stats">${approvedCount}/${totalCount}</span>
                        <div class="case-judge">
                            <button class="judge-btn pass ${groupStatus === 'approved' ? 'active' : ''}" 
                                    onclick="event.stopPropagation(); UITestPage.judgeCaseAll('${key}', 'pass')">✓</button>
                            <button class="judge-btn fail ${groupStatus === 'rejected' ? 'active' : ''}"
                                    onclick="event.stopPropagation(); UITestPage.judgeCaseAll('${key}', 'fail')">✗</button>
                        </div>
                    </div>
                    <div class="uit-case-steps">${stepsHtml}</div>
                </div>`;
        }).join('');
        
        this.updateJudgeStats();
    },
    
    // 获取测试用例名称
    getTestCaseName(key) {
        // 从 testReport.testCases 中查找
        const tc = (this.testReport.testCases || []).find(c => c.key === key);
        if (tc) return tc.name;
        // 从 groups 中查找
        for (const g of this.groups) {
            const item = (g.items || []).find(i => i.key === key);
            if (item) return item.name;
        }
        return key;
    },
    
    // 整个测试用例批量评判
    judgeCaseAll(caseKey, result) {
        const steps = this.testReport.steps || [];
        steps.forEach((step, idx) => {
            if (step.testKey === caseKey) {
                step.judgeResult = result;
            }
        });
        this.renderStepsGrouped();
        this.log('info', `${this.getTestCaseName(caseKey)} 全部评判为 ${result === 'pass' ? '✅ 通过' : '❌ 不通过'}`);

    // 添加步骤卡片 - 改为触发重新渲染

        this.renderStepsGrouped();
        
        // 滚动到最新的分组
        const list = document.getElementById('uit-steps-list');
        if (list) {
            list.scrollLeft = list.scrollWidth;
        }
    },

            modal.querySelectorAll('.judge-btn').forEach(btn => btn.classList.remove('active'));

        // 重新渲染分组视图
        this.renderStepsGrouped();

    updateJudgeStats() {
        const steps = this.testReport.steps || [];
        const total = steps.length;
        const passed = steps.filter(s => s.judgeResult === 'pass').length;
        const failed = steps.filter(s => s.judgeResult === 'fail').length;
        const pending = total - passed - failed;
        
        // 更新统计显示
        const statsEl = document.getElementById('uit-judge-stats');
        if (statsEl) {
            statsEl.innerHTML = `
                <span class="stat-item">总计: ${total}</span>
                <span class="stat-item pass">✅ ${passed}</span>
                <span class="stat-item fail">❌ ${failed}</span>
                <span class="stat-item pending">⏳ ${pending}</span>
            `;
        }
    },
    
    // 批量评判所有未评判的步骤
    judgeAllPending(result) {
        const steps = this.testReport.steps || [];

        steps.forEach((step, index) => {
            if (!step.judgeResult) {
                step.judgeResult = result;
                count++;
            }
        });

        return names[cmd] || cmd;

                const caseSteps = report.steps.filter(s => s.testKey === tc.key);
                let stepIdx = 0;
                for (const step of caseSteps) {
                    stepIdx++;
                    const stepClass = step.success ? 'success' : 'fail';
                    const cmdName = this.getCmdDisplayName(step.cmd);
                    // 人工评判结果
                    const judgeResult = step.judgeResult;
                    const judgeText = judgeResult === 'pass' ? '✅ 人工评判: 通过' : 
                                      judgeResult === 'fail' ? '❌ 人工评判: 不通过' : '⏳ 待评判';
                    const judgeClass = judgeResult === 'pass' ? 'color:#00c853' : 
                                       judgeResult === 'fail' ? 'color:#ff5252' : 'color:#999';
                    
                    html += `
                        <div class="step ${stepClass}">
                            <div class="step-num">${stepIdx}</div>
                            <div class="step-content">
                                <div class="step-header">
                                    <span class="step-cmd">${cmdName}</span>
                                    <span class="step-time">${new Date(step.time).toLocaleTimeString()}</span>
                                </div>
                                <div class="step-desc">${step.cmd}${step.param ? ' ' + JSON.stringify(step.param) : ''}</div>
                                <div style="font-size:12px;font-weight:500;margin:6px 0;${judgeClass}">${judgeText}</div>
                                <div class="step-data">
                                    <span class="label">TX:</span> ${step.txHex || '-'}<br>
                                    <span class="label">RX:</span> ${step.rxText?.substring(0, 150) || '-'}
                                </div>
                            </div>
                            <div class="step-lcd">
                                ${step.lcdImage ? `<img src="${step.lcdImage}" alt="LCD截图">` : '<div class="step-lcd-placeholder">无截图</div>'}
                            </div>
                        </div>`;
                }
                
                if (caseSteps.length === 0) {
                    html += `
                        <div style="color:#999;font-size:12px;padding:12px;">无执行步骤记录</div>`;
                }
                
                html += `
                    </div>
                </div>
            </div>`;
            }
            
            html += `
        </div>`;
        }
        
        html += `
    </div>
</div>
</body>
</html>`;
        
        // 下载文件
        const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `UI测试报告_${report.device}_${new Date().toISOString().slice(0,10)}.html`;
        a.click();
        URL.revokeObjectURL(url);
        
        this.log('pass', '测试报告已导出');
    },
    
    // 导出DOC格式报告
    async exportDocReport() {
        if (!this.testReport.testCases || this.testReport.testCases.length === 0) {
            Utils.toast('没有测试数据，请先运行测试', 'warning');
            return;
        }
        
        const report = this.testReport;
        const passed = report.testCases.filter(c => c.passed).length;
        const failed = report.testCases.filter(c => !c.passed).length;
        const total = report.testCases.length;
        
        // 按分组组织测试用例
        const groupedCases = {};
        for (const tc of report.testCases) {
            let groupName = '未分组';
            for (let i = 0; i < this.groups.length; i++) {
                const g = this.groups[i];
                if (g.items && g.items.find(item => item.key === tc.key)) {
                    groupName = g.name;
                    break;
                }
            }
            if (!groupedCases[groupName]) {
                groupedCases[groupName] = [];
            }
            groupedCases[groupName].push(tc);
        }
        
        // 构建报告数据
        const docReport = {
            time: report.startTime,
            device: report.device,
            stats: { total, passed, failed },
            results: {},
            steps: []  // 完整步骤数据
        };
        
        // 整理结果和步骤
        for (const [groupName, cases] of Object.entries(groupedCases)) {
            docReport.results[groupName] = {};
            for (const tc of cases) {
                docReport.results[groupName][tc.key] = {
                    name: tc.name,
                    result: tc.passed ? 'pass' : 'fail'
                };
                
                // 收集该用例的完整步骤数据
                const caseSteps = report.steps.filter(s => s.testKey === tc.key);
                for (let i = 0; i < caseSteps.length; i++) {
                    const step = caseSteps[i];
                    docReport.steps.push({
                        testKey: tc.key,
                        stepNum: i + 1,
                        cmd: step.cmd,
                        cmdName: this.getCmdDisplayName(step.cmd),
                        param: step.param,
                        time: step.time,
                        judgeResult: step.judgeResult,
                        lcdImage: step.lcdImage || null
                    });
                }
            }
        }
        
        // 调用后端生成DOC报告 - 使用HTTP API
        Utils.toast('正在生成DOC报告...', 'info');
        try {
            const deviceId = DeviceConfigManager?.getCurrentDevice?.() || 'gd303_mini';
            
            // 使用 HTTP API 调用
            const response = await fetch('http://localhost:8766/api/call', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    method: 'ui_test_export_doc_report',
                    params: [docReport, deviceId]
                })
            });
            const result = await response.json();
            
            if (result && result.success) {
                // 下载生成的DOC文件
                const downloadResponse = await fetch('http://localhost:8766/api/call', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        method: 'ui_test_download_report',
                        params: [result.filename]
                    })
                });
                const downloadResult = await downloadResponse.json();
                
                if (downloadResult && downloadResult.success) {
                    const byteCharacters = atob(downloadResult.data);
                    const byteNumbers = new Array(byteCharacters.length);
                    for (let i = 0; i < byteCharacters.length; i++) {
                        byteNumbers[i] = byteCharacters.charCodeAt(i);
                    }
                    const byteArray = new Uint8Array(byteNumbers);
                    const blob = new Blob([byteArray], {type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
                    
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = result.filename;
                    a.click();
                    URL.revokeObjectURL(url);
                    
                    this.log('pass', 'DOC报告已导出: ' + result.filename);
                } else {
                    Utils.toast('下载报告失败: ' + (downloadResult?.error || ''), 'error');
                }
            } else {
                Utils.toast('生成报告失败: ' + (result?.error || ''), 'error');
            }
        } catch (e) {
            console.error('导出DOC报告失败:', e);
            Utils.toast('导出失败: ' + e.message, 'error');
        }
    }
};

window.UITestPage = UITestPage;
