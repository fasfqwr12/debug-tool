<div class="page-container" style="display:flex; flex-direction:column; height:calc(100vh - 80px); overflow:hidden;">
    <div class="page-header" style="flex-shrink:0;">
        <h1>📂 代码管理</h1>
        <div class="header-actions">
            <button class="header-btn" onclick="DevGitPage.showConfigDialog()">⚙️ Git配置</button>
            <button class="header-btn" onclick="DevGitPage.addProject()">➕ 添加工程</button>
            <button class="help-btn" onclick="switchPage('help_dev')" title="使用说明">❓</button>
        </div>
    </div>

    <div class="git-layout" style="flex:1; min-height:0; display:grid; grid-template-columns:180px 1fr 300px; gap:8px;">
        <!-- 左侧：工程列表 -->
        <div class="panel project-panel">
            <div class="panel-header">
                <span>工程列表</span>
            </div>
            <div class="project-list" id="project-list">
                <div class="empty-hint">暂无工程，点击添加</div>
            </div>
        </div>

        <!-- 中间：Git操作 -->
        <div class="panel git-panel">
            <div class="panel-header">
                <span id="git-title">选择工程</span>
                <button class="text-btn" id="btn-open-folder" style="display:none" 
                        onclick="DevGitPage.openFolder()">📂 打开目录</button>
            </div>
            
            <!-- Git状态区 -->
            <div class="git-status-area" id="git-status-area" style="display:none">
                <div class="git-info-bar">
                    <div class="git-info-item">
                        <span class="label">分支</span>
                        <select id="git-branch-select" onchange="DevGitPage.switchBranch(this.value)">
                        </select>
                    </div>
                    <div class="git-info-item">
                        <span class="label">状态</span>
                        <span id="git-status-badge" class="status-badge clean">✓ 干净</span>
                    </div>
                    <div class="git-info-item">
                        <span class="label">同步</span>
                        <span id="git-sync-info">--</span>
                    </div>
                </div>
                
                <!-- Git操作按钮 -->
                <div class="git-actions">
                    <button class="git-btn" onclick="DevGitPage.gitPull()">
                        <span class="icon">⬇️</span> Pull
                    </button>
                    <button class="git-btn" onclick="DevGitPage.gitPush()">
                        <span class="icon">⬆️</span> Push
                    </button>
                    <button class="git-btn primary" onclick="DevGitPage.showCommitDialog()">
                        <span class="icon">💾</span> Commit
                    </button>
                    <button class="git-btn" onclick="DevGitPage.showRemoteDialog()">
                        <span class="icon">🔗</span> 远程
                    </button>
                    <button class="git-btn" onclick="DevGitPage.refresh()">
                        <span class="icon">🔄</span> 刷新
                    </button>
                </div>
                
                <!-- 变更文件 -->
                <div class="changes-section">
                    <div class="section-header">
                        <span>📝 变更文件</span>
                        <span class="badge" id="changes-count">0</span>
                        <div class="section-actions">
                            <button class="mini-btn" onclick="DevGitPage.ignorePattern()" title="忽略文件类型">🚫 忽略</button>
                            <button class="mini-btn" onclick="DevGitPage.resetAll()" title="撤销所有修改">↩️ 撤销全部</button>
                        </div>
                    </div>
                    <div class="changes-list" id="changes-list">
                        <div class="empty-hint">无变更</div>
                    </div>
                </div>
            </div>
            
            <!-- 非Git仓库提示 -->
            <div class="not-git" id="not-git-area" style="display:none">
                <div class="icon">📁</div>
                <p>该目录不是Git仓库</p>
                <p class="hint">初始化或关联远程仓库</p>
                <div class="not-git-actions">
                    <button class="init-btn" onclick="DevGitPage.gitInit()">
                        🚀 初始化Git仓库
                    </button>
                    <button class="init-btn secondary" onclick="DevGitPage.showRemoteDialog()">
                        🔗 关联远程仓库
                    </button>
                </div>
            </div>
        </div>

        <!-- 右侧：提交历史 -->
        <div class="panel history-panel" style="display:flex; flex-direction:column; min-height:0; overflow:hidden;">
            <div class="panel-header" style="flex-shrink:0;">
                <span>📜 提交历史</span>
            </div>
            <div class="commit-list" id="commit-list" style="flex:1; overflow-y:auto; min-height:0; max-height:none;">
                <div class="empty-hint">选择工程查看历史</div>
            </div>
        </div>
    </div>
</div>

<!-- Git配置对话框 -->
<div class="modal-overlay" id="git-config-modal" style="display:none">
    <div class="modal-content">
        <div class="modal-header">
            <h3>⚙️ Git配置</h3>
            <button class="close-btn" onclick="DevGitPage.hideConfigDialog()">×</button>
        </div>
        <div class="modal-body">
            <div class="config-notice">
                <p>💡 首次使用Git需要配置用户信息</p>
            </div>
            <div class="form-group">
                <label>用户名 *</label>
                <input type="text" id="git-config-name" placeholder="你的名字">
            </div>
            <div class="form-group">
                <label>邮箱 *</label>
                <input type="text" id="git-config-email" placeholder="your@email.com">
            </div>
            <div class="hint-text">
                此信息将用于Git提交记录
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-cancel" onclick="DevGitPage.hideConfigDialog()">稍后配置</button>
            <button class="btn-confirm" onclick="DevGitPage.saveGitConfig()">保存配置</button>
        </div>
    </div>
</div>

<!-- 远程仓库对话框 -->
<div class="modal-overlay" id="remote-modal" style="display:none">
    <div class="modal-content" style="width:450px">
        <div class="modal-header">
            <h3>🔗 远程仓库设置</h3>
            <button class="close-btn" onclick="DevGitPage.hideRemoteDialog()">×</button>
        </div>
        <div class="modal-body">
            <div class="platform-tabs">
                <button class="tab active" data-platform="gitee">Gitee</button>
                <button class="tab" data-platform="github">GitHub</button>
            </div>
            
            <div class="form-group">
                <label>仓库地址 *</label>
                <input type="text" id="remote-url" placeholder="https://gitee.com/用户名/仓库名.git">
            </div>
            
            <div class="credentials-section">
                <h4>📝 账号信息（用于Push/Pull）</h4>
                <div class="form-group">
                    <label>用户名 *</label>
                    <input type="text" id="git-username" placeholder="Gitee/GitHub 用户名">
                </div>
                <div class="form-group">
                    <label>密码/Token *</label>
                    <input type="password" id="git-password" placeholder="密码或Personal Access Token">
                </div>
                <div class="hint-text">
                    💡 建议使用Token，更安全。<a href="https://gitee.com/profile/personal_access_tokens" target="_blank">获取Gitee Token</a>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-cancel" onclick="DevGitPage.hideRemoteDialog()">取消</button>
            <button class="btn-confirm" onclick="DevGitPage.saveRemoteWithCredentials()">保存并连接</button>
        </div>
    </div>
</div>

<!-- 提交对话框 -->
<div class="modal-overlay" id="commit-modal" style="display:none">
    <div class="modal-content">
        <div class="modal-header">
            <h3>💾 提交更改</h3>
            <button class="close-btn" onclick="DevGitPage.hideCommitDialog()">×</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label>提交信息</label>
                <textarea id="commit-message" rows="4" placeholder="描述本次更改..."></textarea>
            </div>
            <div class="form-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="commit-add-all" checked>
                    添加所有变更文件 (git add -A)
                </label>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-cancel" onclick="DevGitPage.hideCommitDialog()">取消</button>
            <button class="btn-confirm" onclick="DevGitPage.doCommit()">提交</button>
        </div>
    </div>
</div>

<style>
.git-layout {
    display: grid;
    grid-template-columns: 180px 1fr 280px;
    gap: 8px;
    height: calc(100vh - 140px);
    min-height: 400px;
}

.git-layout .panel {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    height: 100%;
    min-height: 0;
}

.git-layout .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 10px;
    background: var(--input-bg);
    border-bottom: 1px solid var(--border-color);
    font-weight: 600;
    font-size: 12px;
}

.git-layout .text-btn {
    background: none; border: none; color: var(--text-muted);
    cursor: pointer; font-size: 12px;
}
.git-layout .text-btn:hover { color: var(--primary-color); }

/* 工程列表 */
.git-layout .project-list { flex: 1; overflow-y: auto; padding: 8px; }

.git-layout .project-card {
    display: flex; align-items: center; gap: 8px;
    padding: 8px; border-radius: 6px; cursor: pointer;
    margin-bottom: 4px; border-left: 2px solid transparent;
    transition: all 0.2s;
}
.git-layout .project-card:hover { background: var(--input-bg); }
.git-layout .project-card.active {
    background: var(--accent-dim);
    border-left-color: var(--accent);
}
.git-layout .project-card .icon { font-size: 18px; }
.git-layout .project-card .info { flex: 1; min-width: 0; }
.git-layout .project-card .name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.git-layout .project-card .path { font-size: 10px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.git-layout .project-remove {
    width: 22px; height: 22px;
    border-radius: 6px;
    border: 1px solid transparent;
    background: rgba(0,0,0,0.15);
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}
.git-layout .project-remove:hover {
    border-color: rgba(239, 68, 68, 0.7);
    color: rgba(239, 68, 68, 0.95);
    background: rgba(239, 68, 68, 0.08);
}

/* Git状态区 */
.git-status-area { padding: 10px; flex: 1; display: flex; flex-direction: column; overflow: hidden; }

.git-info-bar {
    display: flex; gap: 16px; padding: 8px 12px;
    background: var(--input-bg); border-radius: 6px; margin-bottom: 10px;
}
.git-info-item { display: flex; align-items: center; gap: 6px; }
.git-info-item .label { font-size: 11px; color: var(--text-muted); }
.git-info-item select {
    background: var(--card-bg); border: 1px solid var(--border-color);
    border-radius: 4px; padding: 4px 8px; color: var(--text-color);
    font-size: 12px;
}

.status-badge {
    padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: 500;
}
.status-badge.clean { background: var(--accent-dim); color: var(--accent); }
.status-badge.dirty { background: rgba(245, 158, 11, 0.15); color: var(--color-warning, #f59e0b); }

/* Git操作按钮 - 霓虹发光 */
.git-actions {
    display: flex; gap: 6px; margin-bottom: 8px;
    flex-wrap: wrap;
}
.git-btn {
    display: flex; align-items: center; gap: 4px;
    padding: 5px 10px; border-radius: 4px;
    background: var(--card-bg); 
    border: 1px solid var(--border-color);
    color: var(--text-color); cursor: pointer; font-size: 12px; font-weight: 500;
    transition: all 0.2s;
    white-space: nowrap;
    flex-shrink: 0;
}
.git-btn:hover { 
    border-color: var(--accent);
    color: var(--accent);
}
.git-btn.primary { 
    background: var(--accent);
    border-color: var(--accent);
    color: var(--text-on-accent);
}
.git-btn.primary:hover {
    box-shadow: 0 0 10px var(--accent-glow);
}
.git-btn .icon { font-size: 14px; }

/* 变更文件 */
.changes-section { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.section-header {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 500; margin-bottom: 12px;
}
.section-actions { margin-left: auto; display: flex; gap: 6px; }
.mini-btn {
    padding: 5px 10px; font-size: 11px; border-radius: 4px;
    background: var(--card-bg); border: 1px solid var(--border-color);
    color: var(--text-muted); cursor: pointer; font-weight: 500;
    transition: all 0.2s;
}
.mini-btn:hover { 
    border-color: var(--accent); 
    color: var(--accent);
}
.badge {
    background: var(--accent); color: var(--text-on-accent);
    padding: 2px 8px; border-radius: 8px; font-size: 10px; font-weight: 600;
}
.changes-list { flex: 1; overflow-y: auto; }

.change-item {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; border-radius: 4px;
    background: var(--input-bg); 
    border: 1px solid var(--border-color);
    margin-bottom: 4px;
    font-size: 11px;
}
.change-item .type {
    min-width: 22px; 
    width: 22px; 
    height: 22px; 
    border-radius: 4px;
    display: flex; 
    align-items: center; 
    justify-content: center;
    font-size: 11px; 
    font-weight: bold;
    flex-shrink: 0;
}
.change-item .type.M { background: #f59e0b; color: var(--text-on-accent); }
.change-item .type.A { background: #22c55e; color: var(--text-on-accent); }
.change-item .type.D { background: #ef4444; color: var(--text-on-danger); }
.change-item .type.U { background: #6366f1; color: var(--text-on-danger); }
.change-item .file { flex: 1; font-family: monospace; }

/* 非Git提示 */
.not-git {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: var(--text-muted);
}
.not-git .icon { font-size: 48px; margin-bottom: 16px; }
.not-git p { margin: 4px 0; }
.not-git .hint { font-size: 12px; }
.not-git-actions { display: flex; gap: 12px; margin-top: 20px; }
.init-btn {
    padding: 10px 20px; border-radius: 6px;
    background: var(--accent); 
    border: none;
    color: var(--text-on-accent); font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all 0.2s;
}
.init-btn:hover { 
    box-shadow: 0 0 12px var(--accent-glow);
}
.init-btn.secondary {
    background: var(--card-bg); 
    border: 1px solid var(--border-color);
    color: var(--text-color);
}
.init-btn.secondary:hover { 
    border-color: var(--accent); 
    color: var(--accent);
}
.hint-text { font-size: 12px; color: var(--text-muted); margin-top: 8px; }
.config-notice {
    padding: 12px; background: rgba(245, 158, 11, 0.1);
    border: 1px solid rgba(245, 158, 11, 0.3);
    border-radius: 8px; margin-bottom: 16px;
}
.config-notice p { margin: 0; font-size: 13px; color: #f59e0b; }
.form-group input {
    width: 100%; padding: 10px;
    background: var(--input-bg); border: 1px solid var(--border-color);
    border-radius: 6px; color: var(--text-color); font-size: 13px;
}

/* 平台选项卡 */
.platform-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
.platform-tabs .tab {
    flex: 1; padding: 12px; border-radius: 8px;
    background: rgba(15, 25, 45, 0.9); 
    border: 2px solid rgba(0, 212, 255, 0.3);
    color: #00d4ff; cursor: pointer; font-size: 13px; font-weight: 500;
    transition: all 0.25s;
}
.platform-tabs .tab:hover {
    border-color: rgba(0, 212, 255, 0.6);
    box-shadow: 0 0 10px rgba(0, 212, 255, 0.2);
}
.platform-tabs .tab.active {
    background: rgba(0, 255, 136, 0.15); 
    color: #00ff88;
    border-color: #00ff88;
    box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
}

/* 凭据区域 */
.credentials-section {
    margin-top: 16px; padding: 16px;
    background: rgba(15, 25, 45, 0.9); 
    border: 1px solid rgba(0, 255, 136, 0.15);
    border-radius: 8px;
}
.credentials-section h4 {
    font-size: 13px; margin-bottom: 12px;
}
.hint-text a { color: var(--primary-color); }

/* 提交历史 */
.commit-list { flex: 1; overflow-y: auto; padding: 6px; min-height: 0; }

.commit-item {
    padding: 8px; border-radius: 6px;
    background: var(--input-bg); 
    border: 1px solid var(--border-color);
    margin-bottom: 6px;
}
.commit-item .header {
    display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
}
.commit-item .revert-btn {
    margin-left: auto; padding: 2px 6px; font-size: 11px;
    background: transparent; border: 1px solid var(--border-color);
    border-radius: 4px; color: var(--text-muted); cursor: pointer;
}
.commit-item .revert-btn:hover { border-color: var(--primary-color); color: var(--primary-color); }
.commit-item.current { border-left: 3px solid var(--primary-color); background: rgba(0,255,157,0.1); }
.commit-item .current-badge {
    background: var(--primary-color); color: var(--text-on-accent);
    padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 500;
}
.detached-warning {
    background: rgba(245,158,11,0.2); border: 1px solid rgba(245,158,11,0.5);

}
.back-to-latest-btn {
    background: #f59e0b; color: var(--text-on-accent); border: none;

}
.back-to-latest-btn:hover { background: #d97706; }
.commit-item .hash {

}
.commit-item .date { font-size: 11px; color: var(--text-muted); }
.commit-item .message { font-size: 12px; line-height: 1.4; }
.commit-item .author { font-size: 11px; color: var(--text-muted); margin-top: 6px; }

/* Diff视图 - 深色背景清晰可读 */
.diff-view {
    margin: 0; padding: 8px; font-family: 'Consolas', 'Monaco', monospace;
    font-size: 12px; line-height: 1.6; 
    background: rgba(8, 15, 25, 0.98);
    border: 1px solid rgba(0, 255, 136, 0.2);
    border-radius: 8px;
    max-height: 70vh; overflow: auto;
}
.diff-line { padding: 3px 12px; white-space: pre-wrap; word-break: break-all; color: #e0e0e0; }
.diff-line.add { background: rgba(34,197,94,0.25); color: #4ade80; }
.diff-line.del { background: rgba(239,68,68,0.25); color: #f87171; }
.diff-line.info { background: rgba(59,130,246,0.2); color: #60a5fa; }
.diff-line.header { color: #00d4ff; font-weight: 600; background: rgba(0,212,255,0.1); }
.diff-line .line-num {
    display: inline-block; width: 40px; color: var(--text-muted);
    text-align: right; margin-right: 12px; user-select: none;
}
.change-item { cursor: pointer; }
.change-item:hover { background: rgba(0, 255, 136, 0.1); }

/* 通用 */
.empty-hint { color: var(--text-muted); text-align: center; padding: 40px; font-size: 13px; }

.page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.page-header h1 { margin: 0; font-size: 22px; }
.page-header .header-actions { display: flex; gap: 10px; align-items: center; }
.header-btn {
    padding: 8px 16px; background: var(--input-bg);
    border: 1px solid var(--border-color); border-radius: 6px;
    color: var(--text-color); cursor: pointer; font-size: 13px;
}
.header-btn:hover { border-color: var(--primary-color); }
.help-btn {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--input-bg); border: 1px solid var(--border-color);
    color: var(--text-muted); cursor: pointer; font-size: 14px;
}
.help-btn:hover { border-color: var(--primary-color); color: var(--primary-color); }

/* 模态框 */
.modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6); display: flex;
    align-items: center; justify-content: center; z-index: 1000;

.modal-content {
    background: rgba(12, 20, 35, 0.98); 
    border: 2px solid rgba(0, 255, 136, 0.3);

.modal-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px; border-bottom: 1px solid var(--border-color);
}
.modal-header h3 { margin: 0; font-size: 16px; }
.modal-header .close-btn {
    width: 28px; height: 28px; border-radius: 4px;
    background: transparent; border: none;
    color: var(--text-muted); cursor: pointer; font-size: 18px;
}
.modal-body { padding: 16px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
.form-group textarea {
    width: 100%; padding: 12px; border-radius: 8px;
    background: rgba(0, 15, 30, 0.9); 
    border: 2px solid rgba(0, 212, 255, 0.4);
    color: var(--text-color); font-size: 13px; resize: none;
}
.form-group textarea:focus {
    outline: none;
    border-color: #00ff88;
    box-shadow: 0 0 10px rgba(0, 255, 136, 0.2);
}
.checkbox-label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; color: var(--text-color); }
.modal-footer {
    display: flex; justify-content: flex-end; gap: 10px;
    padding: 16px; border-top: 1px solid rgba(0, 255, 136, 0.2);
