<!-- 层级状态机编辑器 - 优化版 -->
<style>
    .hsm-container {
        display: grid;
        grid-template-columns: 220px 1fr 380px;
        grid-template-rows: 36px 1fr;
        height: 100%;
        background: var(--bg-primary);
    }
    
    /* 顶部工具栏 */
    .hsm-toolbar {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        padding: 4px 12px;
        background: var(--bg-secondary);
        border-bottom: 1px solid var(--border-color);
        gap: 8px;
    }
    .hsm-toolbar h1 { font-size: 14px; margin: 0; white-space: nowrap; }
    .hsm-toolbar-sep { width: 1px; height: 20px; background: var(--border-color); }
    .hsm-btn {
        padding: 4px 10px;
        background: var(--bg-tertiary);
        border: 1px solid var(--border-color);
        border-radius: 4px;
        color: var(--text-primary);
        font-size: 11px;
        cursor: pointer;
        white-space: nowrap;
    }
    .hsm-btn:hover { border-color: var(--accent-color); }
    .hsm-btn.primary { background: var(--accent-color); border-color: var(--accent-color); color: white; }
    .hsm-btn.success { background: #22c55e; border-color: #22c55e; color: white; }
    
    /* 面包屑 */
    .hsm-breadcrumb { display: flex; align-items: center; gap: 4px; font-size: 11px; }
    .hsm-breadcrumb-item { padding: 2px 6px; background: var(--bg-tertiary); border-radius: 3px; cursor: pointer; }
    .hsm-breadcrumb-item:hover, .hsm-breadcrumb-item.current { background: var(--accent-color); color: white; }
    .hsm-breadcrumb-sep { color: var(--text-muted); font-size: 10px; }
    
    /* 左侧面板 */
    .hsm-left {
        display: flex;
        flex-direction: column;
        background: var(--bg-secondary);
        border-right: 1px solid var(--border-color);
        overflow: hidden;
        min-width: 0;
    }
    .hsm-panel { display: flex; flex-direction: column; border-bottom: 1px solid var(--border-color); }
    .hsm-panel.flex { flex: 1; min-height: 0; overflow: hidden; }
    .hsm-panel-header {
        padding: 6px 8px;
        background: var(--bg-tertiary);
        font-size: 11px;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    .hsm-panel-content { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 6px; min-height: 0; }
    
    /* 层级指示器 */
    .hsm-level-indicator { display: flex; gap: 3px; margin-bottom: 6px; }
    .hsm-level-dot {
        width: 20px; height: 20px;
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 10px; font-weight: 600;
        cursor: pointer;
    }
    .hsm-level-dot.l0 { background: #ef444430; color: #ef4444; }
    .hsm-level-dot.l1 { background: #f59e0b30; color: #f59e0b; }
    .hsm-level-dot.l2 { background: #3b82f630; color: #3b82f6; }
    .hsm-level-dot.l3 { background: #22c55e30; color: #22c55e; }
    .hsm-level-dot.active { transform: scale(1.15); box-shadow: 0 0 6px currentColor; }
    
    /* 状态树 - 紧凑版 */
    .hsm-tree-node { margin-bottom: 1px; }
    .hsm-tree-header {
        display: grid;
        grid-template-columns: var(--indent, 0px) 14px 14px 1fr;
        align-items: center;
        gap: 2px;
        padding: 4px 4px 4px 2px;
        background: var(--bg-primary);
        border-radius: 3px;
        cursor: pointer;
        border: 1px solid transparent;
        font-size: 11px;
        min-height: 24px;
    }
    .hsm-tree-header:hover { border-color: var(--accent-color); background: var(--bg-tertiary); }
    .hsm-tree-header.selected { border-color: var(--accent-color); background: rgba(34,197,94,0.15); }
    .hsm-tree-spacer { /* 动态缩进占位 */ }
    .hsm-tree-expand { 
        width: 14px; height: 14px;
        display: flex; align-items: center; justify-content: center;
        font-size: 8px; color: var(--text-muted); 
        transition: transform 0.15s;
        border-radius: 2px;
    }
    .hsm-tree-expand:hover { background: var(--bg-tertiary); }
    .hsm-tree-expand.expanded { transform: rotate(90deg); }
    .hsm-tree-expand.empty { visibility: hidden; }
    .hsm-tree-icon { font-size: 11px; text-align: center; }
    .hsm-tree-name { 
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        padding-right: 4px;
    }
    .hsm-tree-badge { font-size: 8px; padding: 0 3px; border-radius: 4px; margin-left: 2px; }
    .hsm-tree-badge.initial { background: #22c55e30; color: #22c55e; }
    /* 子节点容器 - 无额外缩进，缩进由grid控制 */
    .hsm-tree-children { display: none; }
    .hsm-tree-children.expanded { display: block; }
    
    /* 中间画布 */
    .hsm-canvas-area {
        position: relative;
        overflow: hidden;
        background: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
        background-size: 20px 20px;
    }
    #hsm-canvas { position: absolute; top: 0; left: 0; }
    
    .hsm-canvas-toolbar {
        position: absolute; top: 8px; left: 8px;
        display: flex; gap: 2px;
        background: var(--bg-secondary);
        padding: 3px;
        border-radius: 6px;
        border: 1px solid var(--border-color);
        z-index: 10;
    }
    .hsm-canvas-btn {
        width: 26px; height: 26px;
        display: flex; align-items: center; justify-content: center;
        background: transparent;
        border: none; border-radius: 3px;
        color: var(--text-secondary);
        cursor: pointer; font-size: 12px;
    }
    .hsm-canvas-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .hsm-canvas-btn.active { background: var(--accent-color); color: white; }
    
    .hsm-zoom-indicator {
        position: absolute; bottom: 8px; left: 8px;
        padding: 3px 8px;
        background: var(--bg-secondary);
        border-radius: 3px;
        font-size: 10px;
        color: var(--text-muted);
        border: 1px solid var(--border-color);
    }
    .hsm-level-hint {
        position: absolute; bottom: 8px; right: 8px;
        padding: 4px 10px;
        background: var(--bg-secondary);
        border-radius: 4px;
        font-size: 11px;
        border: 1px solid var(--border-color);
        display: flex; align-items: center; gap: 6px;
    }
    .hsm-level-hint-icon {
        width: 20px; height: 20px;
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 10px;
    }
    .hsm-empty-hint {
        position: absolute; top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        text-align: center; color: var(--text-muted);
    }
    .hsm-empty-hint h2 { font-size: 18px; margin-bottom: 6px; }
    .hsm-empty-hint p { font-size: 12px; margin-bottom: 12px; }
    .hsm-shortcuts {
        position: absolute; bottom: 32px; left: 8px;
        font-size: 9px; color: var(--text-muted);
        background: var(--bg-secondary);
        padding: 4px 8px;
        border-radius: 3px;
        border: 1px solid var(--border-color);
    }
    .hsm-shortcuts kbd { background: var(--bg-tertiary); padding: 1px 4px; border-radius: 2px; }
    
    /* 右侧面板 - LCD固定顶部，下方Tab切换 */
    .hsm-right {
        display: flex;
        flex-direction: column;
        background: var(--bg-secondary);
        border-left: 1px solid var(--border-color);
        overflow: hidden;
    }
    
    /* LCD预览 - 固定顶部 */
    .hsm-lcd-panel {
        border-bottom: 1px solid var(--border-color);
        flex-shrink: 0;
    }
    
    /* Tab容器 */
    .hsm-tab-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow: hidden;
    }
    .hsm-tab-header {
        display: flex;
        border-bottom: 1px solid var(--border-color);
        background: var(--bg-tertiary);
        flex-shrink: 0;
    }
    .hsm-tab-btn {
        flex: 1;
        padding: 8px 12px;
        font-size: 11px;
        background: transparent;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        border-bottom: 2px solid transparent;
        transition: all 0.2s;
    }
    .hsm-tab-btn:hover {
        color: var(--text-primary);
        background: var(--bg-secondary);
    }
    .hsm-tab-btn.active {
        color: var(--accent-color);
        border-bottom-color: var(--accent-color);
        background: var(--bg-secondary);
    }
    .hsm-tab-content {
        flex: 1;
        overflow-y: auto;
        display: none;
    }
    .hsm-tab-content.active {
        display: block;
    }
    .hsm-lcd-preview {
        background: #0a1a0a;
        border-radius: 4px;
        position: relative;
        cursor: crosshair;
        max-height: 200px;
        overflow: hidden;
    }
    .hsm-lcd-preview canvas {
        width: 100%;
        height: auto;
        display: block;
        object-fit: contain;
        max-height: 200px;
    }
    .hsm-lcd-labels {
        position: absolute;
        top: 4px;
        right: 4px;
        display: flex;
        flex-wrap: wrap;
        gap: 2px;
        max-width: 120px;
        justify-content: flex-end;
    }
    .hsm-lcd-label {
        font-size: 8px;
        padding: 1px 4px;
        background: rgba(0,255,136,0.8);
        color: #000;
        border-radius: 2px;
        cursor: pointer;
    }
    .hsm-lcd-label:hover { background: #fff; }
    
    /* 模拟控制面板 */
    .hsm-sim-panel {
        display: flex;
        flex-direction: column;
        height: 100%;
    }
    .hsm-sim-content {
        padding: 8px !important;
        overflow-y: auto;
        flex: 1;
    }
    .hsm-sim-btn {
        padding: 2px 6px !important;
        font-size: 12px !important;
    }
    .hsm-sim-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }
    .hsm-sim-section {
        margin-bottom: 8px;
    }
    .hsm-sim-label {
        font-size: 10px;
        color: var(--text-muted);
        margin-bottom: 4px;
        font-weight: 600;
    }
    .hsm-sim-state {
        font-size: 14px;
        font-weight: 600;
        color: #22c55e;
        padding: 4px 8px;
        background: rgba(34, 197, 94, 0.15);
        border-radius: 4px;
        text-align: center;
    }
    .hsm-sim-vars {
        display: flex;
        flex-direction: column;
        gap: 2px;
        max-height: 60px;
        overflow-y: auto;
    }
    .hsm-sim-var {
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        padding: 2px 4px;
        background: var(--bg-tertiary);
        border-radius: 2px;
    }
    .hsm-sim-var span:first-child { color: var(--text-muted); }
    .hsm-sim-var span:last-child { color: #3b82f6; font-family: monospace; }
    .hsm-sim-events {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
    }
    .hsm-sim-event-btn {
        padding: 3px 6px;
        font-size: 10px;
        background: var(--bg-tertiary);
        border: 1px solid var(--border-color);
        border-radius: 3px;
        color: var(--text-primary);
        cursor: pointer;
    }
    .hsm-sim-event-btn:hover {
        border-color: var(--accent-color);
        background: var(--accent-color);
        color: white;
    }
    .hsm-sim-event-measure {
        background: rgba(34, 197, 94, 0.2);
        border-color: #22c55e;
    }
    .hsm-sim-event-timer {
        background: rgba(245, 158, 11, 0.2);
        border-color: #f59e0b;
    }
    .hsm-sim-history-section {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
    }
    .hsm-sim-history {
        flex: 1;
        max-height: 80px;
        overflow-y: auto;
        font-size: 10px;
        background: var(--bg-primary);
        border-radius: 3px;
        padding: 4px;
    }
    .hsm-sim-history-item {
        padding: 2px 0;
        border-bottom: 1px solid var(--border-color);
        display: flex;
        gap: 4px;
    }
    .hsm-sim-history-item:last-child { border-bottom: none; }
    .hsm-sim-history-event { color: #3b82f6; }
    .hsm-sim-history-arrow { color: var(--text-muted); }
    .hsm-sim-history-state { color: #22c55e; }
    .hsm-sim-history-empty {
        color: var(--text-muted);
        text-align: center;
        padding: 8px;
    }
    
    /* 属性面板 */
    .hsm-props-panel { 
        height: 100%;
        display: flex; 
        flex-direction: column; 
    }
    .hsm-props-content {
        flex: 1;
        overflow-y: auto;
        padding: 8px;
    }
    .hsm-props-empty {
        flex: 1;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        color: var(--text-muted);
        padding: 16px;
        text-align: center;
    }
    .hsm-props-empty-icon { font-size: 36px; margin-bottom: 8px; opacity: 0.5; }
    
    /* 属性表单 */
    .hsm-form-group { margin-bottom: 8px; }
    .hsm-form-group label { display: block; font-size: 10px; color: var(--text-muted); margin-bottom: 2px; }
    .hsm-form-group input, .hsm-form-group select, .hsm-form-group textarea {
        width: 100%;
        padding: 5px 8px;
        background: var(--bg-primary);
        border: 1px solid var(--border-color);
        border-radius: 3px;
        color: var(--text-primary);
        font-size: 12px;
    }
    .hsm-form-group input:focus, .hsm-form-group select:focus { outline: none; border-color: var(--accent-color); }
    
    /* 可搜索下拉 */
    .hsm-searchable-select {
        position: relative;
    }
    .hsm-searchable-input {
        width: 100%;
        padding: 5px 8px;
        background: var(--bg-primary);
        border: 1px solid var(--border-color);
        border-radius: 3px;
        color: var(--text-primary);
        font-size: 11px;
    }
    .hsm-searchable-dropdown {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        max-height: 150px;
        overflow-y: auto;
        background: var(--bg-primary);
        border: 1px solid var(--accent-color);
        border-radius: 3px;
        z-index: 100;
        display: none;
    }
    .hsm-searchable-dropdown.show { display: block; }
    .hsm-searchable-option {
        padding: 4px 8px;
        font-size: 11px;
        cursor: pointer;
    }
    .hsm-searchable-option:hover { background: var(--accent-color); color: white; }
    .hsm-searchable-option.selected { background: var(--accent-color); color: white; }
    
    /* 动作标签 */
    .hsm-action-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .hsm-action-tag {
        padding: 2px 8px;
        background: var(--bg-tertiary);
        border-radius: 10px;
        font-size: 10px;
        cursor: pointer;
        border: 1px solid transparent;
        display: flex;
        align-items: center;
        gap: 4px;
    }
    .hsm-action-tag:hover { border-color: var(--accent-color); }
    .hsm-action-tag .remove { color: #ef4444; font-weight: bold; }
    
    /* 子状态/转移列表 */
    .hsm-children-list { display: flex; flex-direction: column; gap: 2px; }
    .hsm-child-item {
        display: flex; align-items: center; gap: 6px;
        padding: 5px 8px;
        background: var(--bg-primary);
        border-radius: 3px;
        font-size: 11px;
        cursor: pointer;
        border: 1px solid transparent;
    }
    .hsm-child-item:hover { border-color: var(--accent-color); }
    .hsm-child-item.initial { border-left: 2px solid #22c55e; }
    
    .hsm-transition-item {
        display: flex; align-items: center; gap: 6px;
        padding: 4px 8px;
        background: var(--bg-primary);
        border-radius: 3px;
        font-size: 10px;
        margin-bottom: 2px;
        border-left: 2px solid var(--accent-color);
    }
    .hsm-transition-event { padding: 1px 5px; background: var(--bg-tertiary); border-radius: 3px; font-weight: 500; }
    
    /* 属性面板内部样式 */
    .hsm-prop-section { margin-bottom: 10px; }
    .hsm-prop-section label { display: block; font-size: 10px; color: var(--text-muted); margin-bottom: 3px; }
    .hsm-input, .hsm-select, .hsm-textarea {
        width: 100%; padding: 5px 8px;
        background: var(--bg-primary); border: 1px solid var(--border-color);
        border-radius: 3px; color: var(--text-primary); font-size: 11px;
    }
    .hsm-input:focus, .hsm-select:focus { outline: none; border-color: var(--accent-color); }
    .hsm-textarea { min-height: 40px; resize: vertical; }
    .hsm-btn-mini { padding: 1px 6px; font-size: 10px; background: var(--accent-color); color: white; border: none; border-radius: 3px; cursor: pointer; }
    .hsm-tag-list { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .hsm-tag { padding: 2px 6px; border-radius: 10px; font-size: 10px; display: flex; align-items: center; gap: 4px; }
    .hsm-tag-action { background: #f59e0b30; color: #f59e0b; }
    .hsm-tag-comp { background: #8b5cf630; color: #8b5cf6; }
    .hsm-tag-preset { background: #06b6d430; color: #06b6d4; }
    .hsm-tag-anim { background: #ec489930; color: #ec4899; }
    .hsm-tag-expect { background: #22c55e30; color: #22c55e; }
    .hsm-tag-lcd { background: #3b82f630; color: #3b82f6; }
    .hsm-tag-timeout { background: #64748b30; color: #64748b; }
    .hsm-tag-exit { background: #ef444430; color: #ef4444; }
    .hsm-tag-hw { background: #ef444430; color: #ef4444; }
    .hsm-tag-flow { background: #f9731630; color: #f97316; }
    .hsm-tag-macro { background: #8b5cf630; color: #8b5cf6; }
    .hsm-tag-var { background: #10b98130; color: #10b981; }
    .hsm-tag-calc { background: #6366f130; color: #6366f1; }
    .hsm-tag-cond { background: #f9731630; color: #f97316; }
    .hsm-tag-remove { cursor: pointer; font-weight: bold; opacity: 0.7; }
    .hsm-tag-remove:hover { opacity: 1; }
    .hsm-hint { font-size: 9px; color: var(--text-muted); margin-top: 4px; }
    .hsm-empty { color: var(--text-muted); font-size: 11px; text-align: center; padding: 12px; }
    
    /* 流程属性区域样式 */
    .hsm-flow-section {
        background: rgba(34, 197, 94, 0.1);
        border: 1px solid rgba(34, 197, 94, 0.3);
        border-radius: 6px;
        padding: 8px;
        margin: 8px 0;
    }
    .hsm-flow-section label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: #4ade80;
    }
    .hsm-flow-section input[type="checkbox"] {
        width: 14px;
        height: 14px;
        accent-color: #22c55e;
    }
    .hsm-flow-section .hsm-hint {
        color: #86efac;
    }
    
    /* 搜索对话框 */
    .hsm-dialog-overlay {
        position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.5); z-index: 10000;
        display: flex; align-items: center; justify-content: center;
    }
    .hsm-dialog {
        background: var(--bg-secondary); border-radius: 8px;
        width: 320px; max-height: 400px;
        border: 1px solid var(--border-color);
        box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }
    .hsm-dialog-header {
        padding: 10px 12px; border-bottom: 1px solid var(--border-color);
        display: flex; justify-content: space-between; align-items: center;
        font-size: 13px; font-weight: 600;
    }
    .hsm-dialog-close { background: none; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer; }
    .hsm-dialog-close:hover { color: var(--text-primary); }
    .hsm-dialog-body { padding: 10px; }
    .hsm-search-input {
        width: 100%; padding: 8px 10px;
        background: var(--bg-primary); border: 1px solid var(--border-color);
        border-radius: 4px; color: var(--text-primary); font-size: 12px;
        margin-bottom: 8px;
    }
    .hsm-search-input:focus { outline: none; border-color: var(--accent-color); }
    .hsm-search-list { max-height: 250px; overflow-y: auto; }
    .hsm-search-category {
        font-size: 10px; color: var(--text-muted); padding: 6px 10px 3px;
        font-weight: 600; border-bottom: 1px solid var(--border-color);
        margin-top: 4px; background: var(--bg-tertiary);
    }
    .hsm-search-category:first-child { margin-top: 0; }
    .hsm-search-item {
        padding: 8px 10px; cursor: pointer; border-radius: 4px;
        border: 1px solid transparent; margin-bottom: 2px;
    }
    .hsm-search-item:hover { background: var(--bg-tertiary); border-color: var(--accent-color); }
    .hsm-search-item-name { font-size: 12px; font-weight: 500; }
    .hsm-search-item-desc { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
    
    /* 事件项 */
    .hsm-event-item {
        display: flex; align-items: center; gap: 6px;
        padding: 4px 6px; background: var(--bg-primary);
        border-radius: 3px; margin-bottom: 2px;
        font-size: 10px; cursor: grab;
    }
    .hsm-event-item:hover { background: var(--bg-tertiary); }
    .hsm-event-icon { font-size: 10px; }
    .hsm-event-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hsm-event-more { font-size: 9px; color: var(--text-muted); text-align: center; padding: 4px; }
    
    /* Toast */

                        <!-- 模拟控制按钮 -->
