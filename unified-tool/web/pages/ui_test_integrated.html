<script>
/**
 * UI测试集成模块 - 规范化测试流程 + 自动化执行
 */
const UITestIntegrated = {
    // 测试数据
    testGroups: [],      // 测试分组
    testItems: {},       // 测试项 {groupId: [items]}
    testResults: {},     // 测试结果 {itemKey: 'pass'|'fail'|null}
    
    // 状态
    currentGroupId: null,
    running: false,
    aborted: false,
    
    // 统计
    stats: { total: 0, passed: 0, failed: 0 },
    
    async init() {
        console.log('UITestIntegrated init');
        this.updateSerialStatus();
        this.updateDeviceModel();
        
        // 监听串口状态
        if (window.DeviceHub) {
            DeviceHub.onStatusChange(() => {
                this.updateSerialStatus();
                this.updateDeviceModel();
            });
        }
        
        // 加载测试用例
        await this.loadTestCases();
    },
    
    destroy() {
        console.log('UITestIntegrated destroy');
        this.aborted = true;
    },
    
    // ==================== 数据加载 ====================
    
    async loadTestCases() {
        this.log('info', '正在加载测试用例...');
        
        try {
            const result = await API.call('ui_test_load_cases');
            if (result && result.success && result.cases) {
                this.parseTestCases(result.cases);
                this.renderGroups();
                this.updateStats();
                this.log('info', `已加载 ${result.count} 个测试用例`);
            } else {
                this.log('fail', '加载测试用例失败');
            }
        } catch (e) {
            console.error('加载测试用例失败:', e);
            this.log('fail', '加载失败: ' + e.message);
        }
    },
    
    parseTestCases(cases) {
        // 按标签分组
        const groupMap = {};
        
        cases.forEach(tc => {
            // 每个测试用例作为一个测试项
            const tags = tc.tags || ['其他'];
            const primaryTag = tags[0] || '其他';
            
            if (!groupMap[primaryTag]) {
                groupMap[primaryTag] = {
                    id: primaryTag,
                    name: this.getGroupName(primaryTag),
                    items: []
                };
            }
            
            groupMap[primaryTag].items.push({
                key: tc.id,
                name: tc.name,
                desc: tc.description || '',
                caseData: tc,  // 保存完整用例数据用于自动执行
                autoSupport: tc.steps && tc.steps.length > 0  // 是否支持自动执行
            });
        });
        
        this.testGroups = Object.values(groupMap);
        this.testItems = {};
        this.testGroups.forEach(g => {
            this.testItems[g.id] = g.items;
        });
        
        // 初始化结果
        this.testResults = {};
        this.testGroups.forEach(g => {
            g.items.forEach(item => {
                this.testResults[item.key] = null;
            });
        });
    },

    getGroupName(tag) {
        const names = {
            'basic': '基础功能',
            'single': '单次测量',
            'history': '历史数据',
            'scroll': '数据滚动',
            'error': '错误处理',
            'mode': '模式切换',
            'clear': '清除功能',
            'unit': '单位转换',
            'meter': '米制单位',
            'feet': '英尺单位',
            'inch': '英寸单位',
            'base': '基准偏移',
            'front': '前基准',
            'back': '后基准',
            'area': '面积测量',
            'volume': '体积测量',
            'multi': '多步测量',
            'continuous': '连续测量',
            'max': '最大值',
            'min': '最小值',
        };
        return names[tag] || tag;
    },
    
    // ==================== 渲染 ====================
    
    renderGroups() {
        const container = document.getElementById('uit2-groups-list');
        const countEl = document.getElementById('uit2-group-count');
        if (!container) return;
        
        if (countEl) countEl.textContent = `${this.testGroups.length} 组`;
        
        if (this.testGroups.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-muted)">暂无测试用例</div>';
            return;
        }
        
        container.innerHTML = this.testGroups.map(g => {
            const items = this.testItems[g.id] || [];
            const total = items.length;
            const passed = items.filter(i => this.testResults[i.key] === 'pass').length;
            const failed = items.filter(i => this.testResults[i.key] === 'fail').length;
            
            let statusClass = '';
            if (passed === total && total > 0) statusClass = 'all-pass';
            else if (failed > 0) statusClass = 'has-fail';
            
            return `
                <div class="uit-group-item ${statusClass} ${this.currentGroupId === g.id ? 'active' : ''}"
                     onclick="UITestIntegrated.selectGroup('${g.id}')">
                    <span class="name">${g.name}</span>
                    <span class="progress">${passed}/${total}</span>
                </div>
            `;
        }).join('');
    },
    
    selectGroup(groupId) {
        this.currentGroupId = groupId;
        this.renderGroups();
        this.renderItems();
    },
    
    renderItems() {
        const container = document.getElementById('uit2-items-list');
        const titleEl = document.getElementById('uit2-items-title');
        if (!container) return;
        
        const group = this.testGroups.find(g => g.id === this.currentGroupId);
        if (!group) {
            container.innerHTML = '<div style="text-align:center; padding:40px; color:var(--text-muted)">选择左侧分组查看测试项</div>';
            return;
        }
        
        if (titleEl) titleEl.textContent = group.name;
        
        const items = this.testItems[group.id] || [];
        if (items.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:40px; color:var(--text-muted)">该分组暂无测试项</div>';
            return;
        }
        
        container.innerHTML = items.map(item => {
            const result = this.testResults[item.key];
            let statusClass = '';
            if (result === 'pass') statusClass = 'passed';
            else if (result === 'fail') statusClass = 'failed';
            
            return `
                <div class="uit-test-item ${statusClass}" data-key="${item.key}">
                    <div class="item-content">
                        <div class="item-name">${item.key} - ${item.name}</div>
                        <div class="item-desc">${item.desc}</div>
                        ${item.autoSupport ? '<div class="item-result" style="color:var(--accent)">🤖 支持自动执行</div>' : ''}
                    </div>
                    <div class="uit-result-btns">
                        <button class="uit-result-btn pass ${result === 'pass' ? 'active' : ''}"
                                onclick="UITestIntegrated.setResult('${item.key}', 'pass')">通过</button>
                        <button class="uit-result-btn fail ${result === 'fail' ? 'active' : ''}"
                                onclick="UITestIntegrated.setResult('${item.key}', 'fail')">不通过</button>
                    </div>
                </div>
            `;
        }).join('');
    },

    // ==================== 结果操作 ====================
    
    setResult(itemKey, result) {
        const oldResult = this.testResults[itemKey];
        this.testResults[itemKey] = result;
        
        // 更新统计
        if (oldResult === 'pass') this.stats.passed--;
        if (oldResult === 'fail') this.stats.failed--;
        if (result === 'pass') this.stats.passed++;
        if (result === 'fail') this.stats.failed++;
        
        this.updateStats();
        this.renderGroups();
        this.renderItems();
        
        this.log(result === 'pass' ? 'pass' : 'fail', `[${itemKey}] ${result === 'pass' ? '通过' : '不通过'}`);
    },
    
    resetGroup() {
        if (!this.currentGroupId) return;
        
        const items = this.testItems[this.currentGroupId] || [];
        items.forEach(item => {
            if (this.testResults[item.key] === 'pass') this.stats.passed--;
            if (this.testResults[item.key] === 'fail') this.stats.failed--;
            this.testResults[item.key] = null;
        });
        
        this.updateStats();
        this.renderGroups();
        this.renderItems();
        this.log('info', `已重置分组: ${this.currentGroupId}`);
    },
    
    updateStats() {
        // 计算总数
        this.stats.total = Object.keys(this.testResults).length;
        
        // 更新进度条
        const done = this.stats.passed + this.stats.failed;
        const percent = this.stats.total > 0 ? (done / this.stats.total * 100) : 0;
        
        const fillEl = document.getElementById('uit2-progress-fill');
        const textEl = document.getElementById('uit2-progress-text');
        const passEl = document.getElementById('uit2-pass-count');
        const failEl = document.getElementById('uit2-fail-count');
        
        if (fillEl) fillEl.style.width = `${percent}%`;
        if (textEl) textEl.textContent = `${done} / ${this.stats.total}`;
        if (passEl) passEl.textContent = this.stats.passed;
        if (failEl) failEl.textContent = this.stats.failed;
    },
    
    // ==================== 自动执行 ====================
    
    async runAllAuto() {
        if (!this.checkSerial()) return;
        
        this.running = true;
        this.aborted = false;
        this.showRunningUI(true);
        this.log('info', '开始自动执行全部测试...');
        
        try {
            // 收集所有支持自动执行的用例
            const autoItems = [];
            this.testGroups.forEach(g => {
                (this.testItems[g.id] || []).forEach(item => {
                    if (item.autoSupport) {
                        autoItems.push(item);
                    }
                });
            });
            
            if (autoItems.length === 0) {
                this.log('info', '没有支持自动执行的测试用例');
                return;
            }
            
            this.log('info', `共 ${autoItems.length} 个用例支持自动执行`);
            
            // 调用后端执行
            const caseIds = autoItems.map(i => i.key);
            const result = await API.call('ui_test_run', caseIds);
            
            if (result && result.success) {
                // 轮询状态
                await this.pollTestStatus();
            } else {
                this.log('fail', '启动测试失败: ' + (result?.error || ''));
            }
        } catch (e) {
            this.log('fail', '执行失败: ' + e.message);
        } finally {
            this.running = false;
            this.showRunningUI(false);
        }
    },
    
    async runGroupAuto() {
        if (!this.currentGroupId) {
            Utils.toast('请先选择一个分组', 'warning');
            return;
        }
        if (!this.checkSerial()) return;
        
        this.running = true;
        this.aborted = false;
        this.showRunningUI(true);
        
        const items = this.testItems[this.currentGroupId] || [];
        const autoItems = items.filter(i => i.autoSupport);
        
        if (autoItems.length === 0) {
            this.log('info', '该分组没有支持自动执行的测试用例');
            this.running = false;
            this.showRunningUI(false);
            return;
        }
        
        this.log('info', `开始执行分组 [${this.currentGroupId}] 的 ${autoItems.length} 个用例...`);
        
        try {
            const caseIds = autoItems.map(i => i.key);
            const result = await API.call('ui_test_run', caseIds);
            
            if (result && result.success) {
                await this.pollTestStatus();
            } else {
                this.log('fail', '启动测试失败: ' + (result?.error || ''));
            }
        } catch (e) {
            this.log('fail', '执行失败: ' + e.message);
        } finally {
            this.running = false;
            this.showRunningUI(false);
        }
    },

    async pollTestStatus() {
        while (this.running && !this.aborted) {
            try {
                const result = await API.call('ui_test_get_status');
                if (result) {
                    // 更新结果
                    (result.cases || []).forEach(tc => {
                        if (tc.status === 'passed') {
                            this.setResultSilent(tc.id, 'pass');
                        } else if (tc.status === 'failed') {
                            this.setResultSilent(tc.id, 'fail');
                        }
                    });
                    
                    this.renderGroups();
                    this.renderItems();
                    this.updateStats();
                    
                    // 检查是否完成
                    if (!result.running) {
                        this.log('info', '测试执行完成');
                        break;
                    }
                }
            } catch (e) {
                console.error('轮询状态失败:', e);
            }
            
            await this.sleep(500);
        }
    },
    
    setResultSilent(itemKey, result) {
        const oldResult = this.testResults[itemKey];
        if (oldResult === result) return;
        
        this.testResults[itemKey] = result;
        
        if (oldResult === 'pass') this.stats.passed--;
        if (oldResult === 'fail') this.stats.failed--;
        if (result === 'pass') this.stats.passed++;
        if (result === 'fail') this.stats.failed++;
    },
    
    stopAuto() {
        this.aborted = true;
        API.call('ui_test_abort').catch(e => console.error(e));
        this.log('info', '正在停止测试...');
    },
    
    showRunningUI(running) {
        const btnRun = document.getElementById('uit2-btn-run');
        const btnStop = document.getElementById('uit2-btn-stop');
        if (btnRun) btnRun.style.display = running ? 'none' : '';
        if (btnStop) btnStop.style.display = running ? '' : 'none';
    },
    
    // ==================== 手动控制 ====================
    
    async sendCmd(cmd) {
        if (!this.checkSerial()) return;
        
        try {
            const result = await API.call('ui_test_send_cmd', cmd);
            if (result && result.success) {
                this.log('tx', `[${cmd}] ${result.hex || ''}`);
                setTimeout(() => this.refreshStatus(), 300);
            } else {
                this.log('fail', `发送失败: ${result?.error || ''}`);
            }
        } catch (e) {
            this.log('fail', `发送失败: ${e.message}`);
        }
    },
    
    async simOk() {
        if (!this.checkSerial()) return;
        
        const dist = parseInt(document.getElementById('uit2-sim-dist')?.value) || 5000;
        try {
            const result = await API.call('ui_test_send_cmd', 'sim_ok', {dist: dist, signal: 3});
            if (result && result.success) {
                this.log('tx', `[sim_ok] dist=${dist}mm`);
                setTimeout(() => this.refreshStatus(), 300);
            }
        } catch (e) {
            this.log('fail', `模拟失败: ${e.message}`);
        }
    },
    
    async simErr() {
        if (!this.checkSerial()) return;
        
        try {
            const result = await API.call('ui_test_send_cmd', 'sim_err', 1);
            if (result && result.success) {
                this.log('tx', '[sim_err] error=1');
                setTimeout(() => this.refreshStatus(), 300);
            }
        } catch (e) {
            this.log('fail', `模拟失败: ${e.message}`);
        }
    },
    
    async refreshStatus() {
        if (!window.DeviceHub || !DeviceHub.isSerialConnected()) return;
        
        try {
            const result = await API.call('ui_test_get_device_status');
            if (result && result.success && result.status) {
                this.updateDeviceStatusDisplay(result.status);
            }
        } catch (e) {
            console.error('获取状态失败:', e);
        }
    },
    
    updateDeviceStatusDisplay(status) {
        const stateNames = ['IDLE', 'LASER_ON', 'RESULT', 'ERROR', 'MENU'];
        const modeNames = ['单次', '面积', '体积', '勾股1', '勾股2', '勾股3', '连续'];
        const baseNames = ['前基准', '后基准'];
        const unitNames = ['m', 'ft', 'in'];
        
        const set = (id, val) => {
            const el = document.getElementById(id);
            if (el) el.textContent = val ?? '-';
        };
        
        set('ds2-state', stateNames[status.state] || status.state);
        set('ds2-mode', modeNames[status.mode] || status.mode);
        set('ds2-base', baseNames[status.base] || status.base);
        set('ds2-unit', unitNames[status.unit] || status.unit);
        set('ds2-laser', status.laser ? 'ON' : 'OFF');
        set('ds2-runstep', status.runstep);
        set('ds2-line4', status.line4?.toFixed(3));
    },

    // ==================== 工具方法 ====================
    
    checkSerial() {
        if (!window.DeviceHub || !DeviceHub.isSerialConnected()) {
            Utils.toast('请先连接串口', 'warning');
            return false;
        }
        return true;
    },
    
    updateSerialStatus() {
        const el = document.getElementById('uit2-serial-status');
        if (!el) return;
        const connected = window.DeviceHub && DeviceHub.isSerialConnected();
        el.textContent = connected ? '🟢 已连接' : '⚪ 未连接';
        el.className = 'serial-status' + (connected ? ' connected' : '');
    },
    
    updateDeviceModel() {
        const el = document.getElementById('uit2-device-model');
        if (!el) return;
        
        if (window.DeviceHub && DeviceHub.status?.serial?.info?.model_name) {
            el.textContent = DeviceHub.status.serial.info.model_name;
        } else if (window.DeviceHub && DeviceHub.status?.serial?.info?.model) {
            el.textContent = DeviceHub.status.serial.info.model;
        } else {
            el.textContent = '--';
        }
    },
    
    log(type, msg) {
        const container = document.getElementById('uit2-log');
        if (!container) return;
        
        const time = new Date().toLocaleTimeString();
        const div = document.createElement('div');
        div.className = `uit-log-item ${type}`;
        div.innerHTML = `<span class="uit-log-time">${time}</span>${msg}`;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    },
    
    clearLog() {
        const container = document.getElementById('uit2-log');
        if (container) container.innerHTML = '';
    },
    
    sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    },
    
    // ==================== 报告导出 ====================
    
    async exportReport() {
        const report = {
            time: new Date().toISOString(),
            device: document.getElementById('uit2-device-model')?.textContent || '--',
            stats: this.stats,
            results: {},
            screenshots: {}  // 截图数据
        };
        
        // 按分组整理结果
        this.testGroups.forEach(g => {
            report.results[g.name] = {};
            (this.testItems[g.id] || []).forEach(item => {
                report.results[g.name][item.key] = {
                    name: item.name,
                    result: this.testResults[item.key] || 'pending'
                };
            });
        });
        
        // 尝试获取LCD模拟器截图
        try {
            if (window.LcdSimulator && typeof LcdSimulator.captureScreenshot === 'function') {
                const screenshot = await LcdSimulator.captureScreenshot();
                if (screenshot) {
                    report.screenshots['lcd_current'] = screenshot;
                }
            }
        } catch (e) {
            console.warn('获取LCD截图失败:', e);
        }
        
        // 询问导出格式
        const format = await this.showFormatDialog();
        
        if (format === 'json') {
            // 下载JSON
            const blob = new Blob([JSON.stringify(report, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `ui_test_report_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
            Utils.toast('JSON报告已导出', 'success');
        } else if (format === 'doc') {
            // 调用后端生成DOC报告 - 使用HTTP API
            Utils.toast('正在生成DOC报告...', 'info');
            try {
                const deviceId = DeviceConfigManager?.getCurrentDevice?.() || 'gd303_mini';
                
                // 使用 HTTP API 调用
                const response = await fetch('http://localhost:8766/api/call', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        method: 'ui_test_export_doc_report',
                        params: [report, deviceId]
                    })
                });
                const result = await response.json();
                
                if (result && result.success) {
                    // 下载生成的DOC文件
                    const downloadResponse = await fetch('http://localhost:8766/api/call', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            method: 'ui_test_download_report',
                            params: [result.filename]
                        })
                    });
                    const downloadResult = await downloadResponse.json();
                    
                    if (downloadResult && downloadResult.success) {
                        // 将base64转为blob并下载
                        const byteCharacters = atob(downloadResult.data);
                        const byteNumbers = new Array(byteCharacters.length);
                        for (let i = 0; i < byteCharacters.length; i++) {
                            byteNumbers[i] = byteCharacters.charCodeAt(i);
                        }
                        const byteArray = new Uint8Array(byteNumbers);
                        const blob = new Blob([byteArray], {type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
                        
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = result.filename;
                        a.click();
                        URL.revokeObjectURL(url);
                        
                        Utils.toast('DOC报告已导出: ' + result.filename, 'success');
                    } else {
                        Utils.toast('下载报告失败: ' + (downloadResult?.error || ''), 'error');
                    }
                } else {
                    Utils.toast('生成报告失败: ' + (result?.error || ''), 'error');
                }
            } catch (e) {
                console.error('导出DOC报告失败:', e);
                Utils.toast('导出失败: ' + e.message, 'error');
            }
        }
    },
    
    // 显示格式选择对话框
    showFormatDialog() {
        return new Promise((resolve) => {
            // 创建简单的选择对话框
            const dialog = document.createElement('div');
            dialog.style.cssText = `
                position: fixed; top: 0; left: 0; right: 0; bottom: 0;
                background: rgba(0,0,0,0.5); display: flex;
                align-items: center; justify-content: center; z-index: 10000;
            `;
            dialog.innerHTML = `
                <div style="background: var(--card-bg, #1e1e1e); padding: 24px; border-radius: 12px; min-width: 300px;">
                    <h3 style="margin: 0 0 16px; color: var(--text-color, #fff);">选择导出格式</h3>
                    <div style="display: flex; gap: 12px; justify-content: center;">
                        <button id="export-json-btn" style="padding: 12px 24px; border-radius: 6px; border: 1px solid var(--border-color, #333); background: var(--input-bg, #2d2d2d); color: var(--text-color, #fff); cursor: pointer;">
                            📄 JSON
                        </button>
                        <button id="export-doc-btn" style="padding: 12px 24px; border-radius: 6px; border: 1px solid var(--accent, #00ff88); background: var(--accent, #00ff88); color: #000; cursor: pointer; font-weight: 600;">
                            📝 DOC (推荐)
                        </button>
                    </div>
                    <button id="export-cancel-btn" style="margin-top: 16px; width: 100%; padding: 8px; border-radius: 4px; border: 1px solid var(--border-color, #333); background: transparent; color: var(--text-muted, #888); cursor: pointer;">
                        取消
                    </button>
                </div>
            `;
            document.body.appendChild(dialog);
            
            dialog.querySelector('#export-json-btn').onclick = () => {
                document.body.removeChild(dialog);
                resolve('json');
            };
            dialog.querySelector('#export-doc-btn').onclick = () => {
                document.body.removeChild(dialog);
                resolve('doc');
            };
            dialog.querySelector('#export-cancel-btn').onclick = () => {
                document.body.removeChild(dialog);
                resolve(null);
            };
            dialog.onclick = (e) => {
                if (e.target === dialog) {
                    document.body.removeChild(dialog);
                    resolve(null);
                }
            };
        });
    }
};

window.UITestIntegrated = UITestIntegrated;
</script>
