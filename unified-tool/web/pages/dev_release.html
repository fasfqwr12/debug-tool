<div class="page-container">
    <div class="page-header">
        <h1>🚀 版本发布</h1>
        <button class="help-btn" onclick="switchPage('help_dev')" title="使用说明">❓</button>
    </div>

    <div class="release-layout">
        <!-- 左侧：工程选择 + 版本列表 -->
        <div class="panel left-panel">
            <div class="panel-header">
                <span>选择工程</span>
            </div>
            <div class="project-select">
                <select id="project-select" onchange="DevReleasePage.selectProject(this.value)">
                    <option value="">-- 选择工程 --</option>
                </select>
            </div>
            
            <div class="panel-header" style="margin-top:16px">
                <span>版本列表</span>
                <span class="badge" id="version-count">0</span>
            </div>
            <div class="version-list" id="version-list">
                <div class="empty-hint">选择工程查看版本</div>
            </div>
        </div>

        <!-- 中间：创建版本 -->
        <div class="panel center-panel">
            <div class="panel-header">
                <span>📦 创建新版本</span>
            </div>
            
            <div class="create-form" id="create-form">
                <div class="form-group">
                    <label>版本号 *</label>
                    <input type="text" id="new-version" placeholder="如 1.0.0">
                </div>
                
                <div class="form-group">
                    <label>HEX/BIN 文件 *</label>
                    <div class="file-input">
                        <input type="text" id="new-hex-file" placeholder="选择固件文件" readonly>
                        <button class="browse-btn" onclick="DevReleasePage.selectHexFile()">浏览</button>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>发布说明</label>
                    <textarea id="new-release-note" rows="4" placeholder="本版本更新内容..."></textarea>
                </div>
                
                <div class="git-info-box" id="git-info-box">
                    <div class="info-row">
                        <span class="label">当前分支</span>
                        <span id="current-branch">--</span>
                    </div>
                    <div class="info-row">
                        <span class="label">最新提交</span>
                        <span id="current-commit">--</span>
                    </div>
                </div>
                
                <button class="create-btn" onclick="DevReleasePage.createVersion()">
                    📦 创建版本
                </button>
            </div>
        </div>

        <!-- 右侧：版本详情 + 操作 -->
        <div class="panel right-panel">
            <div class="panel-header">
                <span>版本详情</span>
            </div>
            
            <div class="version-detail" id="version-detail">
                <div class="empty-hint">选择版本查看详情</div>
            </div>
            
            <!-- 共享文件操作按钮 -->
            <div class="share-actions" id="share-actions" style="display:none; padding: 12px; border-top: 1px solid var(--border-color);">
                <div class="share-title" style="font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--text-color);">
                    📤 测试共享文件
                </div>
                <div style="display: flex; gap: 8px;">
                    <button class="share-btn" onclick="DevReleasePage.createShareFile()" title="生成包含版本信息的共享文件">
                        📦 生成共享文件
                    </button>
                    <button class="share-btn" onclick="DevReleasePage.openShareFile()" title="打开已有的共享文件进行更新">
                        📂 打开共享文件
                    </button>
                    <button class="share-btn" onclick="DevReleasePage.updateShareFile()" title="更新当前打开的共享文件" disabled id="btn-update-share">
                        🔄 更新并保存
                    </button>
                </div>
                
                <!-- 任务分配区域 -->
                <div id="assignment-section" style="margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border-color); display:none;">
                    <div style="font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--text-color);">
                        📋 任务分配
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px;">
                        <select id="assign-tester-select" style="padding: 6px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-color);">
                            <option value="">选择测试人员</option>
                        </select>
                        <input type="date" id="assign-due-date" style="padding: 6px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-color);">
                    </div>
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <select id="assign-priority" style="padding: 6px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-color);">
                            <option value="low">低优先级</option>
                            <option value="medium" selected>中优先级</option>
                            <option value="high">高优先级</option>
                        </select>
                        <button class="share-btn primary" onclick="DevReleasePage.assignTask()" style="flex: 1;">
                            分配任务
                        </button>
                    </div>
                </div>
                
                <div id="share-status" style="margin-top: 8px; font-size: 12px; color: var(--text-secondary);"></div>
            </div>
        </div>
    </div>
</div>

<style>
.release-layout {
    display: grid;
    grid-template-columns: 280px 1fr 320px;
    gap: 16px;
    height: calc(100vh - 140px);
}

.panel {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
}

.center-panel {
    overflow-y: auto;
}

.panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    background: var(--input-bg);
    border-bottom: 1px solid var(--border-color);
    font-weight: 600;
    font-size: 13px;
}

.badge {
    background: var(--primary-color); color: var(--text-on-accent);
    padding: 2px 8px; border-radius: 10px; font-size: 11px;
}

/* 工程选择 */
.project-select { padding: 12px 16px; }
.project-select select {
    width: 100%; padding: 10px;
    background: var(--input-bg); border: 1px solid var(--border-color);
    border-radius: 6px; color: var(--text-color); font-size: 13px;
}

/* 版本列表 */
.version-list { flex: 1; overflow-y: auto; padding: 8px; }

.version-card {
    padding: 12px; border-radius: 8px;
    background: var(--input-bg); margin-bottom: 8px;
    cursor: pointer; border-left: 3px solid transparent;
    transition: all 0.2s;
}
.version-card:hover { border-left-color: var(--border-color); }
.version-card.active { border-left-color: var(--primary-color); background: rgba(0,255,157,0.1); }

.version-card .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.version-card .ver { font-size: 15px; font-weight: 600; }
.version-card .stage {
    padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: 500;
}
.version-card .stage.dev { background: #6366f1; color: var(--text-on-danger); }
.version-card .stage.submitted { background: #f59e0b; color: var(--text-on-accent); }
.version-card .stage.testing { background: #3b82f6; color: var(--text-on-danger); }
.version-card .stage.passed { background: #22c55e; color: var(--text-on-accent); }
.version-card .stage.rejected { background: #ef4444; color: var(--text-on-danger); }
.version-card .stage.released { background: var(--primary-color); color: var(--text-on-accent); }

.version-card .meta { font-size: 11px; color: var(--text-muted); }

/* 创建表单 */
.create-form { padding: 16px; }

.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
.form-group input, .form-group textarea {
    width: 100%; padding: 10px;
    background: var(--input-bg); border: 1px solid var(--border-color);
    border-radius: 6px; color: var(--text-color); font-size: 13px;
}
.form-group textarea { resize: none; }

.file-input { display: flex; gap: 8px; }
.file-input input { flex: 1; }
.browse-btn {
    padding: 10px 16px; background: var(--input-bg);
    border: 1px solid var(--border-color); border-radius: 6px;
    color: var(--text-color); cursor: pointer; font-size: 12px;
}
.browse-btn:hover { border-color: var(--primary-color); }

.git-info-box {
    padding: 12px; background: var(--input-bg);
    border-radius: 8px; margin-bottom: 16px;
}
.git-info-box .info-row {
    display: flex; justify-content: space-between;
    font-size: 12px; margin-bottom: 6px;
}
.git-info-box .info-row:last-child { margin-bottom: 0; }
.git-info-box .label { color: var(--text-muted); }

.create-btn {
    width: 100%; padding: 12px;
    background: var(--primary-color); border: none;
    border-radius: 8px; color: var(--text-on-accent); font-size: 14px;
    font-weight: 600; cursor: pointer;
}
.create-btn:hover { opacity: 0.9; }

/* 版本详情 */
.version-detail { flex: 1; overflow-y: auto; padding: 16px; }

.detail-section { margin-bottom: 20px; }
.detail-section .title {
    font-size: 12px; color: var(--text-muted);
    margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
}
.detail-section .content {
    padding: 12px; background: var(--input-bg);
    border-radius: 8px; font-size: 13px;
}

.detail-row { display: flex; justify-content: space-between; margin-bottom: 8px; }
.detail-row:last-child { margin-bottom: 0; }
.detail-row .label { color: var(--text-muted); font-size: 12px; }
.detail-row .value { font-size: 12px; }

.action-btn {
    width: 100%; padding: 10px; margin-top: 12px;
    border-radius: 6px; font-size: 13px; cursor: pointer;
    border: 1px solid var(--border-color); background: var(--input-bg);
    color: var(--text-color);
}
.action-btn:hover { border-color: var(--primary-color); }
.action-btn.primary { background: var(--primary-color); color: var(--text-on-accent); border: none; }
.action-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* 共享文件按钮 */
.share-btn {
    flex: 1; padding: 8px 12px;
    background: var(--input-bg); border: 1px solid var(--border-color);
    border-radius: 6px; color: var(--text-color); font-size: 12px;
    cursor: pointer; transition: all 0.2s;
}
.share-btn:hover { 
    border-color: var(--primary-color); 
    background: var(--hover-bg);
}
.share-btn:disabled { 
    opacity: 0.5; cursor: not-allowed; 
}
.share-btn.primary { 
    background: var(--primary-color); 
    color: var(--text-on-accent); 
    border: none; 
}

/* 通用 */
.empty-hint { color: var(--text-muted); text-align: center; padding: 40px; font-size: 13px; }

.page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.page-header h1 { margin: 0; font-size: 22px; }
.help-btn {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--input-bg); border: 1px solid var(--border-color);
    color: var(--text-muted); cursor: pointer; font-size: 14px;
}
.help-btn:hover { border-color: var(--primary-color); color: var(--primary-color); }
</style>
