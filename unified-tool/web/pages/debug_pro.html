        if (ext !== '.bin' && ext !== '.hex' && ext !== '.enc') {
            this.showToast('warning', '格式不支持', '请选择 .bin、.hex 或 .enc 格式的固件文件', 3000);
            return;
        }
        
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                let firmware;
                let isEncrypted = false;
                
                if (ext === '.enc') {
                    // 加密固件文件
                    const encData = new Uint8Array(e.target.result);
                    const parsed = this.parseEncFile(encData);
                    if (!parsed) {
                        throw new Error('加密固件格式错误');
                    }
                    firmware = parsed.data;
                    isEncrypted = true;
                    this.upgrade.encHeader = parsed.header;
                    this.log('SYS', `[升级] 加密固件: 起始=0x${parsed.header.startAddr.toString(16)}, 原始CRC=0x${parsed.header.originalCrc.toString(16).toUpperCase()}`);
                } else if (ext === '.hex') {
                    firmware = this.parseIntelHex(e.target.result);
                } else {
                    firmware = new Uint8Array(e.target.result);
                }
                
                if (!firmware || firmware.length === 0) {
                    throw new Error('固件文件为空');
                }
                
                this.upgrade.firmware = firmware;
                this.upgrade.isEncrypted = isEncrypted;
                
                // 更新UI
                document.getElementById('dp-fw-select-zone').style.display = 'none';
                document.getElementById('dp-fw-info').style.display = 'flex';
                document.getElementById('dp-fw-filename').textContent = file.name + (isEncrypted ? ' 🔒' : '');
                document.getElementById('dp-fw-size').textContent = (firmware.length / 1024).toFixed(1) + ' KB';
                document.getElementById('dp-fw-time').textContent = new Date(file.lastModified).toLocaleString('zh-CN');
                
                // 计算固件大小和 CRC32
                let fwCrc, fwCrcStr;
                if (isEncrypted) {
                    // 加密固件使用头部中的原始CRC
                    fwCrc = this.upgrade.encHeader.originalCrc;
                    fwCrcStr = '0x' + fwCrc.toString(16).toUpperCase().padStart(8, '0') + ' (原始)';
                } else {
                    fwCrc = this.calcFirmwareCrc(firmware);
                    fwCrcStr = '0x' + fwCrc.toString(16).toUpperCase().padStart(8, '0');
                }
                document.getElementById('dp-fw-size').textContent = (firmware.length / 1024).toFixed(1) + ' KB';
                document.getElementById('dp-fw-crc').textContent = fwCrcStr;
                
                // 尝试读取固件元数据（加密固件无法读取）
                if (!isEncrypted) {
                    const meta = this.readFirmwareMeta(firmware);
                    if (meta) {
                        this.upgrade.firmwareMeta = meta;
                        document.getElementById('dp-fw-model').textContent = meta.modelName || 'Unknown';
                        document.getElementById('dp-fw-version').textContent = meta.versionStr || '--';
                    } else {
                        document.getElementById('dp-fw-model').textContent = file.name.replace(/\.[^.]+$/, '');
                        document.getElementById('dp-fw-version').textContent = '--';
                    }
                } else {
                    // 加密固件：从 V2 头部读取版本信息
                    const encHeader = this.upgrade.encHeader;
                    if (encHeader.version === 2 && encHeader.versionStr) {
                        document.getElementById('dp-fw-model').textContent = encHeader.modelName || '加密固件';
                        document.getElementById('dp-fw-version').textContent = encHeader.versionStr;
                        if (encHeader.buildTimeStr) {
                            document.getElementById('dp-fw-time').textContent = encHeader.buildTimeStr;
                        }
                    } else {
                        document.getElementById('dp-fw-model').textContent = '加密固件 (V1)';
                        document.getElementById('dp-fw-version').textContent = '--';
                    }
                }
                
                // 启用升级按钮
                if (this.upgrade.ready) {
                    document.getElementById('dp-btn-upgrade').disabled = false;
                }
                
                this.log('SYS', `[升级] 已选择固件: ${file.name} (${(firmware.length / 1024).toFixed(1)} KB)${isEncrypted ? ' [加密]' : ''}`);

                
            } catch (err) {
                this.showToast('error', '固件解析失败', err.message, 5000);
                this.log('ERR', `[升级] 固件解析失败: ${err.message}`);
            }
        };
        
        if (ext === '.hex') {
            reader.readAsText(file);
        } else {
            reader.readAsArrayBuffer(file);
        }
    },
    
    readFirmwareMeta(firmware) {
        // 元数据结构 (64字节，位于固件偏移0x200处):
        // 0x00: magic (4字节) - "FIRM" = 0x4649524D
        // 0x04: version (4字节) - Major<<24 | Minor<<16 | Patch<<8 | Build
        // 0x08: hw_version (4字节)
        // 0x0C: build_time (4字节) - Unix时间戳
        // 0x10: model_name (16字节)
        // 0x20: app_size (4字节) - 由 post_build.py 填充
        // 0x24: app_crc (4字节) - 由 post_build.py 填充
        
        const META_OFFSET = 0x200;
        const META_MAGIC = 0x4649524D; // "FIRM"
        
        if (firmware.length < META_OFFSET + 64) {
            console.log('[FW Meta] 固件太小，无法包含元数据');
            return null;
        }
        
        const view = new DataView(firmware.buffer, firmware.byteOffset + META_OFFSET, 64);
        const magic = view.getUint32(0, true);
        
        console.log(`[FW Meta] Magic: 0x${magic.toString(16).toUpperCase()}, 期望: 0x${META_MAGIC.toString(16).toUpperCase()}`);
        
        if (magic !== META_MAGIC) {
            console.log('[FW Meta] Magic不匹配，无元数据');
            return null;
        }
        
        const version = view.getUint32(4, true);
        const hwVersion = view.getUint32(8, true);
        const buildTime = view.getUint32(12, true);
        
        // 读取型号名称 (从偏移16开始，16字节)
        let modelName = '';
        for (let i = 0; i < 16; i++) {
            const ch = firmware[META_OFFSET + 16 + i];
            if (ch === 0) break;
            modelName += String.fromCharCode(ch);
        }
        
        // 读取 app_size 和 app_crc (由 post_build.py 填充)
        const appSize = view.getUint32(0x20, true);
        const appCrc = view.getUint32(0x24, true);
        
        const versionStr = `V${(version >> 24) & 0xFF}.${(version >> 16) & 0xFF}.${(version >> 8) & 0xFF}`;
        
        console.log(`[FW Meta] 版本: ${versionStr}, 型号: ${modelName}`);
        console.log(`[FW Meta] app_size: ${appSize} (${(appSize/1024).toFixed(1)}KB), app_crc: 0x${appCrc.toString(16).toUpperCase()}`);
        
        return {
            magic,
            version,
            hwVersion,
            buildTime,
            modelName: modelName || 'Unknown',
            appSize,
            appCrc,
            versionStr,
            hwVersionStr: `${(hwVersion >> 8) & 0xFF}.${hwVersion & 0xFF}`,
            buildTimeStr: buildTime > 0 ? new Date(buildTime * 1000).toLocaleString('zh-CN') : '--',
            appCrcStr: appCrc !== 0xFFFFFFFF ? `0x${appCrc.toString(16).toUpperCase()}` : '未填充'
        };
    },
    
    parseIntelHex(hexContent) {
        const lines = hexContent.split(/\r?\n/).filter(l => l.startsWith(':'));
        let extAddr = 0;
        let minAddr = Infinity, maxAddr = 0;
        const dataMap = new Map();
        
        for (const line of lines) {
            const byteCount = parseInt(line.substr(1, 2), 16);
            const address = parseInt(line.substr(3, 4), 16);
            const recordType = parseInt(line.substr(7, 2), 16);
            const data = line.substr(9, byteCount * 2);
            
            if (recordType === 0x00) {
                const fullAddr = extAddr + address;
                for (let i = 0; i < byteCount; i++) {
                    const byte = parseInt(data.substr(i * 2, 2), 16);
                    dataMap.set(fullAddr + i, byte);
                    minAddr = Math.min(minAddr, fullAddr + i);
                    maxAddr = Math.max(maxAddr, fullAddr + i);
                }
            } else if (recordType === 0x04) {
                extAddr = parseInt(data, 16) << 16;
            }
        }
        
        if (dataMap.size === 0) return null;
        
        // 转换为连续数组
        const size = maxAddr - minAddr + 1;
        const result = new Uint8Array(size);
        result.fill(0xFF);
        for (const [addr, byte] of dataMap) {
            result[addr - minAddr] = byte;
        }
        
        return result;
    },
    
    /**
     * 解析加密固件文件 (.enc)
     * 格式:
     * [0:4]   魔数 "GENC"
     * [4:5]   版本号
     * [5:6]   保留
     * [6:8]   保留
     * [8:12]  起始地址 (小端)
     * [12:16] 数据长度 (小端)
     * [16:20] 原始CRC32 (小端)
     * [20:24] 加密后CRC32 (小端)
     * V2扩展 (48字节头):
     * [24:28] 固件版本 (Major<<24 | Minor<<16 | Patch<<8 | Build)
     * [28:44] 型号名称 (16字节)
     * [44:48] 编译时间 (Unix时间戳)
     * [头部后...]加密数据
     */
    parseEncFile(data) {
        if (!data || data.length < 24) {
            console.error('[ENC] 文件太小');
            return null;
        }
        
        // 检查魔数 "GENC"
        if (data[0] !== 0x47 || data[1] !== 0x45 || data[2] !== 0x4E || data[3] !== 0x43) {
            console.error('[ENC] 魔数不匹配:', data.slice(0, 4));
            return null;
        }
        
        const version = data[4];
        if (version !== 1 && version !== 2) {
            console.error('[ENC] 不支持的版本:', version);
            return null;
        }
        
        // V2 需要 48 字节头
        const headerSize = (version === 2) ? 48 : 24;
        if (data.length < headerSize) {
            console.error('[ENC] 文件太小，无法包含完整头部');
            return null;
        }
        
        // 解析头部 (小端序)
        const startAddr = data[8] | (data[9] << 8) | (data[10] << 16) | (data[11] << 24);
        const dataLen = data[12] | (data[13] << 8) | (data[14] << 16) | (data[15] << 24);
        const originalCrc = (data[16] | (data[17] << 8) | (data[18] << 16) | (data[19] << 24)) >>> 0;
        const encryptedCrc = (data[20] | (data[21] << 8) | (data[22] << 16) | (data[23] << 24)) >>> 0;
        
        // V2 扩展字段
        let fwVersion = 0, modelName = '', buildTime = 0;
        if (version === 2) {
            fwVersion = data[24] | (data[25] << 8) | (data[26] << 16) | (data[27] << 24);
            // 读取型号名称 (16字节, null-terminated)
            for (let i = 0; i < 16; i++) {
                const ch = data[28 + i];
                if (ch === 0) break;
                modelName += String.fromCharCode(ch);
            }
            buildTime = data[44] | (data[45] << 8) | (data[46] << 16) | (data[47] << 24);
        }
        
        console.log(`[ENC] V${version} 起始地址: 0x${startAddr.toString(16)}, 数据长度: ${dataLen}`);
        if (version === 2 && fwVersion) {
            const vStr = `V${(fwVersion >> 24) & 0xFF}.${(fwVersion >> 16) & 0xFF}.${(fwVersion >> 8) & 0xFF}`;
            console.log(`[ENC] 固件版本: ${vStr}, 型号: ${modelName}`);
        }
        
        // 基本校验
        if (dataLen === 0 || dataLen > 256 * 1024) {
            console.error('[ENC] 数据长度无效:', dataLen);
            return null;
        }
        
        if (data.length < headerSize + dataLen) {
            console.error('[ENC] 文件不完整:', data.length, '期望:', headerSize + dataLen);
            return null;
        }
        
        // 提取加密数据
        const encryptedData = data.slice(headerSize, headerSize + dataLen);
        
        // 验证加密数据 CRC
        const calcEncCrc = this.crc32(encryptedData);
        if (calcEncCrc !== encryptedCrc) {
            console.warn(`[ENC] 加密数据CRC不匹配: 计算=0x${calcEncCrc.toString(16)}, 期望=0x${encryptedCrc.toString(16)}`);
            // 不阻止，只是警告
        }
        
        return {
            header: {
                version,
                startAddr,
                dataLen,
                originalCrc,
                encryptedCrc,
                // V2 扩展
                fwVersion,
                modelName,
                buildTime,
                // 格式化的版本字符串
                versionStr: fwVersion ? `V${(fwVersion >> 24) & 0xFF}.${(fwVersion >> 16) & 0xFF}.${(fwVersion >> 8) & 0xFF}` : null,
                buildTimeStr: buildTime > 0 ? new Date(buildTime * 1000).toLocaleString('zh-CN') : null
            },
            data: encryptedData  // 返回加密数据，由 Bootloader 解密
        };
    },
    
    async startUpgrade() {
        if (!this.upgrade.firmware || !this.upgrade.ready) {
            this.showToast('warning', '请先选择固件文件', '', 3000);
            return;
        }
        
        const firmware = this.upgrade.firmware;
        const info = this.upgrade.deviceInfo;
        
        // 记录升级开始时间
        const upgradeStartTime = Date.now();
        
        // 检查固件大小
        if (info && info.appMaxSize && firmware.length > info.appMaxSize) {
            this.showToast('error', '固件太大', `固件: ${(firmware.length / 1024).toFixed(1)} KB，最大: ${(info.appMaxSize / 1024).toFixed(1)} KB`, 5000);
            return;
        }
        
        document.getElementById('dp-btn-upgrade').disabled = true;
        
        try {
            // 修复：旧固件可能返回错误的 appStart (0x08000000)，强制使用 USB Boot 地址
            let appStart = info?.appStart || 0x08004000;
            if (appStart === 0x08000000) {
                this.log('SYS', '[升级] 检测到旧固件返回错误的 appStart，强制使用 0x08004000');
                appStart = 0x08004000;  // USB Boot 模式的正确地址
            }
            const appMaxSize = info?.appMaxSize || (108 * 1024);
            
            // 保存开始时间到 upgrade 对象
            this.upgrade.startTime = upgradeStartTime;
            
            // 如果在 App 模式，先进入升级模式
            if (info && info.deviceMode === 'app') {
                this.log('SYS', '[升级] 进入升级模式...');
                this.updateUpgradeProgress(5, '进入升级模式...', '正在切换到Bootloader...');
                
                // 记住当前串口号（重连时使用同一个串口号）
                const api = window.pywebview?.api || window.parent?.pywebview?.api;
                let originalPort = null;
                if (api && api.debug_get_status) {
                    const status = await api.debug_get_status();
                    if (status && status.name) {
                        // 从 "串口 (COM92 @ 115200)" 提取 COM92
                        const match = status.name.match(/COM\d+/i);
                        if (match) originalPort = match[0];
                    }
                }
                
                if (!originalPort) {
                    throw new Error('无法获取当前串口号');
                }
                this.log('SYS', `[升级] 当前串口: ${originalPort}`);
                
                // 发送进入升级模式命令（不等待响应，因为设备会立即重启）
                try {
                    await this.sendUpgradeCmd(this.upgrade.CMD_ENTER_UPGRADE, [], 500);
                } catch (e) {
                    // 忽略超时错误，设备重启后 USB 会断开
                }
                this.log('SYS', '[升级] 命令已发送，设备将重启...');
                
                // USB 会断开重连，等待 200ms 后开始重连
                this.log('SYS', '[升级] 等待USB重新枚举...');
                this.updateUpgradeProgress(8, '等待重连...', 'USB设备正在重新枚举...');
                await this.sleep(200);
                
                // 用同一个串口号重连
                // 每 50ms 尝试一次，最多 40 次（2秒）
                let bootConnected = false;
                const maxRetries = 40;
                const retryInterval = 50;
                
                for (let retry = 0; retry < maxRetries; retry++) {
                    this.updateUpgradeProgress(10 + Math.floor(retry / 3), '重连中...', `尝试 ${retry + 1}/${maxRetries}...`);
                    
                    try {
                        if (api) {
                            // 用同一个串口号重连（不扫描其他串口）
                            const connectResult = await api.debug_connect_serial(originalPort, 115200);
                            if (connectResult && connectResult.success) {
                                await this.activateDataReceiver();
                                
                                // 握手确认是 Bootloader
                                const resp = await this.sendUpgradeCmd(this.upgrade.CMD_HANDSHAKE, [0x12, 0x34, 0x56, 0x78], 1000);
                                if (resp && resp.success) {
                                    const payload = resp.payload || [];
                                    if (payload.length >= 4) {
                                        const magic = ((payload[0] << 24) | (payload[1] << 16) | (payload[2] << 8) | payload[3]) >>> 0;
                                        if (magic === this.upgrade.RESP_MAGIC_BOOT) {
                                            bootConnected = true;
                                            this.log('SYS', `[升级] ✓ 已连接到 Bootloader (${originalPort})`);
                                            this.isConnected = true;
                                            this.setStatus('connected', 'serial');
                                            break;
                                        } else if (magic === this.upgrade.RESP_MAGIC_APP) {
                                            // 还在 App 模式，继续等待
                                            this.log('SYS', `[升级] 设备仍在App模式，继续等待...`);
                                        }
                                    }
                                }
                            }
                        }
                    } catch (e) {
                        // 连接失败，继续重试
                    }
                    
                    if (bootConnected) break;
                    await this.sleep(retryInterval);
                }
                
                if (!bootConnected) {
                    throw new Error(`无法连接Bootloader (${originalPort})，请检查USB连接`);
                }
            }
            
            // 擦除 Flash
            this.upgrade.state = 'erase';
            this.updateUpgradeProgress(15, '擦除中...', `正在擦除Flash (0x${appStart.toString(16)}, ${(appMaxSize/1024).toFixed(0)}KB)...`);
            this.log('SYS', `[升级] 擦除Flash (0x${appStart.toString(16)}, ${(appMaxSize/1024).toFixed(0)}KB)...`);
            
            // 擦除数据: [addr_h, addr_hh, addr_hhh, addr_hhhh, size_h, size_hh, size_hhh, size_hhhh, encrypted_flag] (大端序)
            const eraseData = [
                (appStart >> 24) & 0xFF, (appStart >> 16) & 0xFF, (appStart >> 8) & 0xFF, appStart & 0xFF,
                (appMaxSize >> 24) & 0xFF, (appMaxSize >> 16) & 0xFF, (appMaxSize >> 8) & 0xFF, appMaxSize & 0xFF,
                this.upgrade.isEncrypted ? 0x01 : 0x00  // 第9字节：加密标志
            ];
            
            const eraseResp = await this.sendUpgradeCmd(this.upgrade.CMD_ERASE, eraseData, 30000);
            if (!eraseResp || !eraseResp.success) {
                throw new Error('擦除失败');
            }
            this.log('SYS', '[升级] ✓ 擦除完成');
            
            // 写入固件
            this.upgrade.state = 'write';
            const chunkSize = this.upgrade.CHUNK_SIZE;
            const totalChunks = Math.ceil(firmware.length / chunkSize);
            const startTime = Date.now();
            
            this.log('SYS', `[升级] 开始写入 ${(firmware.length / 1024).toFixed(1)} KB (${totalChunks} 包)...`);
            
            const api = window.pywebview?.api || window.parent?.pywebview?.api;
            
            // 暂停串口读取线程（避免竞争）
            if (api && api.upgrade_start) {
                await api.upgrade_start();
            }
            
            try {
            // 使用批量写入 API（后端一次性完成所有写入，减少JS-Python通信开销）
            if (api && api.upgrade_write_batch) {
                const firmwareHex = Array.from(firmware).map(b => b.toString(16).padStart(2, '0')).join('');
                
                // 启动进度更新定时器
                const progressInterval = setInterval(() => {
                    const elapsed = (Date.now() - startTime) / 1000;
                    this.updateUpgradeProgress(50, '写入中...', `已耗时 ${elapsed.toFixed(1)}s...`);
                }, 200);
                
                const writeResult = await api.upgrade_write_batch(firmwareHex, appStart, chunkSize);
                
                clearInterval(progressInterval);
                
                if (!writeResult || !writeResult.success) {
                    throw new Error(writeResult?.error || '批量写入失败');
                }
                
                const elapsed = writeResult.time || ((Date.now() - startTime) / 1000);
                const speed = writeResult.speed || (firmware.length / 1024 / Math.max(0.1, elapsed));
                this.log('SYS', `[升级] ✓ 写入完成 (${elapsed.toFixed(1)}s, ${speed.toFixed(1)} KB/s)`);
                this.updateUpgradeProgress(80, '写入完成', `${speed.toFixed(1)} KB/s`);
            } else {
                // 回退：逐包写入
                let lastProgressUpdate = 0;
                let consecutiveErrors = 0;
                const maxConsecutiveErrors = 3;
                
                for (let i = 0; i < totalChunks; i++) {
                    const offset = i * chunkSize;
                    const addr = appStart + offset;
                    const chunk = firmware.slice(offset, offset + chunkSize);
                    
                    let writeResp;
                    if (api && api.upgrade_write_chunk) {
                        const chunkHex = Array.from(chunk).map(b => b.toString(16).padStart(2, '0')).join('');
                        writeResp = await api.upgrade_write_chunk(addr, chunkHex, 2);
                    } else {
                        const writeData = [
                            (addr >> 24) & 0xFF, (addr >> 16) & 0xFF, (addr >> 8) & 0xFF, addr & 0xFF,
                            ...chunk
                        ];
                        writeResp = await this.sendUpgradeCmd(this.upgrade.CMD_WRITE, writeData, 3000);
                    }
                    
                    if (!writeResp || !writeResp.success) {
                        consecutiveErrors++;
                        if (consecutiveErrors >= maxConsecutiveErrors) {
                            throw new Error(`写入失败 @ 0x${addr.toString(16)}`);
                        }
                        await this.sleep(100);
                        i--;
                        continue;
                    }
                    
                    consecutiveErrors = 0;
                    
                    const now = Date.now();
                    if (now - lastProgressUpdate > 200 || i === totalChunks - 1) {
                        lastProgressUpdate = now;
                        const progress = 20 + Math.floor((i + 1) / totalChunks * 60);
                        const elapsed = (now - startTime) / 1000;
                        const speed = (offset + chunk.length) / 1024 / Math.max(0.1, elapsed);
                        this.updateUpgradeProgress(progress, '写入中...', `${i + 1}/${totalChunks} 包 (${speed.toFixed(1)} KB/s)`);
                    }
                }
                
                const elapsed = (Date.now() - startTime) / 1000;
                const avgSpeed = (firmware.length / 1024 / Math.max(0.1, elapsed)).toFixed(1);
                this.log('SYS', `[升级] ✓ 写入完成 (${elapsed.toFixed(1)}s, ${avgSpeed} KB/s)`);
            }
            
            } finally {
                // 恢复串口读取线程
                if (api && api.upgrade_end) {
                    await api.upgrade_end();
                }
            }
            
            // 校验固件
            this.upgrade.state = 'verify';
            this.updateUpgradeProgress(85, '校验中...', '正在校验固件CRC...');
            this.log('SYS', '[升级] 校验固件...');
            
            // 计算 CRC32
            // 加密固件：使用头部中的原始CRC（解密后的数据CRC）
            // 普通固件：直接计算固件数据CRC
            const actualSize = firmware.length;
            let crc;
            if (this.upgrade.isEncrypted && this.upgrade.encHeader) {
                crc = this.upgrade.encHeader.originalCrc;
                this.log('SYS', `[升级] 使用加密固件原始CRC: 0x${crc.toString(16).toUpperCase()}`);
            } else {
                crc = this.crc32(firmware);
            }
            this.log('SYS', `[升级] 固件大小: ${actualSize}, CRC32: 0x${crc.toString(16).toUpperCase()}`);
            
            // 校验数据: [addr_h, addr_hh, addr_hhh, addr_hhhh, size_h, size_hh, size_hhh, size_hhhh, crc_h, crc_hh, crc_hhh, crc_hhhh] (大端序)
            const verifyData = [
                (appStart >> 24) & 0xFF, (appStart >> 16) & 0xFF, (appStart >> 8) & 0xFF, appStart & 0xFF,
                (actualSize >> 24) & 0xFF, (actualSize >> 16) & 0xFF, (actualSize >> 8) & 0xFF, actualSize & 0xFF,
                (crc >> 24) & 0xFF, (crc >> 16) & 0xFF, (crc >> 8) & 0xFF, crc & 0xFF
            ];
            
            const verifyResp = await this.sendUpgradeCmd(this.upgrade.CMD_VERIFY, verifyData, 10000);
            if (!verifyResp || !verifyResp.success) {
                throw new Error('校验失败');
            }
            this.log('SYS', '[升级] ✓ 校验通过');
            
            // 重启设备
            this.upgrade.state = 'reboot';
            this.updateUpgradeProgress(95, '重启中...', '正在重启设备...');
            this.log('SYS', '[升级] 重启设备...');
            
            await this.sendUpgradeCmd(this.upgrade.CMD_RESET, [], 1000);
            
            // 完成 - 等待设备重启后自动扫描连接
            this.upgrade.state = 'done';
            this.updateUpgradeProgress(98, '等待重连...', '设备正在重启...');
            this.log('SYS', '[升级] ✓ 升级完成，等待设备重启...');
            
            // 等待设备重启（USB 重新枚举）
            await this.sleep(800);
            
            // 使用 DeviceHub 自动扫描（带重试）
            this.updateUpgradeProgress(99, '自动扫描...', '正在扫描并连接设备...');
            let scanSuccess = false;
            
            // 重试扫描，最多 8 次，每次间隔 300ms
            for (let retry = 0; retry < 8 && !scanSuccess; retry++) {
                if (retry > 0) {
                    this.log('SYS', `[升级] 重试扫描 (${retry}/8)...`);
                    await this.sleep(300);
                }
                
                if (window.DeviceHub && window.DeviceHub.autoScan) {
                    try {
                        if (retry === 0) {
                            this.log('SYS', '[升级] 调用 DeviceHub.autoScan()...');
                        }
                        await DeviceHub.autoScan();
                        // 等待状态刷新
                        await this.sleep(100);
                        // 再次刷新确保状态同步
                        await DeviceHub.refresh();
                        // 检查是否连接成功
                        const connected = DeviceHub.isSerialConnected();
                        if (retry === 0) {
                            this.log('SYS', `[升级] DeviceHub.isSerialConnected() = ${connected}`);
                            this.log('SYS', `[升级] DeviceHub.status = ${JSON.stringify(DeviceHub.status)}`);
                        }
                        if (connected) {
                            scanSuccess = true;
                            this.log('SYS', '[升级] ✓ DeviceHub 自动扫描成功');
                            // 同步状态到 DebugPro
                            await this.syncGlobalSerial();
                            await this.activateDataReceiver();
                        } else if (retry === 0) {
                            this.log('SYS', '[升级] DeviceHub 扫描完成但未连接，将重试...');
                        }
                    } catch (e) {
                        if (retry === 0) {
                            this.log('ERR', `[升级] DeviceHub 自动扫描失败: ${e.message}`);
                        }
                    }
                } else {
                    // 回退：直接调用后端 API
                    const api = window.pywebview?.api || window.parent?.pywebview?.api;
                    if (api && api.cal_auto_scan) {
                        try {
                            const result = await api.cal_auto_scan(115200);
                            if (retry === 0) {
                                this.log('SYS', `[升级] 自动扫描结果: ${JSON.stringify(result)}`);
                            }
                            if (result && result.success) {
                                scanSuccess = true;
                                await this.syncGlobalSerial();
                                await this.activateDataReceiver();
                            }
                        } catch (e) {
                            if (retry === 0) {
                                this.log('ERR', `[升级] 自动扫描失败: ${e.message}`);
                            }
                        }
                    }
                    break;  // 没有 DeviceHub 就不重试了
                }
            }
            
            this.updateUpgradeProgress(100, '升级完成！', scanSuccess ? '已重新连接到新固件' : '请手动连接');
            this.showToast('success', '固件升级成功！', scanSuccess ? '已自动重新连接' : '请点击重连按钮', 4000);
            // 不自动关闭升级窗口
            
        } catch (err) {
            console.error('升级失败:', err);
            this.log('ERR', `[升级] 失败: ${err.message}`);
            this.updateUpgradeProgress(0, '升级失败', err.message);
            this.showToast('error', '升级失败', err.message, 5000);
        }
        
        document.getElementById('dp-btn-upgrade').disabled = false;
    },
    
    // 计算 CRC16 (Modbus)
    crc16(data) {
        let crc = 0xFFFF;
        for (let i = 0; i < data.length; i++) {
            crc ^= data[i];
            for (let j = 0; j < 8; j++) {
                if (crc & 0x0001) crc = (crc >> 1) ^ 0xA001;
                else crc >>= 1;
            }
        }
        return crc;
    },
    
    // 构建升级数据包 (与 Bootloader 协议一致)
    // 格式: [0xAA] [cmd] [len_h] [len_l] [data...] [crc_h] [crc_l] [0x55]
    buildUpgradePacket(cmd, data = []) {
        const len = data.length;
        // CRC 计算范围: cmd + len_h + len_l + data
        const crcData = [cmd, (len >> 8) & 0xFF, len & 0xFF, ...data];
        const crc = this.crc16(crcData);
        
        return new Uint8Array([
            this.upgrade.SOF,
            cmd,
            (len >> 8) & 0xFF,
            len & 0xFF,
            ...data,
            (crc >> 8) & 0xFF,
            crc & 0xFF,
            this.upgrade.EOF
        ]);
    },
    
    // 解析升级响应
    parseUpgradeResponse(data) {
        // 查找帧头
        for (let i = 0; i < data.length; i++) {
            if (data[i] === this.upgrade.SOF && i + 6 < data.length) {
                const cmd = data[i + 1];
                // 响应命令 = 请求命令 | 0x80
                if ((cmd & 0x80) === 0) continue;
                
                const len = (data[i + 2] << 8) | data[i + 3];
                const totalLen = 4 + len + 3; // SOF + CMD + LEN(2) + DATA + CRC(2) + EOF
                
                if (i + totalLen <= data.length && data[i + totalLen - 1] === this.upgrade.EOF) {
                    const payload = data.slice(i + 4, i + 4 + len);
                    
                    // 验证 CRC
                    const recvCrc = (data[i + 4 + len] << 8) | data[i + 5 + len];
                    const calcCrc = this.crc16(data.slice(i + 1, i + 4 + len));
                    
                    if (recvCrc !== calcCrc) {
                        console.warn('[升级] CRC校验失败:', recvCrc.toString(16), calcCrc.toString(16));
                        continue;
                    }
                    
                    return { cmd, payload: Array.from(payload) };
                }
            }
        }
        return null;
    },
    
    async sendUpgradeCmd(cmd, data, timeout = 5000) {
        const packet = this.buildUpgradePacket(cmd, data);
        const hexStr = Array.from(packet).map(b => b.toString(16).padStart(2, '0')).join('');
        
        console.log(`[升级] TX: CMD=0x${cmd.toString(16).padStart(2,'0')} LEN=${data.length} HEX=${hexStr}`);
        
        try {
            const api = window.pywebview?.api || window.parent?.pywebview?.api;
            if (api && api.upgrade_send_and_wait) {
                // 使用专用的升级API（带等待响应）
                const result = await api.upgrade_send_and_wait(hexStr, timeout);
                if (result && result.success && result.data) {
                    // 解析响应
                    const respBytes = [];
                    for (let i = 0; i < result.data.length; i += 2) {
                        respBytes.push(parseInt(result.data.substr(i, 2), 16));
                    }
                    const parsed = this.parseUpgradeResponse(respBytes);
                    if (parsed) {
                        // 检查错误码 (payload[0] == 0 表示成功)
                        const errCode = parsed.payload.length > 0 ? parsed.payload[0] : 0;
                        return { success: errCode === 0, payload: parsed.payload, cmd: parsed.cmd };
                    }
                }
                return result;
            } else {
                // 备用：使用 debug_send 并等待响应
                return await this.sendUpgradeCmdFallback(packet, cmd, timeout);
            }
        } catch (e) {
            console.error('发送升级命令失败:', e);
            return { success: false, error: e.message };
        }
    },
    
    // 快速发送：发送后等待固定时间让 Bootloader 处理（用于批量写入）
    async sendUpgradeCmdFast(cmd, data) {
        const packet = this.buildUpgradePacket(cmd, data);
        const hexStr = Array.from(packet).map(b => b.toString(16).padStart(2, '0')).join('');
        
        try {
            const api = window.pywebview?.api || window.parent?.pywebview?.api;
            if (api && api.upgrade_send_fast) {
                // 使用专用快速发送 API
                await api.upgrade_send_fast(hexStr);
            } else if (api && api.serial_write_hex) {
                api.serial_write_hex(hexStr);
                // 等待 Bootloader 处理（Flash 写入约需 2-3ms/512字节）
                await this.sleep(4);
            } else {
                this.sendHex(hexStr);
                await this.sleep(4);
            }
        } catch (e) {
            console.error('快速发送失败:', e);
        }
    },
    
    // 批量模式：发送不等待响应（最快）
    sendUpgradeCmdNoWait(cmd, data) {
        const packet = this.buildUpgradePacket(cmd, data);
        const hexStr = Array.from(packet).map(b => b.toString(16).padStart(2, '0')).join('');
        
        try {
            const api = window.pywebview?.api || window.parent?.pywebview?.api;
            if (api && api.debug_send) {
                api.debug_send(hexStr);
            } else {
                this.sendHex(hexStr);
            }
        } catch (e) {
            console.error('发送失败:', e);
        }
    },
    
    // 备用发送方法：使用 debug_send 并监听响应
    async sendUpgradeCmdFallback(packet, cmd, timeout) {
        return new Promise(async (resolve) => {
            const hexStr = Array.from(packet).map(b => b.toString(16).padStart(2, '0')).join('');
            
            // 清空接收缓冲
            this.upgrade.rxBuffer = [];
            
            // 设置响应处理器
            const responseHandler = (e) => {
                if (e.detail && e.detail.bytes) {
                    this.upgrade.rxBuffer.push(...e.detail.bytes);
                    
                    // 尝试解析响应
                    const parsed = this.parseUpgradeResponse(this.upgrade.rxBuffer);
                    if (parsed) {
                        document.removeEventListener('backend:debug_rx', responseHandler);
                        clearTimeout(timeoutId);
                        const errCode = parsed.payload.length > 0 ? parsed.payload[0] : 0;
                        resolve({ success: errCode === 0, payload: parsed.payload, cmd: parsed.cmd });
                    }
                }
            };
            
            document.addEventListener('backend:debug_rx', responseHandler);
            
            // 设置超时
            const timeoutId = setTimeout(() => {
                document.removeEventListener('backend:debug_rx', responseHandler);
                console.warn('[升级] 响应超时');
                resolve({ success: false, error: '响应超时' });
            }, timeout);
            
            // 发送数据
            await this.sendHex(hexStr);
        });
    },
    
    crc32(data) {
        let crc = 0xFFFFFFFF;
        const table = this._crc32Table || (this._crc32Table = this._makeCrc32Table());
        for (let i = 0; i < data.length; i++) {
            crc = (crc >>> 8) ^ table[(crc ^ data[i]) & 0xFF];
        }
        return (crc ^ 0xFFFFFFFF) >>> 0;
    },
    
    /**
     * 计算固件 CRC32（与 post_build.py 一致）
     * 排除元数据中的 app_size 和 app_crc 字段（设为 0xFF）
     */
    calcFirmwareCrc(firmware) {
        const META_OFFSET = 0x200;      // 元数据在固件中的偏移
        const APP_SIZE_OFFSET = 0x20;   // app_size 在元数据中的偏移
        const APP_CRC_OFFSET = 0x24;    // app_crc 在元数据中的偏移
        
        // 复制固件数据
        const data = new Uint8Array(firmware);
        
        // 将 app_size 和 app_crc 位置设为 0xFF（不参与 CRC 计算）
        const sizeOffset = META_OFFSET + APP_SIZE_OFFSET;
        const crcOffset = META_OFFSET + APP_CRC_OFFSET;
        
        if (data.length > crcOffset + 4) {
            for (let i = 0; i < 4; i++) {
                data[sizeOffset + i] = 0xFF;
                data[crcOffset + i] = 0xFF;
            }
        }
        
        return this.crc32(data);
    },
    
    _makeCrc32Table() {
        const table = new Uint32Array(256);
        for (let i = 0; i < 256; i++) {
            let c = i;
            for (let j = 0; j < 8; j++) {
                c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
            }
            table[i] = c;
        }
        return table;
    },
    
    closeDeviceModal() {
        document.getElementById('dp-device-modal').style.display = 'none';
    },
    
    scanNewDevice() {
        this.closeDeviceModal();
        this.connectSerial();
    },

    handleImport(event) {
        const file = event.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const text = e.target.result;
                let cmds = [];
                
                if (file.name.endsWith('.json')) {
                    const data = JSON.parse(text);
                    if (data.commands) {
                        cmds = data.commands.map(c => ({
                            hex: c.command || c.hex,
                            name: c.name,
                            delay: c.interval || c.delay || 200
                        }));
                    }
                } else {
                    // INI/TXT 格式
                    text.split('\n').forEach(line => {
                        const match = line.match(/^([^=]+)=(.+)$/);
                        if (match) {
                            cmds.push({ hex: match[2].trim(), name: match[1].trim(), delay: 200 });
                        }
                    });
                }
                
                if (cmds.length > 0) {
                    this.cmdList = cmds;
                    this.configStore.configs[this.configStore.current] = [...this.cmdList];
                    this.persistConfig();
                    this.renderCmds();
                    this.log('SYS', `✓ 已导入 ${cmds.length} 条命令`);
                }
            } catch(err) {
                this.log('ERR', `导入失败: ${err.message}`);
            }
        };
        reader.readAsText(file);
        event.target.value = '';
    },
    
    exportCmds() {
        const data = {
            name: this.configStore.current,
            commands: this.cmdList.map(c => ({
                command: c.hex,
                name: c.name,
                interval: c.delay
            }))
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${this.configStore.current}.json`;
        a.click();
        URL.revokeObjectURL(url);
    },
    
    loadConfigsFromFolder() {
        this.showToast('info', '请使用"导入"按钮', '选择命令配置文件', 2000);
    },
    
    addSelectionToWave() {
        const sel = window.getSelection().toString();
        if (sel) this.parseAndAddToWave(sel);
    },
    
    copySelection() {
        document.execCommand('copy');
    }
};

// 导出到全局
window.DebugPro = DebugPro;

// init 由 app.js 统一调用，不在这里自动调用
</script>
