<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <h1>🔧 GreenLaser 工具</h1>
            <p>选择或创建用户</p>
        </div>
        
        <!-- 已有用户列表 -->
        <div class="user-list" id="user-list">
            <div class="loading">加载中...</div>
        </div>
        
        <!-- 创建新用户 -->
        <div class="create-user-section">
            <div class="divider">
                <span>或</span>
            </div>
            <button class="create-btn" onclick="UserLoginPage.showCreateForm()">
                ➕ 创建新用户
            </button>
        </div>
        
        <!-- 创建用户表单 -->
        <div class="create-form" id="create-form" style="display:none">
            <h3>创建新用户</h3>
            <div class="form-group">
                <label>姓名 *</label>
                <input type="text" id="new-user-name" placeholder="如：张三">
            </div>
            <div class="form-group">
                <label>工号/ID *</label>
                <input type="text" id="new-user-id" placeholder="如：zhangsan">
            </div>
            <div class="form-group">
                <label>角色</label>
                <select id="new-user-role">
                    <option value="dev">研发工程师</option>
                    <option value="test">测试工程师</option>
                    <option value="prod">生产工程师</option>
                </select>
            </div>
            <div class="form-group">
                <label>工作目录 *</label>
                <div class="path-input">
                    <input type="text" id="new-user-workspace" placeholder="选择你的工作目录" readonly>
                    <button onclick="UserLoginPage.selectWorkspace()">浏览</button>
                </div>
            </div>
            
            <div class="git-config-section">
                <h4>Git 配置</h4>
                <div class="form-group">
                    <label>Git用户名 *</label>
                    <input type="text" id="new-git-name" placeholder="Git提交显示的名字">
                </div>
                <div class="form-group">
                    <label>Git邮箱 *</label>
                    <input type="text" id="new-git-email" placeholder="your@email.com">
                </div>
            </div>
            
            <div class="form-actions">
                <button class="cancel-btn" onclick="UserLoginPage.hideCreateForm()">取消</button>
                <button class="submit-btn" onclick="UserLoginPage.createUser()">创建并登录</button>
            </div>
        </div>
    </div>
</div>

<style>
.login-container {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.login-card {
    width: 100%;
    max-width: 450px;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 32px;
}

.login-header {
    text-align: center;
    margin-bottom: 32px;
}
.login-header h1 {
    font-size: 24px;
    margin-bottom: 8px;
}
.login-header p {
    color: var(--text-muted);
    font-size: 14px;
}

/* 用户列表 */
.user-list {
    margin-bottom: 24px;
}
.loading {
    text-align: center;
    color: var(--text-muted);
    padding: 20px;
}

.user-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px;
    background: var(--input-bg);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.2s;
}
.user-item:hover {
    border-color: var(--primary-color);
    transform: translateX(4px);
}
.user-item .avatar {
    width: 48px;
    height: 48px;
    background: var(--primary-color);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: var(--text-on-accent);
}
.user-item .info {
    flex: 1;
}
.user-item .name {
    font-size: 15px;
    font-weight: 500;
    margin-bottom: 4px;
}
.user-item .detail {
    font-size: 12px;
    color: var(--text-muted);
}
.user-item .arrow {
    color: var(--text-muted);
    font-size: 18px;
}

/* 分隔线 */
.divider {
    display: flex;
    align-items: center;
    margin: 24px 0;
}
.divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border-color);
}
.divider span {
    padding: 0 16px;
    color: var(--text-muted);
    font-size: 12px;
}

/* 创建按钮 */
.create-btn {
    width: 100%;
    padding: 14px;
    background: var(--input-bg);
    border: 1px dashed var(--border-color);
    border-radius: 10px;
    color: var(--text-muted);
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
}
.create-btn:hover {
    border-color: var(--primary-color);
    color: var(--primary-color);
}

/* 创建表单 */
.create-form {
    margin-top: 24px;
    padding-top: 24px;
    border-top: 1px solid var(--border-color);
}
.create-form h3 {
    font-size: 16px;
    margin-bottom: 20px;
}
.form-group {
    margin-bottom: 16px;
}
.form-group label {
    display: block;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 6px;
}
.form-group input, .form-group select {
    width: 100%;
    padding: 10px 12px;
    background: var(--input-bg);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    color: var(--text-color);
    font-size: 13px;
}
.form-group input:focus, .form-group select:focus {
    border-color: var(--primary-color);
    outline: none;
}

.path-input {
    display: flex;
    gap: 8px;
}
.path-input input {
    flex: 1;
}
.path-input button {
    padding: 10px 16px;
    background: var(--input-bg);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    color: var(--text-color);
    cursor: pointer;
}

.git-config-section {
    margin-top: 20px;
    padding: 16px;
    background: var(--input-bg);
    border-radius: 8px;
}
.git-config-section h4 {
    font-size: 13px;
    margin-bottom: 16px;
    color: var(--primary-color);
}
.git-config-section .form-group {
    margin-bottom: 12px;
}

.form-actions {
    display: flex;
    gap: 12px;
    margin-top: 24px;
}
.cancel-btn, .submit-btn {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
}
.cancel-btn {
    background: var(--input-bg);
    border: 1px solid var(--border-color);
    color: var(--text-color);
}
.submit-btn {
    background: var(--primary-color);
    border: none;
    color: var(--text-on-accent);
    font-weight: 500;
}

.empty-users {
    text-align: center;
    color: var(--text-muted);
    padding: 30px;
    font-size: 13px;
}
</style>
