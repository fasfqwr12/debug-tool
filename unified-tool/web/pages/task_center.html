<!-- 任务中心 - 基于Git的任务流转 -->
<div class="page-container task-center-page">
    <!-- 顶部状态栏 -->
    <div class="task-header">
        <div class="header-left">
            <h2>📋 任务中心</h2>
            <span class="sync-status" id="sync-status">
                <span class="dot"></span> 未同步
            </span>
        </div>
        <div class="header-right">
            <button class="btn btn-outline" onclick="TaskCenterPage.configRepo()">
                ⚙️ 配置仓库
            </button>
            <button class="btn btn-primary" onclick="TaskCenterPage.syncTasks()">
                🔄 同步任务
            </button>
        </div>
    </div>

    <!-- 角色切换 -->
    <div class="role-tabs">
        <button class="role-tab active" data-role="tester" onclick="TaskCenterPage.switchRole('tester')">
            🧪 我是测试
        </button>
        <button class="role-tab" data-role="developer" onclick="TaskCenterPage.switchRole('developer')">
            💻 我是研发
        </button>
        <button class="role-tab" data-role="production" onclick="TaskCenterPage.switchRole('production')">
            🏭 我是生产
        </button>
    </div>

    <!-- 任务列表区域 -->
    <div class="task-content">
        <!-- 左侧：任务列表 -->
        <div class="task-list-panel">
            <div class="panel-header">
                <span>待处理任务</span>
                <span class="task-count" id="task-count">0</span>
            </div>
            <div class="task-filters">
                <select id="filter-status" onchange="TaskCenterPage.filterTasks()">
                    <option value="">全部状态</option>
                    <option value="pending">待测试</option>
                    <option value="testing">测试中</option>
                    <option value="passed">已通过</option>
                    <option value="failed">未通过</option>
                </select>
                <input type="text" id="filter-keyword" placeholder="搜索..." oninput="TaskCenterPage.filterTasks()">
            </div>
            <div class="task-list" id="task-list">
                <div class="empty-hint">点击"同步任务"获取最新任务</div>
            </div>
        </div>

        <!-- 右侧：任务详情 -->
        <div class="task-detail-panel">
            <div id="task-detail-empty" class="empty-hint">
                选择任务查看详情
            </div>
            <div id="task-detail-content" style="display:none;">
                <!-- 任务基本信息 -->
                <div class="detail-section">
                    <div class="section-title">📦 版本信息</div>
                    <div class="info-grid">
                        <div class="info-item">
                            <label>项目</label>
                            <span id="detail-project">--</span>
                        </div>
                        <div class="info-item">
                            <label>版本</label>
                            <span id="detail-version">--</span>
                        </div>
                        <div class="info-item">
                            <label>固件CRC</label>
                            <span id="detail-crc">--</span>
                        </div>
                        <div class="info-item">
                            <label>分配人</label>
                            <span id="detail-assigner">--</span>
                        </div>
                        <div class="info-item">
                            <label>分配时间</label>
                            <span id="detail-assign-time">--</span>
                        </div>
                        <div class="info-item">
                            <label>状态</label>
                            <span id="detail-status">--</span>
                        </div>
                    </div>
                </div>

                <!-- 发布说明 -->
                <div class="detail-section">
                    <div class="section-title">📝 发布说明</div>
                    <div class="release-note" id="detail-release-note">--</div>
                </div>

                <!-- 测试要求 -->
                <div class="detail-section">
                    <div class="section-title">✅ 测试要求</div>
                    <div class="test-requirements" id="detail-requirements">
                        <div class="req-item">精度测试</div>
                        <div class="req-item">滑台测试</div>
                    </div>
                </div>

                <!-- 测试结果（如果有） -->
                <div class="detail-section" id="result-section" style="display:none;">
                    <div class="section-title">📊 测试结果</div>
                    <div class="result-summary" id="detail-result">
                    </div>
                </div>

                <!-- 操作按钮 -->
                <div class="detail-actions">
                    <button class="btn btn-primary" id="btn-start-test" onclick="TaskCenterPage.startTest()">
                        ▶️ 开始测试
                    </button>
                    <button class="btn btn-success" id="btn-submit-result" onclick="TaskCenterPage.submitResult()" style="display:none;">
                        ✅ 提交结果
                    </button>
                    <button class="btn btn-outline" id="btn-download-firmware" onclick="TaskCenterPage.downloadFirmware()">
                        📥 下载固件
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 仓库配置弹窗 -->
<div class="modal-overlay" id="repo-config-modal" style="display:none;">
    <div class="modal-card">
        <div class="modal-header">
            <span>⚙️ 配置任务仓库</span>
            <button class="close-btn" onclick="TaskCenterPage.hideConfigModal()">×</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label>Git仓库地址</label>
                <input type="text" id="repo-url" placeholder="https://github.com/xxx/tasks.git">
            </div>
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="repo-username" placeholder="Git用户名">
            </div>
            <div class="form-group">
                <label>密码/Token</label>
                <input type="password" id="repo-password" placeholder="密码或Personal Access Token">
            </div>
            <div class="form-group">
                <label>本地目录</label>
                <div class="input-with-btn">
                    <input type="text" id="repo-local-path" placeholder="任务仓库本地路径" readonly>
                    <button class="btn" onclick="TaskCenterPage.selectLocalPath()">选择</button>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn" onclick="TaskCenterPage.hideConfigModal()">取消</button>
            <button class="btn btn-primary" onclick="TaskCenterPage.saveRepoConfig()">保存并克隆</button>
        </div>
    </div>
</div>
