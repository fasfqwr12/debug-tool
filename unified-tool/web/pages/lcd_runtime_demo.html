<!-- LCD运行时演示页面 - 展示组件、预设、动画的完整集成 -->
<style>
    .runtime-demo {
        display: grid;
        grid-template-columns: 280px 1fr 300px;
        height: 100%;
        background: var(--bg-primary);
    }
    
    /* 左侧控制面板 */
    .demo-controls {
        background: var(--bg-secondary);
        border-right: 1px solid var(--border-color);
        overflow-y: auto;
        padding: 12px;
    }
    .demo-section {
        margin-bottom: 16px;
    }
    .demo-section-title {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-muted);
        margin-bottom: 8px;
        padding-bottom: 4px;
        border-bottom: 1px solid var(--border-color);
    }
    .demo-btn {
        display: block;
        width: 100%;
        padding: 8px 12px;
        margin-bottom: 4px;
        background: var(--bg-tertiary);
        border: 1px solid var(--border-color);
        border-radius: 4px;
        color: var(--text-primary);
        font-size: 12px;
        cursor: pointer;
        text-align: left;
    }
    .demo-btn:hover {
        border-color: var(--accent-color);
        background: var(--bg-primary);
    }
    .demo-btn.active {
        background: var(--accent-color);
        border-color: var(--accent-color);
        color: white;
    }
    .demo-btn-group {
        display: flex;
        gap: 4px;
        margin-bottom: 4px;
    }
    .demo-btn-group .demo-btn {
        flex: 1;
        margin-bottom: 0;
    }
    
    /* 中间LCD显示 */
    .demo-lcd-area {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0a0a0a;
        padding: 20px;
    }
    .demo-lcd-container {
        background: #1a1a2e;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 0 40px rgba(0, 255, 136, 0.1);
    }
    #demo-lcd-canvas {
        display: block;
        border-radius: 4px;
    }
    .demo-lcd-info {
        margin-top: 16px;
        color: var(--text-muted);
        font-size: 11px;
        text-align: center;
    }
    
    /* 右侧状态面板 */
    .demo-status {
        background: var(--bg-secondary);
        border-left: 1px solid var(--border-color);
        overflow-y: auto;
        padding: 12px;
    }
    .status-card {
        background: var(--bg-primary);
        border: 1px solid var(--border-color);
        border-radius: 6px;
        padding: 10px;
        margin-bottom: 8px;
    }
    .status-card-title {
        font-size: 11px;
        font-weight: 600;
        color: var(--accent-color);
        margin-bottom: 6px;
    }
    .status-item {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        padding: 3px 0;
        border-bottom: 1px solid var(--border-color);
    }
    .status-item:last-child {
        border-bottom: none;
    }
    .status-value {
        color: var(--text-muted);
        font-family: monospace;
    }
    .status-value.active {
        color: #00ff88;
    }
    
    /* 动画列表 */
    .anim-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        background: var(--bg-primary);
        border-radius: 4px;
        margin-bottom: 4px;
        font-size: 11px;
    }
    .anim-indicator {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--text-muted);
    }
    .anim-indicator.running {
        background: #00ff88;
        animation: pulse 1s infinite;
    }
    @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
    }
    
    /* 日志区域 */
    .demo-log {
        background: var(--bg-primary);
        border: 1px solid var(--border-color);
        border-radius: 4px;
        padding: 8px;
        max-height: 150px;
        overflow-y: auto;
        font-family: monospace;
        font-size: 10px;
    }
    .log-entry {
        padding: 2px 0;
        border-bottom: 1px solid var(--border-color);
    }
    .log-entry:last-child {
        border-bottom: none;
    }
    .log-time {
        color: var(--text-muted);
    }
    .log-info { color: #3b82f6; }
    .log-success { color: #22c55e; }
    .log-warning { color: #f59e0b; }
</style>

<div class="runtime-demo">
    <!-- 左侧控制面板 -->
    <div class="demo-controls">
        <div class="demo-section">
            <div class="demo-section-title">🎯 快速操作</div>
            <div class="demo-btn-group">
                <button class="demo-btn" onclick="LcdRuntimeDemo.showAll()">全显</button>
                <button class="demo-btn" onclick="LcdRuntimeDemo.clearAll()">清屏</button>
            </div>
            <button class="demo-btn" onclick="LcdRuntimeDemo.stopAllAnimations()">⏹ 停止所有动画</button>
        </div>
        
        <div class="demo-section">
            <div class="demo-section-title">📋 界面预设</div>
            <div id="demo-presets"></div>
        </div>
        
        <div class="demo-section">
            <div class="demo-section-title">🎬 动画效果</div>
            <div id="demo-animations"></div>
        </div>
        
        <div class="demo-section">
            <div class="demo-section-title">🔢 组件控制</div>
            <div id="demo-components"></div>
        </div>
    </div>
    
    <!-- 中间LCD显示 -->
    <div class="demo-lcd-area">
        <div class="demo-lcd-container">
            <canvas id="demo-lcd-canvas" width="600" height="300"></canvas>
        </div>
        <div class="demo-lcd-info">
            <span id="demo-device-name">加载中...</span> | 
            <span id="demo-element-count">0 元素</span> |
            <span id="demo-fps">0 FPS</span>
        </div>
    </div>
    
    <!-- 右侧状态面板 -->
    <div class="demo-status">
        <div class="demo-section">
            <div class="demo-section-title">📊 组件状态</div>
            <div id="demo-component-states"></div>
        </div>
        
        <div class="demo-section">
            <div class="demo-section-title">🎬 活动动画</div>
            <div id="demo-active-animations"></div>
        </div>
        
        <div class="demo-section">
            <div class="demo-section-title">📝 事件日志</div>
            <div class="demo-log" id="demo-log"></div>
        </div>
    </div>
</div>

<script>
window.LcdRuntimeDemo = {
    canvas: null,
    ctx: null,
    lcdProject: null,
    frameCount: 0,
    lastFpsTime: Date.now(),
    
    async init() {
        console.log('[LcdRuntimeDemo] 初始化');
        
        this.canvas = document.getElementById('demo-lcd-canvas');
        this.ctx = this.canvas.getContext('2d');
        
        // 等待DeviceConfigManager和LcdRuntime
        if (typeof DeviceConfigManager !== 'undefined') {
            await DeviceConfigManager.init();
        }
        
        if (typeof LcdRuntime !== 'undefined') {
            await LcdRuntime.init();
            
            // 注册回调
            LcdRuntime.on('onBufferUpdate', () => this.render());
            LcdRuntime.on('onStateChange', (e) => this.log(`状态变化: ${e.componentId} ${e.type}`, 'info'));
            LcdRuntime.on('onAnimationStart', (e) => this.log(`动画开始: ${e.animId}`, 'success'));
            LcdRuntime.on('onAnimationEnd', (e) => this.log(`动画结束: ${e.animId}`, 'warning'));
            LcdRuntime.on('onPresetApplied', (e) => this.log(`应用预设: ${e.presetId}`, 'success'));
            
            // 加载LCD项目
            this.lcdProject = await DeviceConfigManager.loadLcdProject();
            
            // 更新UI
            this.updateDeviceInfo();
            this.renderPresetButtons();
            this.renderAnimationButtons();
            this.renderComponentControls();
            
            // 开始渲染循环
            this.startRenderLoop();
            
            this.log('LcdRuntime 初始化完成', 'success');
        } else {
            this.log('LcdRuntime 不可用', 'warning');
        }
    },
    
    updateDeviceInfo() {
        const deviceName = document.getElementById('demo-device-name');
        const elementCount = document.getElementById('demo-element-count');
        
        if (deviceName) {
            deviceName.textContent = LcdRuntime.state.deviceId || '未知设备';
        }
        if (elementCount && this.lcdProject?.elements) {
            elementCount.textContent = `${this.lcdProject.elements.length} 元素`;
        }
    },
    
    renderPresetButtons() {
        const container = document.getElementById('demo-presets');
        if (!container) return;
        
        const presets = LcdRuntime.state.presets || {};
        let html = '';
        
        // 按分类分组
        const categories = {};
        for (const [id, preset] of Object.entries(presets)) {
            const cat = preset.category || '其他';
            if (!categories[cat]) categories[cat] = [];
            categories[cat].push({ id, ...preset });
        }
        
        for (const [cat, items] of Object.entries(categories)) {
            html += `<div style="font-size:10px;color:var(--text-muted);margin:8px 0 4px;">${cat}</div>`;
            for (const preset of items) {
                html += `<button class="demo-btn" onclick="LcdRuntimeDemo.applyPreset('${preset.id}')" title="${preset.description || ''}">
                    ${preset.name || preset.id}
                </button>`;
            }
        }
        
        container.innerHTML = html || '<div style="color:var(--text-muted);font-size:11px;">无预设</div>';
    },
    
    renderAnimationButtons() {
        const container = document.getElementById('demo-animations');
        if (!container) return;
        
        const animations = LcdRuntime.state.animations || {};
        let html = '';
        
        for (const [id, anim] of Object.entries(animations)) {
            html += `<div class="demo-btn-group">
                <button class="demo-btn" onclick="LcdRuntimeDemo.startAnimation('${id}')" title="${anim.description || ''}">
                    ▶ ${anim.name || id}
                </button>
                <button class="demo-btn" onclick="LcdRuntimeDemo.stopAnimation('${id}')" style="flex:0 0 40px;">⏹</button>
            </div>`;
        }
        
        container.innerHTML = html || '<div style="color:var(--text-muted);font-size:11px;">无动画</div>';
    },
    
    renderComponentControls() {
        const container = document.getElementById('demo-components');
        if (!container) return;
        
        const components = LcdRuntime.state.components || {};
        let html = '';
        
        for (const [id, comp] of Object.entries(components)) {
            if (comp.type === 'NumberDisplay') {
                html += `<div style="margin-bottom:8px;">
                    <div style="font-size:10px;color:var(--text-muted);margin-bottom:2px;">${id}</div>
                    <input type="text" placeholder="输入数值" style="width:100%;padding:4px 8px;font-size:11px;background:var(--bg-primary);border:1px solid var(--border-color);border-radius:3px;color:var(--text-primary);"
                           onchange="LcdRuntimeDemo.setValue('${id}', this.value)"/>
                </div>`;
            } else if (comp.type === 'LevelIndicator') {
                const max = comp.maxLevel || 3;
                html += `<div style="margin-bottom:8px;">
                    <div style="font-size:10px;color:var(--text-muted);margin-bottom:2px;">${id}</div>
                    <input type="range" min="0" max="${max}" value="0" style="width:100%;"
                           onchange="LcdRuntimeDemo.setLevel('${id}', parseInt(this.value))"/>
                </div>`;
            } else if (comp.type === 'Icon') {
                html += `<div class="demo-btn-group">
                    <button class="demo-btn" onclick="LcdRuntimeDemo.setVisible('${id}', true)">显示 ${id}</button>
                    <button class="demo-btn" onclick="LcdRuntimeDemo.setVisible('${id}', false)">隐藏</button>
                </div>`;
            }
        }
        
        container.innerHTML = html || '<div style="color:var(--text-muted);font-size:11px;">无组件</div>';
    },
    
    updateComponentStates() {
        const container = document.getElementById('demo-component-states');
        if (!container) return;
        
        const states = LcdRuntime.getAllComponentStates();
        let html = '';
        
        for (const [id, state] of Object.entries(states)) {
            html += `<div class="status-card">
                <div class="status-card-title">${id}</div>`;
            for (const [key, value] of Object.entries(state)) {
                const displayValue = typeof value === 'boolean' ? (value ? '✓' : '✗') : value;
                html += `<div class="status-item">
                    <span>${key}</span>
                    <span class="status-value ${value ? 'active' : ''}">${displayValue}</span>
                </div>`;
            }
            html += '</div>';
        }
        
        container.innerHTML = html || '<div style="color:var(--text-muted);font-size:11px;">无状态</div>';
    },
    
    updateActiveAnimations() {
        const container = document.getElementById('demo-active-animations');
        if (!container) return;
        
        const active = LcdRuntime.getActiveAnimations();
        
        if (active.length === 0) {
            container.innerHTML = '<div style="color:var(--text-muted);font-size:11px;">无活动动画</div>';
            return;
        }
        
        let html = '';
        for (const animId of active) {
            const anim = LcdRuntime.state.animations[animId];
            html += `<div class="anim-item">
                <div class="anim-indicator running"></div>
                <span>${anim?.name || animId}</span>
                <button onclick="LcdRuntimeDemo.stopAnimation('${animId}')" style="margin-left:auto;padding:2px 6px;font-size:10px;background:var(--bg-tertiary);border:1px solid var(--border-color);border-radius:3px;cursor:pointer;">⏹</button>
            </div>`;
        }
        
        container.innerHTML = html;
    },
    
    // 控制方法
    showAll() {
        LcdRuntime.showAll();
        this.log('全显', 'info');
    },
    
    clearAll() {
        LcdRuntime.clearAll();
        this.log('清屏', 'info');
    },
    
    applyPreset(presetId) {
        LcdRuntime.applyPreset(presetId);
    },
    
    startAnimation(animId) {
        LcdRuntime.startAnimation(animId);
    },
    
    stopAnimation(animId) {
        LcdRuntime.stopAnimation(animId);
    },
    
    stopAllAnimations() {
        LcdRuntime.stopAllAnimations();
        this.log('停止所有动画', 'warning');
    },
    
    setValue(componentId, value) {
        LcdRuntime.setValue(componentId, value);
    },
    
    setLevel(componentId, level) {
        LcdRuntime.setLevel(componentId, level);
    },
    
    setVisible(componentId, visible) {
        LcdRuntime.setVisible(componentId, visible);
    },
    
    // 渲染
    startRenderLoop() {
        const loop = () => {
            this.render();
            this.updateComponentStates();
            this.updateActiveAnimations();
            this.updateFps();
            requestAnimationFrame(loop);
        };
        loop();
    },
    
    render() {
        if (!this.ctx || !this.lcdProject?.elements) return;
        
        const ctx = this.ctx;
        const w = this.canvas.width;
        const h = this.canvas.height;
        
        // 清空
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(0, 0, w, h);
        
        // 计算缩放
        let maxX = 400, maxY = 200;
        for (const elem of this.lcdProject.elements) {
            for (const seg of elem.segments || []) {
                const pixels = seg.pixelMask || seg.pixels || [];
                for (const pkey of pixels) {
                    const [px, py] = pkey.split(',').map(Number);
                    if (px > maxX) maxX = px;
                    if (py > maxY) maxY = py;
                }
            }
        }
        
        const scale = Math.min(w / (maxX + 20), h / (maxY + 20));
        const offsetX = (w - maxX * scale) / 2;
        const offsetY = (h - maxY * scale) / 2;
        
        // 渲染每个元素
        for (const elem of this.lcdProject.elements) {
            for (const seg of elem.segments || []) {
                const pixels = seg.pixelMask || seg.pixels || [];
                const pixelSet = pixels instanceof Set ? pixels : new Set(pixels);
                
                if (pixelSet.size === 0) continue;
                
                // 检查段是否点亮
                const segIdx = parseInt(seg.seg);
                const comIdx = parseInt(seg.com);
                const isLit = LcdRuntime.getSegment(segIdx, comIdx);
                
                if (isLit) {
                    ctx.fillStyle = '#00ff88';
                } else {
                    ctx.fillStyle = 'rgba(42, 58, 42, 0.3)';
                }
                
                for (const pkey of pixelSet) {
                    const [px, py] = pkey.split(',').map(Number);
                    ctx.fillRect(px * scale + offsetX, py * scale + offsetY, scale, scale);
                }
            }
        }
        
        this.frameCount++;
    },
    
    updateFps() {
        const now = Date.now();
        if (now - this.lastFpsTime >= 1000) {
            const fps = document.getElementById('demo-fps');
            if (fps) {
                fps.textContent = `${this.frameCount} FPS`;
            }
            this.frameCount = 0;
            this.lastFpsTime = now;
        }
    },
    
    log(message, type = 'info') {
        const logContainer = document.getElementById('demo-log');
        if (!logContainer) return;
        
        const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        entry.innerHTML = `<span class="log-time">[${time}]</span> <span class="log-${type}">${message}</span>`;
        
        logContainer.appendChild(entry);
        logContainer.scrollTop = logContainer.scrollHeight;
        
        // 限制日志数量
        while (logContainer.children.length > 50) {
            logContainer.removeChild(logContainer.firstChild);
        }
    }
};

// 页面加载时初始化
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => LcdRuntimeDemo.init());
} else {
    LcdRuntimeDemo.init();
}
</script>
