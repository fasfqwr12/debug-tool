<!-- 设备追溯与生产统计页面 -->
<div class="page-container traceability-page">
    <!-- 顶部Tab切换 -->
    <div class="page-tabs">
        <button class="tab-btn active" onclick="TraceabilityPage.switchTab('lifecycle')">
            <span class="tab-icon">🔍</span> 设备追溯
        </button>
        <button class="tab-btn" onclick="TraceabilityPage.switchTab('qrcode')">
            <span class="tab-icon">📱</span> 二维码
        </button>
        <button class="tab-btn" onclick="TraceabilityPage.switchTab('production')">
            <span class="tab-icon">📊</span> 生产统计
        </button>
        <button class="tab-btn" onclick="TraceabilityPage.switchTab('firmware')">
            <span class="tab-icon">⚡</span> 固件对比
        </button>
    </div>

    <!-- 设备追溯面板 -->
    <div id="tab-lifecycle" class="tab-panel active">
        <div class="search-bar">
            <div class="search-group">
                <label>设备ID</label>
                <input type="text" id="trace-device-id" placeholder="输入设备ID (如 12345678)" list="trace-device-list">
                <datalist id="trace-device-list"></datalist>
            </div>
            <div class="search-group">
                <label>序列号</label>
                <input type="text" id="trace-serial" placeholder="输入设备序列号">
            </div>
            <button class="btn btn-primary" onclick="TraceabilityPage.searchDevice()">
                <span>🔍</span> 查询
            </button>
        </div>

        <!-- 设备概览 -->
        <div id="device-overview" class="overview-panel" style="display:none;">
            <div class="overview-header">
                <h3 id="device-title">设备信息</h3>
                <span id="device-model" class="model-badge"></span>
            </div>
            <div class="overview-stats">
                <div class="stat-card">
                    <div class="stat-value" id="stat-total-tests">0</div>
                    <div class="stat-label">总测试次数</div>
                </div>
                <div class="stat-card success">
                    <div class="stat-value" id="stat-passed">0</div>
                    <div class="stat-label">通过</div>
                </div>
                <div class="stat-card danger">
                    <div class="stat-value" id="stat-failed">0</div>
                    <div class="stat-label">失败</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-pass-rate">0%</div>
                    <div class="stat-label">通过率</div>
                </div>
            </div>
            <div class="overview-info">
                <div class="info-item"><label>首次测试</label><span id="info-first-test">--</span></div>
                <div class="info-item"><label>最近测试</label><span id="info-last-test">--</span></div>
                <div class="info-item"><label>固件版本</label><span id="info-firmware">--</span></div>
            </div>
        </div>

        <!-- 时间线 -->
        <div id="device-timeline" class="timeline-container" style="display:none;">
            <h4>📅 测试时间线</h4>
            <div id="timeline-list" class="timeline-list"></div>
        </div>

        <!-- 校准历史 -->
        <div id="calibration-history" class="history-container" style="display:none;">
            <h4>🎯 校准历史</h4>
            <div id="calibration-list" class="history-list"></div>
        </div>

        <!-- 滑台测试历史 -->
        <div id="slipway-history" class="history-container" style="display:none;">
            <h4>📏 滑台测试历史</h4>
            <div id="slipway-list" class="history-list"></div>
        </div>
    </div>

    <!-- 二维码面板 -->
    <div id="tab-qrcode" class="tab-panel">
        <div class="qrcode-container">
            <!-- 左侧：生成二维码 -->
            <div class="qrcode-section">
                <h4>生成二维码标签</h4>
                <div class="qrcode-form">
                    <div class="form-group">
                        <label>设备ID</label>
                        <input type="text" id="qr-device-id" placeholder="输入设备ID (如 12345678)">
                    </div>
                    <div class="form-group">
                        <label>型号名称</label>
                        <input type="text" id="qr-model-name" placeholder="可选">
                    </div>
                    <div class="form-group">
                        <label>标签尺寸</label>
                        <select id="qr-label-size">
                            <option value="tiny" selected>5x5mm (纯二维码)</option>
                            <option value="small">7.5x10mm</option>
                            <option value="medium">15x19mm</option>
                            <option value="large">25x31mm</option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button class="btn btn-primary" onclick="TraceabilityPage.generateQRCode()">
                            生成预览
                        </button>
                        <button class="btn btn-secondary" onclick="TraceabilityPage.downloadLabel()">
                            下载图片
                        </button>
                    </div>
                </div>
                
                <!-- 二维码预览 -->
                <div id="qrcode-preview" class="qrcode-preview">
                    <div class="preview-placeholder">生成后显示预览</div>
                </div>
            </div>
            
            <!-- 右侧：打印设置 -->
            <div class="qrcode-section">
                <h4>打印设置</h4>
                <div class="qrcode-form">
                    <div class="form-group">
                        <label>选择打印机</label>
                        <select id="qr-printer-select">
                            <option value="">加载中...</option>
                        </select>
                        <button class="btn-icon" onclick="TraceabilityPage.refreshPrinters()" title="刷新">🔄</button>
                    </div>
                    <div class="form-group">
                        <label>打印份数</label>
                        <input type="number" id="qr-copies" value="1" min="1" max="100">
                    </div>
                    <div class="form-actions">
                        <button class="btn btn-success" onclick="TraceabilityPage.printLabel()">
                            打印标签
                        </button>
                        <button class="btn btn-secondary" onclick="TraceabilityPage.printTestPage()">
                            打印测试页
                        </button>
                    </div>
                </div>
                
                <!-- 扫码查询 -->
                <div class="scan-section">
                    <h4>扫码查询</h4>
                    <div class="form-group">
                        <label>扫描结果 / 设备ID</label>
                        <input type="text" id="qr-scan-input" placeholder="扫描二维码或输入设备ID">
                    </div>
                    <button class="btn btn-primary" onclick="TraceabilityPage.scanQuery()">
                        查询设备
                    </button>
                </div>
                
                <!-- 密码设置 -->
                <div class="password-section">
                    <h4>访问密码</h4>
                    <div class="form-group">
                        <label>当前密码</label>
                        <input type="password" id="qr-current-password" placeholder="验证密码">
                        <button class="btn btn-sm" onclick="TraceabilityPage.verifyPassword()">验证</button>
                    </div>
                    <div class="form-group">
                        <label>新密码</label>
                        <input type="password" id="qr-new-password" placeholder="设置新密码 (至少4位)">
                        <button class="btn btn-sm" onclick="TraceabilityPage.changePassword()">修改</button>
                    </div>
                    <div id="qr-auth-status" class="auth-status"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 生产统计面板 -->
    <div id="tab-production" class="tab-panel">
        <div class="search-bar">
            <div class="search-group">
                <label>开始日期</label>
                <input type="date" id="prod-date-from">
            </div>
            <div class="search-group">
                <label>结束日期</label>
                <input type="date" id="prod-date-to">
            </div>
            <div class="search-group">
                <label>型号</label>
                <select id="prod-model">
                    <option value="">全部型号</option>
                </select>
            </div>
            <div class="search-group">
                <label>工位</label>
                <select id="prod-station">
                    <option value="">全部工位</option>
                </select>
            </div>
            <button class="btn btn-primary" onclick="TraceabilityPage.loadProductionStats()">
                <span>📊</span> 统计
            </button>
        </div>

        <!-- 统计概览 -->
        <div class="production-overview">
            <div class="stat-card large">
                <div class="stat-value" id="prod-total">0</div>
                <div class="stat-label">总测试数</div>
            </div>
            <div class="stat-card large success">
                <div class="stat-value" id="prod-passed">0</div>
                <div class="stat-label">通过数</div>
            </div>
            <div class="stat-card large danger">
                <div class="stat-value" id="prod-failed">0</div>
                <div class="stat-label">失败数</div>
            </div>
            <div class="stat-card large highlight">
                <div class="stat-value" id="prod-pass-rate">0%</div>
                <div class="stat-label">通过率</div>
            </div>
        </div>

        <!-- 图表区域 -->
        <div class="charts-row">
            <div class="chart-box">
                <h4>📈 质量趋势</h4>
                <canvas id="quality-trend-chart"></canvas>
            </div>
            <div class="chart-box">
                <h4>📊 型号分布</h4>
                <canvas id="model-dist-chart"></canvas>
            </div>
        </div>

        <!-- 工位统计表 -->
        <div class="station-stats">
            <h4>🏭 工位统计</h4>
            <table id="station-table">
                <thead>
                    <tr><th>工位</th><th>测试数</th><th>通过</th><th>失败</th><th>通过率</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <!-- 固件对比面板 -->
    <div id="tab-firmware" class="tab-panel">
        <div class="search-bar">
            <div class="search-group wide">
                <label>选择CRC版本对比</label>
                <select id="firmware-crc-select" multiple size="4">
                </select>
            </div>
            <button class="btn btn-primary" onclick="TraceabilityPage.compareFirmware()">
                <span>⚡</span> 对比分析
            </button>
        </div>

        <!-- 对比结果 -->
        <div id="firmware-comparison" class="comparison-container">
            <table id="firmware-table">
                <thead>
                    <tr>
                        <th>版本/CRC</th>
                        <th>测试次数</th>
                        <th>通过数</th>
                        <th>通过率</th>
                        <th>平均误差</th>
                        <th>最大误差</th>
                        <th>最小误差</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <!-- 对比图表 -->
        <div class="chart-box" style="margin-top:20px;">
            <h4>📊 版本对比图</h4>
            <canvas id="firmware-compare-chart"></canvas>
        </div>
    </div>
</div>
