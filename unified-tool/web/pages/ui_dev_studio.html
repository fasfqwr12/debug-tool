<!-- UI 开发工作室 - 层级化可视化开发平台 -->
<div class="studio-container">
    <!-- 顶部工具栏 -->
    <div class="studio-toolbar">
        <div class="studio-toolbar-left">
            <h1>🎨 UI 开发工作室</h1>
            <div id="studio-device-selector" class="device-selector-container"></div>
            <div class="studio-tabs">
                <button class="studio-tab active" data-tab="events" onclick="UIDevStudio.switchTab('events')">📋 事件库</button>
                <button class="studio-tab" data-tab="actions" onclick="UIDevStudio.switchTab('actions')">⚡ 动作库</button>
                <button class="studio-tab" data-tab="modes" onclick="UIDevStudio.switchTab('modes')">📁 模式树</button>
                <button class="studio-tab" data-tab="flow" onclick="UIDevStudio.switchTab('flow')">🔄 流程编辑</button>
                <button class="studio-tab" data-tab="simulate" onclick="UIDevStudio.switchTab('simulate')">▶️ 模拟运行</button>
            </div>
        </div>
        <div class="studio-toolbar-right">
            <button onclick="UIDevStudio.loadExample()" class="studio-btn">📦 加载示例</button>
            <button onclick="UIDevStudio.save()" class="studio-btn studio-btn-primary">💾 保存</button>
            <button onclick="UIDevStudio.generateCode()" class="studio-btn">⚙️ 生成代码</button>
            <button onclick="UIDevStudio.showHelp()" class="studio-btn">❓ 帮助</button>
        </div>
    </div>

    <!-- 主内容区 -->
    <div class="studio-main">
        <!-- Tab 1: 事件库 -->
        <div class="studio-panel" id="panel-events">
            <div class="panel-split">
                <div class="panel-left">
                    <div class="panel-header">
                        <span>事件分类</span>
                        <button class="mini-btn" onclick="UIDevStudio.addEventCategory()">➕</button>
                    </div>
                    <div class="event-categories" id="event-categories"></div>
                </div>
                <div class="panel-right">
                    <div class="panel-header">
                        <span id="events-title">选择分类查看事件</span>
                        <button class="mini-btn" onclick="UIDevStudio.addEvent()">➕ 添加事件</button>
                    </div>
                    <div class="event-list" id="event-list"></div>
                </div>
            </div>
        </div>

        <!-- Tab 2: 动作库 -->
        <div class="studio-panel" id="panel-actions" style="display:none;">
            <div class="panel-split">
                <div class="panel-left">
                    <div class="panel-header">
                        <span>动作列表</span>
                        <button class="mini-btn" onclick="UIDevStudio.addAction()">➕</button>
                    </div>
                    <div class="action-list" id="action-list"></div>
                </div>
                <div class="panel-right">
                    <div class="panel-header"><span>动作编辑</span></div>
                    <div class="action-editor" id="action-editor">
                        <div class="empty-hint">👈 选择或创建动作</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tab 3: 模式树 -->
        <div class="studio-panel" id="panel-modes" style="display:none;">
            <div class="panel-split">
                <div class="panel-left">
                    <div class="panel-header">
                        <span>模式树</span>
                        <button class="mini-btn" onclick="UIDevStudio.addMode()">➕</button>
                    </div>
                    <div class="mode-tree" id="mode-tree"></div>
                </div>
                <div class="panel-right">
                    <div class="panel-header"><span>模式属性</span></div>
                    <div class="mode-editor" id="mode-editor">
                        <div class="empty-hint">👈 选择模式查看属性</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tab 4: 流程编辑 -->
        <div class="studio-panel" id="panel-flow" style="display:none;">
            <div class="flow-layout">
                <div class="flow-sidebar">
                    <div class="panel-header"><span>当前流程</span></div>
                    <select id="flow-select" onchange="UIDevStudio.loadFlow(this.value)">
                        <option value="">-- 选择流程 --</option>
                    </select>
                    <div class="flow-states" id="flow-states"></div>
                    <div class="panel-header" style="margin-top:12px;"><span>事件面板</span></div>
                    <div class="flow-events" id="flow-events"></div>
                </div>
                <div class="flow-canvas-container">
                    <canvas id="flow-canvas"></canvas>
                    <div class="flow-tools">
                        <button class="tool-btn active" data-tool="pointer" onclick="UIDevStudio.setFlowTool('pointer')">↖</button>
                        <button class="tool-btn" data-tool="state" onclick="UIDevStudio.setFlowTool('state')">⬜</button>
                        <button class="tool-btn" data-tool="transition" onclick="UIDevStudio.setFlowTool('transition')">→</button>
                    </div>
                </div>
                <div class="flow-property">
                    <div class="panel-header"><span>属性</span></div>
                    <div id="flow-property-content">
                        <div class="empty-hint">选择状态或转移</div>
                    </div>
                    <div class="panel-header" style="margin-top:12px;"><span>LCD预览</span></div>
                    <div class="lcd-preview-box">
                        <canvas id="flow-lcd-canvas"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tab 5: 模拟运行 -->
        <div class="studio-panel" id="panel-simulate" style="display:none;">
            <div class="simulate-layout">
                <div class="simulate-controls">
                    <div class="panel-header"><span>控制面板</span></div>
                    <div class="sim-buttons">
                        <button onclick="UIDevStudio.simReset()">🔄 重置</button>
                        <button onclick="UIDevStudio.simStep()">⏭️ 单步</button>
                    </div>
                    <div class="sim-state">
                        <label>当前状态:</label>
                        <span id="sim-current-state">-</span>
                    </div>
                    <div class="panel-header"><span>触发事件</span></div>
                    <div class="sim-event-buttons" id="sim-event-buttons"></div>
                    <div class="panel-header"><span>执行日志</span></div>
                    <div class="sim-log" id="sim-log"></div>
                </div>
                <div class="simulate-display">
                    <div class="panel-header"><span>LCD 显示</span></div>
                    <div class="sim-lcd-container">
                        <canvas id="sim-lcd-canvas"></canvas>
                    </div>
                    <div class="panel-header"><span>状态流程图</span></div>
                    <div class="sim-flow-container">
                        <canvas id="sim-flow-canvas"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 底部状态栏 -->
    <div class="studio-statusbar">
        <span id="studio-status">就绪</span>
        <span class="studio-statusbar-right">
            <span id="studio-device">设备: -</span>
            <span id="studio-modified"></span>
        </span>
    </div>
</div>
