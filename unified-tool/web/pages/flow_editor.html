<!-- 流程编辑器页面 -->
<div class="page-container flow-editor-page">
    <div class="page-header">
        <h2>🔀 流程编辑器</h2>
        <div class="header-actions">
            <div id="flow-device-selector"></div>
            <button class="btn btn-primary" onclick="FlowEditor.save()">💾 保存</button>
        </div>
    </div>
    
    <div class="flow-editor-layout">
        <!-- 左侧：模式列表 -->
        <div class="flow-sidebar">
            <div class="flow-tabs">
                <button class="flow-tab active" data-tab="modes" onclick="FlowEditor.switchTab('modes')">📐 测量模式</button>
                <button class="flow-tab" data-tab="actions" onclick="FlowEditor.switchTab('actions')">⚡ 流程动作</button>
            </div>
            
            <div class="flow-list-header">
                <input type="text" id="flow-search" placeholder="搜索..." oninput="FlowEditor.filterList()">
                <button class="btn btn-sm" onclick="FlowEditor.addMode()">+ 新建</button>
            </div>
            
            <div class="flow-list" id="flow-list">
                <!-- 动态渲染 -->
            </div>
        </div>
        
        <!-- 中间：流程图/编辑区 -->
        <div class="flow-main">
            <div class="flow-canvas-container">
                <div class="flow-canvas-toolbar">
                    <span id="flow-canvas-title">选择一个模式查看流程</span>
                    <div class="flow-canvas-actions">
                        <button class="btn btn-sm" onclick="FlowEditor.zoomIn()" title="放大">🔍+</button>
                        <button class="btn btn-sm" onclick="FlowEditor.zoomOut()" title="缩小">🔍-</button>
                        <button class="btn btn-sm" onclick="FlowEditor.fitView()" title="适应">📐</button>
                    </div>
                </div>
                <canvas id="flow-canvas" width="800" height="500"></canvas>
            </div>
            
            <!-- 步骤编辑区 -->
            <div class="flow-steps-panel" id="flow-steps-panel" style="display:none;">
                <div class="flow-steps-header">
                    <h4>📋 步骤配置</h4>
                    <button class="btn btn-sm" onclick="FlowEditor.addStep()">+ 添加步骤</button>
                </div>
                <div class="flow-steps-list" id="flow-steps-list">
                    <!-- 动态渲染 -->
                </div>
            </div>
        </div>
        
        <!-- 右侧：属性面板 -->
        <div class="flow-props">
            <div class="flow-props-header">
                <span id="flow-props-title">属性</span>
                <span class="flow-props-badge" id="flow-props-badge"></span>
            </div>
            
            <div class="flow-props-content" id="flow-props-content">
                <div class="flow-empty-hint">
                    <div class="icon">📐</div>
                    <div>选择一个模式或动作</div>
                    <div class="sub">查看和编辑属性</div>
                </div>
            </div>
            
            <!-- 预览区 -->
            <div class="flow-preview" id="flow-preview">
                <h4>📄 JSON预览</h4>
                <pre id="flow-json-preview"></pre>
            </div>
        </div>
    </div>
</div>
